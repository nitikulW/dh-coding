<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DH Coding</title>
<meta name="author" content="680813017 ธนวัฒน์ ปี่บัว">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14141b;
    --panel:#1c1d27;
    --panel-2:#22232f;
    --line:#31323f;
    --text:#e7e7ee;
    --muted:#8b8b98;
    --kw:#c996f0;      /* keyword purple */
    --str:#7fd88f;      /* string green */
    --num:#f5a76b;      /* number orange */
    --fn:#6fb8f2;        /* function blue */
    --err:#f07a86;
    --ok:#7fd88f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,150,240,0.08), transparent),
      radial-gradient(1000px 500px at 100% 10%, rgba(111,184,242,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai','JetBrains Mono',monospace;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:16px 24px;border-bottom:1px solid var(--line);
    background:rgba(20,20,27,0.85);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:20;
  }
  .dots{display:flex;gap:6px;}
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#f07a86;} .dot.y{background:#f5c86b;} .dot.g{background:#7fd88f;}
  .topbar .path{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:13px;margin-left:6px;}
  .topbar .path b{color:var(--fn);font-weight:600;}
  .caret{display:inline-block;width:8px;height:16px;background:var(--kw);margin-left:2px;
    animation:blink 1.1s steps(1) infinite;vertical-align:-3px;}
  @keyframes blink{50%{opacity:0;}}

  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 80px;}

  /* ---------- hero ---------- */
  .hero{margin-bottom:44px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;color:var(--fn);font-size:13px;letter-spacing:.04em;}
  .eyebrow::before{content:"# ";color:var(--muted);}
  h1{font-size:clamp(28px,4vw,40px);margin:10px 0 12px;line-height:1.25;font-weight:700;}
  h1 .kw{color:var(--kw);} h1 .str{color:var(--str);}
  .hero p{color:var(--muted);font-size:15px;max-width:56ch;line-height:1.7;margin:0;}

  .center-hero{text-align:center;display:flex;flex-direction:column;align-items:center;}
  .center-hero p{max-width:48ch;margin:0 auto;}
  .hero-mascot{
    width:150px;height:auto;margin-bottom:6px;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,0.5));
    animation:mascotFloat 3.2s ease-in-out infinite;
  }
  .btn-lg{
    font-size:15px;padding:14px 28px;margin-top:18px;
    box-shadow:0 8px 24px rgba(201,150,240,0.22);
  }

  /* ---------- character select ---------- */
  .char-stage{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:40px 24px;text-align:center;
  }
  .char-pedestal{
    width:220px;height:220px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;position:relative;
    background:radial-gradient(circle at 50% 40%, rgba(201,150,240,0.16), transparent 70%);
    border:1px dashed var(--line);
  }
  .char-pedestal::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--kw);opacity:.35;
    animation:pulseRing 2.4s ease-in-out infinite;
  }
  @keyframes pulseRing{
    0%,100%{ transform:scale(0.94); opacity:.35; }
    50%{ transform:scale(1.02); opacity:.7; }
  }
  .char-img{width:180px;height:auto;animation:mascotFloat 3.2s ease-in-out infinite;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,0.5));}
  .char-name{margin:6px 0 4px;font-size:20px;font-family:'JetBrains Mono',monospace;}
  .char-tag{color:var(--str);font-weight:400;font-size:14px;}
  .char-desc{color:var(--muted);font-size:14px;max-width:46ch;margin:0 auto 22px;line-height:1.7;}
  .char-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
  .char-stage{transition:transform .18s,border-color .18s,box-shadow .18s;}
  .char-stage:hover{transform:translateY(-4px);border-color:var(--kw);}
  .char-stage.selected{box-shadow:0 0 0 2px rgba(201,150,240,.22),0 14px 30px rgba(0,0,0,.22);}
  .char-stage.python-character{
    border-color:rgba(74,222,128,.62);
    background:linear-gradient(145deg,rgba(34,197,94,.09),rgba(163,230,53,.04)),var(--panel);
  }
  .char-stage.python-character:hover{border-color:#4ade80;box-shadow:0 12px 30px rgba(34,197,94,.16);}
  .char-stage.python-character.selected{box-shadow:0 0 0 2px rgba(74,222,128,.25),0 14px 30px rgba(0,0,0,.22);}
  .char-stage.python-character .char-pedestal{
    background:radial-gradient(circle at 50% 40%,rgba(74,222,128,.2),transparent 70%);
  }
  .char-stage.python-character .char-pedestal::before{border-color:#4ade80;}
  .char-stage.python-character .char-tag{color:#a3e635;}
  .char-stage.python-character .btn{background:linear-gradient(135deg,#4ade80,#22c55e);color:#082013;}
  .char-stage.java-character{
    border-color:rgba(255,107,74,.65);
    background:linear-gradient(145deg,rgba(255,107,74,.08),rgba(255,183,77,.04)),var(--panel);
  }
  .char-stage.java-character:hover{border-color:#ff9f43;box-shadow:0 12px 30px rgba(255,107,74,.16);}
  .char-stage.java-character.selected{box-shadow:0 0 0 2px rgba(255,193,77,.25),0 14px 30px rgba(0,0,0,.22);}
  .char-stage.java-character .char-pedestal{
    background:radial-gradient(circle at 50% 40%,rgba(255,159,67,.2),transparent 70%);
  }
  .char-stage.java-character .char-pedestal::before{border-color:#ff9f43;}
  .char-stage.java-character .char-tag{color:#ffd166;}
  .char-stage.java-character .btn{background:linear-gradient(135deg,#ff9f43,#f05a3e);color:#24130b;}
  .selected-label{
    display:inline-block;margin-bottom:12px;padding:4px 9px;border-radius:999px;
    background:rgba(127,216,143,.12);color:var(--ok);font:700 11px 'JetBrains Mono',monospace;
  }

  body.theme-python{
    --kw:#4ade80;
    --str:#a3e635;
    --fn:#34d399;
    --ok:#86efac;
    background:
      radial-gradient(1200px 600px at 15% -10%,rgba(34,197,94,.11),transparent),
      radial-gradient(1000px 500px at 100% 10%,rgba(163,230,53,.07),transparent),
      var(--bg);
  }

  body.theme-java{
    --kw:#ff9f43;
    --str:#ffd166;
    --num:#ffb347;
    --fn:#ff6b4a;
    --err:#ff5a5f;
    --ok:#ffd166;
    background:
      radial-gradient(1200px 600px at 15% -10%,rgba(255,159,67,.11),transparent),
      radial-gradient(1000px 500px at 100% 10%,rgba(240,90,62,.09),transparent),
      var(--bg);
  }

  /* ---------- difficulty select ---------- */
  .diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .diff-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;cursor:pointer;transition:.18s;text-align:left;
  }
  .diff-card:hover{transform:translateY(-3px);}
  .diff-card h3{margin:12px 0 8px;font-family:'JetBrains Mono',monospace;font-size:17px;}
  .diff-card p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6;min-height:60px;}
  .diff-card .meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
  .diff-badge{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;
    padding:5px 10px;border-radius:999px;
  }
  .diff-easy{border-color:var(--ok);} .diff-easy:hover{border-color:var(--ok);box-shadow:0 8px 22px rgba(127,216,143,0.15);}
  .diff-easy .diff-badge{background:rgba(127,216,143,0.14);color:var(--ok);}
  .diff-medium{border-color:var(--num);} .diff-medium:hover{border-color:var(--num);box-shadow:0 8px 22px rgba(245,167,107,0.15);}
  .diff-medium .diff-badge{background:rgba(245,167,107,0.14);color:var(--num);}
  .diff-hard{border-color:var(--err);} .diff-hard:hover{border-color:var(--err);box-shadow:0 8px 22px rgba(240,122,134,0.15);}
  .diff-hard .diff-badge{background:rgba(240,122,134,0.14);color:var(--err);}

  /* ---------- quiz card list ---------- */
  .section-label{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;
    text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px;}
  .cards{display:flex;flex-direction:column;gap:14px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;transition:border-color .18s, transform .18s;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .card:hover{border-color:var(--kw);}
  .card-left{display:flex;align-items:flex-start;gap:14px;min-width:0;}
  .file-icon{
    width:36px;height:36px;border-radius:8px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-family:'JetBrains Mono',monospace;color:var(--fn);font-weight:700;font-size:13px;
    border:1px solid var(--line);
  }
  .card h3{margin:0 0 4px;font-size:17px;font-family:'JetBrains Mono',monospace;font-weight:600;}
  .card h3 span{color:var(--muted);font-weight:400;}
  .card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .meta{display:flex;gap:14px;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
  .meta b{color:var(--str);}
  .btn{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13.5px;
    background:var(--kw);color:#1a0f24;border:none;border-radius:8px;
    padding:11px 18px;cursor:pointer;white-space:nowrap;transition:transform .12s, box-shadow .12s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,150,240,0.25);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--fn);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

  .soon{opacity:.5;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);
    border:1px dashed var(--line);border-radius:999px;padding:3px 9px;}

  /* ---------- config panel ---------- */
  .config{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:24px;margin-top:18px;
  }
  .config h4{margin:0 0 4px;font-size:15px;font-family:'JetBrains Mono',monospace;}
  .config .hint{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:600;
    padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);cursor:pointer;transition:.15s;
  }
  .chip.active{border-color:var(--kw);color:var(--kw);background:rgba(201,150,240,0.08);}
  .chip:hover{border-color:var(--fn);}
  .config-actions{display:flex;gap:10px;}

  /* ---------- quiz screen ---------- */
  .quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap;}
  .progress-wrap{flex:1;min-width:180px;}
  .progress-text{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .progress-text b{color:var(--str);}
  .bar{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--kw),var(--fn));transition:width .25s;}

  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;}
  .qnum{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:13px;margin-bottom:10px;}
  .qnum b{color:var(--num);}
  .qtext{font-size:19px;font-weight:600;line-height:1.6;margin:0 0 22px;}
  .qtext .comment{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:14px;display:block;margin-bottom:8px;font-weight:400;}

  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);cursor:pointer;transition:.15s;
  }
  .opt:hover{border-color:var(--fn);}
  .opt.selected{border-color:var(--kw);background:rgba(201,150,240,0.08);}
  .opt.correct{border-color:var(--ok);background:rgba(127,216,143,0.1);}
  .opt.wrong{border-color:var(--err);background:rgba(240,122,134,0.1);}
  .opt .letter{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;
    width:26px;height:26px;border-radius:6px;background:var(--panel);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .opt.selected .letter{border-color:var(--kw);color:var(--kw);}
  .opt.correct .letter{border-color:var(--ok);color:var(--ok);}
  .opt.wrong .letter{border-color:var(--err);color:var(--err);}
  /* ฟอนต์โค้ดช่วยแยก ( ) { } << >> ได้ชัด ส่วนภาษาไทยใช้ฟอนต์สำรอง */
  .opt .otext{font-family:'JetBrains Mono','IBM Plex Sans Thai',monospace;font-size:14.5px;line-height:1.5;padding-top:3px;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .nav-row .right{display:flex;gap:10px;}

  /* ---------- results ---------- */
  .result-hero{text-align:center;padding:36px 20px 8px;}
  .score-ring{
    width:150px;height:150px;border-radius:50%;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;position:relative;
    background:conic-gradient(var(--kw) calc(var(--pct)*1%), var(--panel-2) 0);
  }
  .score-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg);}
  .score-ring .num{position:relative;font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;}
  .score-ring .num small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
  .result-line{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:14px;margin-bottom:30px;}
  .result-line b{color:var(--text);}
  .review-item{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-bottom:12px;
  }
  .review-item .rq{font-weight:600;margin:0 0 10px;font-size:15px;}
  .review-row{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:4px;font-family:'JetBrains Mono',monospace;}
  .review-row .tag{flex-shrink:0;font-weight:700;}
  .review-row.correctrow .tag{color:var(--ok);}
  .review-row.wrongrow .tag{color:var(--err);}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 24px;font-family:'JetBrains Mono',monospace;}

  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
  :focus-visible{outline:2px solid var(--fn);outline-offset:2px;}

  /* ---------- exit confirm overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,14,0.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:26px;max-width:360px;width:100%;
  }
  .overlay-card h4{margin:0 0 8px;font-size:16px;font-family:'JetBrains Mono',monospace;}
  .overlay-card p{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .overlay-actions{display:flex;gap:10px;justify-content:flex-end;}

  /* ---------- floating mascot ---------- */
  .mascot{
    position:fixed;right:18px;bottom:14px;width:96px;height:auto;
    pointer-events:none;z-index:15;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,0.45));
    animation:mascotFloat 3.2s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes mascotFloat{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-14px) rotate(2deg); }
  }
  @media (max-width:640px){
    .mascot{ width:64px; right:10px; bottom:10px; }
    .wrap{padding:28px 16px 70px;}
    .char-grid{grid-template-columns:1fr;}
    .char-stage{padding:28px 18px;}
    .char-pedestal{width:190px;height:190px;}
    .char-img{max-height:165px;}
    .qcard{padding:20px 16px;}
    .nav-row{align-items:stretch;}
    .nav-row .right,.nav-row .btn{flex:1;}
  }

  /* ================= CODE CATS ADVENTURE ================= */
  :root{
    --navy:#081027;
    --navy-2:#101a3a;
    --navy-3:#18244a;
    --purple:#8b6cff;
    --purple-dark:#5636c7;
    --mint:#70f2bd;
    --yellow:#ffd45f;
    --white:#f7f8ff;
    --shadow:#030713;
    --pixel-border:#050a1d;
    --soft-line:#33406b;
  }
  html{scroll-behavior:smooth;}
  body,
  body.theme-python,
  body.theme-java{
    margin:0;
    color:var(--white);
    font-family:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
    background:
      radial-gradient(circle at 12% 12%,rgba(139,108,255,.18),transparent 28rem),
      radial-gradient(circle at 90% 28%,rgba(112,242,189,.09),transparent 25rem),
      var(--navy);
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.13;
    z-index:-1;
    background-image:
      linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:24px 24px;
  }
  button{font:inherit;}
  .topbar{display:none;}
  .game-header{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(8,16,39,.94);
    border-bottom:3px solid var(--purple);
    box-shadow:0 5px 0 var(--shadow);
    backdrop-filter:blur(12px);
  }
  .navbar{
    width:min(1180px,calc(100% - 32px));
    min-height:70px;
    margin:0 auto;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:24px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    color:var(--white);
    background:none;
    border:0;
    padding:7px 0;
    cursor:pointer;
  }
  .brand-mark{
    width:40px;
    aspect-ratio:1;
    display:grid;
    place-items:center;
    border:3px solid var(--pixel-border);
    border-radius:10px;
    background:var(--yellow);
    color:var(--navy);
    font:800 19px 'JetBrains Mono',monospace;
    box-shadow:4px 4px 0 var(--purple-dark);
    transform:rotate(-3deg);
  }
  .brand-copy{display:grid;text-align:left;line-height:1.05;}
  .brand-copy strong{font:400 12px 'Press Start 2P','JetBrains Mono',monospace;color:var(--mint);}
  .brand-copy small{margin-top:6px;color:#aab4da;font-size:12px;letter-spacing:.08em;}
  .nav-links{display:flex;align-items:center;justify-content:center;gap:6px;}
  .nav-link{
    border:2px solid transparent;
    border-radius:9px;
    background:transparent;
    color:#b7c1e7;
    padding:9px 14px;
    font-weight:700;
    cursor:pointer;
    transition:color .15s,background .15s,transform .15s;
  }
  .nav-link:hover,.nav-link.active{color:var(--navy);background:var(--mint);transform:translateY(-2px);}
  /* ---- Quiz language dropdown ---- */
  .nav-dropdown{position:relative;display:inline-flex;}
  .nav-dropdown-toggle{display:inline-flex;align-items:center;gap:6px;}
  .nav-dropdown.open .nav-dropdown-toggle,.nav-dropdown-toggle.active{color:var(--navy);background:var(--mint);}
  .nav-caret{font-size:11px;transition:transform .16s;}
  .nav-dropdown:hover .nav-caret,.nav-dropdown.open .nav-caret{transform:translateY(1px) rotate(180deg);}
  .nav-dropdown-menu{
    position:absolute;top:calc(100% + 10px);left:0;min-width:230px;
    display:flex;flex-direction:column;gap:5px;padding:9px;
    border:3px solid var(--pixel-border);border-radius:12px;
    background:#0c1636;box-shadow:6px 8px 0 var(--shadow),0 0 0 3px rgba(139,108,255,.35);
    opacity:0;visibility:hidden;transform:translateY(-8px);
    /* หน่วงตอนปิดเล็กน้อย เผื่อเมาส์หลุดออกนอกเมนูชั่วขณะ */
    transition:opacity .16s ease .15s,transform .16s ease .15s,visibility 0s linear .31s;z-index:60;
  }
  .nav-dropdown-menu::before{content:"";position:absolute;bottom:100%;left:22px;border:7px solid transparent;border-bottom-color:var(--pixel-border);}
  /* สะพานโปร่งใสปิดช่องว่าง 10px ระหว่างปุ่ม Quiz กับเมนู ให้ hover ไม่หลุดตอนเลื่อนเมาส์ลง */
  .nav-dropdown-menu::after{content:"";position:absolute;left:-3px;right:-3px;bottom:100%;height:16px;}
  .nav-dropdown:hover .nav-dropdown-menu,
  .nav-dropdown:has(:focus-visible) .nav-dropdown-menu,
  .nav-dropdown.open .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;transition-delay:0s;}
  .nav-dropdown-head{font:400 8px 'Press Start 2P','JetBrains Mono',monospace;color:var(--mint);padding:4px 8px 6px;letter-spacing:.02em;}
  .nav-dropdown-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:2px solid transparent;border-radius:8px;background:transparent;
    color:#dce3ff;padding:9px 10px;font-weight:700;font-size:14px;cursor:pointer;
    transition:background .14s,border-color .14s,transform .14s;
  }
  .nav-dropdown-item .item-icon{
    width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;
    border:2px solid var(--pixel-border);border-radius:7px;background:var(--navy-3);
    font:800 12px 'JetBrains Mono',monospace;color:var(--white);
  }
  .nav-dropdown-item .item-name{flex:1;}
  .nav-dropdown-item.available:hover,.nav-dropdown-item.available:focus-visible{background:var(--navy-3);border-color:var(--mint);transform:translateX(2px);}
  .nav-dropdown-item.available .item-icon{background:var(--mint);color:var(--navy);}
  .nav-dropdown-item.locked{opacity:.55;cursor:not-allowed;filter:saturate(.5);}
  .nav-dropdown-item .item-soon{
    font:700 7px 'Press Start 2P','JetBrains Mono',monospace;line-height:1;
    padding:4px 5px;border:2px solid var(--pixel-border);border-radius:5px;
    background:var(--yellow);color:var(--navy);
  }
  /* ---- Minigame (Flappy) ---- */
  .minigame-page{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:6px;}
  .mini-head{text-align:center;max-width:560px;}
  .mini-head h1{margin:6px 0 8px;font-size:clamp(1.8rem,3.6vw,2.8rem);text-shadow:3px 3px 0 var(--purple-dark);}
  .mini-head p{margin:0;color:#aeb9df;font-size:.95rem;line-height:1.6;}
  .mini-charbar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
  .mini-chip{
    display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;padding:8px 6px;cursor:pointer;
    border:3px solid var(--pixel-border);border-radius:12px;background:#101a3a;color:#cdd6f5;
    box-shadow:3px 3px 0 var(--shadow);transition:transform .13s,border-color .13s,background .13s;
  }
  .mini-chip:hover{transform:translateY(-2px);border-color:var(--mint);}
  .mini-chip.selected{border-color:var(--yellow);background:#1a2650;box-shadow:3px 3px 0 var(--purple-dark);}
  .mini-chip svg{width:44px;height:44px;}
  .mini-chip span{font:700 11px 'JetBrains Mono',monospace;}
  .mini-stage{
    position:relative;width:100%;max-width:380px;aspect-ratio:320/480;
    border:4px solid var(--pixel-border);border-radius:20px;overflow:hidden;
    box-shadow:8px 8px 0 var(--shadow),0 0 0 3px var(--purple);background:#0b1533;
  }
  #miniCanvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer;}
  .mini-overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:24px;background:rgba(8,16,39,.72);backdrop-filter:blur(2px);
  }
  .mini-overlay[data-phase="playing"]{display:none;}
  .mini-overlay h2{margin:0;font-size:1.5rem;text-shadow:2px 2px 0 var(--purple-dark);}
  .mini-overlay .mini-score-big{font:800 2.6rem 'JetBrains Mono',monospace;color:var(--yellow);line-height:1;}
  .mini-overlay .mini-sub{color:#c9d2f2;font-size:.9rem;line-height:1.6;}
  .mini-overlay .mini-sub b{color:var(--mint);}
  .mini-overlay .mini-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .mini-hint{color:#8f9bc6;font:600 12px 'JetBrains Mono',monospace;}
  @media (max-width:640px){ .mini-chip{width:64px;} .mini-chip svg{width:38px;height:38px;} }
  .route-label{
    justify-self:end;
    color:#8e9ac8;
    font:600 11px 'JetBrains Mono',monospace;
    max-width:210px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .route-label b{color:var(--yellow);}
  .caret{width:7px;height:14px;background:var(--mint);}
  .xp-track{
    height:12px;
    border:2px solid var(--pixel-border);
    border-radius:5px;
    background:#202a50;
    overflow:hidden;
    box-shadow:2px 2px 0 rgba(0,0,0,.3);
  }
  .xp-fill{
    height:100%;
    background:repeating-linear-gradient(90deg,var(--mint) 0 12px,#53dca5 12px 16px);
    transition:width .35s ease;
  }
  /* แถบว่างใต้เมนู (เอาตัวเลข CORRECT/STREAK ออกแล้ว เก็บไว้แค่แถบ) */
  .player-hud{
    height:50px;
    border-top:1px solid rgba(112,242,189,.18);
    background:#0b1430;
  }
  @media (max-width:720px){ .player-hud{height:14px;} }
  .wrap{width:min(1180px,calc(100% - 32px));max-width:none;margin:0 auto;padding:42px 0 88px;}

  /* Hero world */
  .hero-world{
    min-height:640px;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
    border:4px solid var(--pixel-border);
    border-radius:24px;
    background:
      linear-gradient(180deg,rgba(5,9,25,.2),rgba(5,9,25,.3)),
      url('code-cats-world.webp') center/cover no-repeat;
    box-shadow:10px 10px 0 #030713,0 0 0 3px var(--purple);
    isolation:isolate;
  }
  .hero-world::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:linear-gradient(90deg,rgba(4,8,24,.26),rgba(4,8,24,.58) 35%,rgba(4,8,24,.58) 65%,rgba(4,8,24,.26));
  }
  .hero-grid{
    width:100%;
    padding:44px 30px 26px;
    display:grid;
    grid-template-columns:minmax(160px,.8fr) minmax(360px,1.4fr) minmax(160px,.8fr);
    align-items:end;
    gap:14px;
  }
  .hero-copy{
    align-self:center;
    text-align:center;
    padding:32px 24px;
    border:3px solid rgba(112,242,189,.8);
    border-radius:18px;
    background:rgba(8,16,39,.86);
    box-shadow:7px 7px 0 rgba(3,7,19,.88);
  }
  .pixel-kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:0 0 18px;
    padding:7px 10px;
    border:2px solid var(--yellow);
    border-radius:7px;
    background:#251c4a;
    color:var(--yellow);
    font:400 10px 'Press Start 2P','JetBrains Mono',monospace;
    box-shadow:3px 3px 0 var(--shadow);
  }
  .hero-copy h1{
    margin:0;
    font-size:clamp(2rem,4.6vw,4.5rem);
    line-height:1.13;
    letter-spacing:-.04em;
    text-wrap:balance;
    text-shadow:3px 3px 0 var(--purple-dark);
  }
  .hero-copy h1 .accent{color:var(--mint);display:block;}
  .hero-copy p{max-width:46ch;margin:18px auto 0;color:#d2d8f0;font-size:1.05rem;line-height:1.7;}
  .hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px;}
  .game-btn,.btn{
    appearance:none;
    border:3px solid var(--pixel-border);
    border-radius:10px;
    background:var(--yellow);
    color:#171329;
    padding:12px 20px;
    font-family:'Chakra Petch',sans-serif;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--purple-dark);
    transition:transform .13s,box-shadow .13s,filter .13s;
  }
  .game-btn:hover,.btn:hover{transform:translate(-2px,-3px);box-shadow:7px 8px 0 var(--purple-dark);filter:brightness(1.05);}
  .game-btn:active,.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--purple-dark);}
  .game-btn.secondary,.btn.ghost{background:var(--navy-3);color:var(--white);border-color:var(--mint);box-shadow:5px 5px 0 #163b42;}
  .btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 #11162b;}
  .hero-character{
    position:relative;
    text-align:center;
    animation:characterBob 3.2s steps(4,end) infinite;
  }
  .hero-character.java{animation-delay:-1.4s;}
  .hero-character img{
    width:100%;
    max-height:330px;
    object-fit:contain;
    filter:drop-shadow(8px 10px 0 rgba(5,8,20,.54));
  }
  .hero-character .nameplate{
    display:inline-flex;
    margin-top:-20px;
    position:relative;
    padding:7px 11px;
    border:3px solid var(--pixel-border);
    border-radius:8px;
    background:var(--purple);
    color:#fff;
    font:700 12px 'JetBrains Mono',monospace;
    box-shadow:4px 4px 0 var(--shadow);
  }
  @keyframes characterBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .hero-mini-stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:17px;}
  .hero-mini-stats span{padding:6px 9px;border:2px solid #36446f;border-radius:6px;background:#101938;color:#bec8ed;font:600 11px 'JetBrains Mono',monospace;}

  /* Page headings and adventure map */
  .page-heading{text-align:center;margin:0 auto 32px;max-width:760px;}
  .page-heading h1{margin:10px 0 12px;font-size:clamp(2rem,4vw,3.4rem);line-height:1.18;text-shadow:3px 3px 0 var(--purple-dark);}
  .page-heading p{margin:0;color:#aeb9df;font-size:1rem;line-height:1.7;}
  .eyebrow{color:var(--mint);font:400 10px 'Press Start 2P','JetBrains Mono',monospace;letter-spacing:0;}
  .eyebrow::before{content:'// ';color:var(--yellow);}
  .adventure-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;}
  .route-zone{
    position:relative;
    overflow:hidden;
    border:4px solid var(--pixel-border);
    border-radius:20px;
    padding:26px;
    background:linear-gradient(145deg,rgba(112,242,189,.13),rgba(16,26,58,.97) 48%);
    box-shadow:8px 8px 0 var(--shadow),0 0 0 3px #287b68;
  }
  .route-zone.java-route{background:linear-gradient(145deg,rgba(255,212,95,.14),rgba(30,22,60,.97) 48%);box-shadow:8px 8px 0 var(--shadow),0 0 0 3px #7559db;}
  .route-zone::before{content:'PY';position:absolute;right:14px;top:8px;color:rgba(112,242,189,.08);font:800 74px 'JetBrains Mono',monospace;}
  .route-zone.java-route::before{content:'JV';color:rgba(255,212,95,.08);}
  .route-head{position:relative;display:grid;grid-template-columns:96px 1fr;align-items:center;gap:18px;margin-bottom:26px;}
  .route-avatar{width:96px;height:96px;object-fit:contain;border:3px solid var(--pixel-border);border-radius:14px;background:#1e2b52;box-shadow:4px 4px 0 #163b42;}
  .java-route .route-avatar{box-shadow:4px 4px 0 #6a4821;}
  .route-head h2{margin:0 0 4px;font-size:1.7rem;}
  .route-head p{margin:0;color:#aeb9df;line-height:1.5;}
  .stage-trail{position:relative;display:grid;gap:14px;padding-left:18px;}
  .stage-trail::before{content:"";position:absolute;left:38px;top:30px;bottom:30px;width:5px;background:repeating-linear-gradient(180deg,var(--mint) 0 9px,transparent 9px 16px);}
  .java-route .stage-trail::before{background:repeating-linear-gradient(180deg,var(--yellow) 0 9px,transparent 9px 16px);}
  .stage-node{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:46px 1fr auto;
    align-items:center;
    gap:12px;
    min-height:72px;
    width:100%;
    padding:10px 13px;
    text-align:left;
    border:3px solid var(--pixel-border);
    border-radius:12px;
    background:#172347;
    color:var(--white);
    box-shadow:5px 5px 0 #07101f,0 0 14px rgba(112,242,189,.18);
    cursor:pointer;
    transition:transform .15s,box-shadow .15s,border-color .15s;
  }
  .stage-node:hover,.stage-node:focus-visible{transform:translate(5px,-4px);border-color:var(--mint);box-shadow:7px 8px 0 #07101f,0 0 24px rgba(112,242,189,.55);}
  .java-route .stage-node:hover,.java-route .stage-node:focus-visible{border-color:var(--yellow);box-shadow:7px 8px 0 #07101f,0 0 24px rgba(255,212,95,.5);}
  .stage-icon{width:44px;height:44px;display:grid;place-items:center;border:3px solid var(--pixel-border);border-radius:50%;background:var(--mint);color:var(--navy);font:800 15px 'JetBrains Mono',monospace;box-shadow:3px 3px 0 #173f49;}
  .java-route .stage-icon{background:var(--yellow);box-shadow:3px 3px 0 #6a4821;}
  .stage-copy strong{display:block;font:800 15px 'JetBrains Mono',monospace;}
  .stage-copy small{display:block;margin-top:3px;color:#aeb9df;font-size:12px;}
  .stage-status{color:var(--mint);font:700 10px 'Press Start 2P','JetBrains Mono',monospace;}
  .java-route .stage-status{color:var(--yellow);}

  /* Shared game panels */
  .quest-banner{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:16px;margin-bottom:24px;padding:16px 18px;border:3px solid var(--pixel-border);border-radius:14px;background:var(--navy-2);box-shadow:6px 6px 0 var(--shadow);}
  .quest-banner img{width:82px;height:82px;object-fit:contain;background:#1c2850;border:2px solid var(--soft-line);border-radius:10px;}
  .quest-banner h1{margin:0 0 5px;font-size:clamp(1.35rem,3vw,2.2rem);}
  .quest-banner p{margin:0;color:#aeb9df;}
  .config,.qcard,.review-item,.overlay-card{
    background:linear-gradient(145deg,#121d40,#0d1734);
    border:3px solid var(--pixel-border);
    border-radius:16px;
    box-shadow:7px 7px 0 var(--shadow),0 0 0 2px var(--purple-dark);
  }
  .config{padding:28px;margin-top:0;}
  .config h4{font-size:1rem;color:var(--mint);}
  .config .hint{color:#aeb9df;font-size:14px;}
  .chip-row{gap:12px;}
  .chip{border:3px solid var(--pixel-border);border-radius:9px;background:#1b2850;color:#fff;box-shadow:4px 4px 0 #050a1d;padding:10px 16px;}
  .chip.active,.chip:hover{border-color:var(--mint);color:var(--mint);background:#162542;transform:translateY(-2px);}
  .config-actions{gap:12px;flex-wrap:wrap;}
  .quiz-head{padding:13px 16px;border:3px solid var(--pixel-border);border-radius:12px;background:#101a3a;box-shadow:5px 5px 0 var(--shadow);}
  .progress-text{font-size:13px;color:#9eabd7;}
  .progress-text b{color:var(--yellow);}
  .quiz-head .bar{height:12px;border:2px solid var(--pixel-border);border-radius:5px;background:#26305b;}
  .quiz-head .bar-fill{background:repeating-linear-gradient(90deg,var(--purple) 0 13px,var(--mint) 13px 17px);}
  .qcard{padding:30px;}
  .qnum{color:#96a3d0;}
  .qnum b{color:var(--yellow);}
  .qtext{font-size:clamp(1.05rem,2.2vw,1.3rem);}
  .options{gap:13px;}
  .opt{border:3px solid var(--pixel-border);border-radius:10px;background:#18244a;box-shadow:4px 4px 0 #050a1d;padding:14px 16px;}
  .opt:hover{border-color:var(--mint);transform:translateX(3px);}
  .opt.selected{border-color:var(--yellow);background:#302a50;box-shadow:4px 4px 0 #6b5120;}
  .opt .letter{border:2px solid #44517c;border-radius:6px;background:#0e1734;color:var(--mint);}
  .opt.selected .letter{border-color:var(--yellow);color:var(--yellow);}
  .result-hero{padding-top:8px;}
  .score-ring{width:170px;height:170px;border:4px solid var(--pixel-border);box-shadow:7px 7px 0 var(--shadow);background:conic-gradient(var(--mint) calc(var(--pct)*1%),#222d55 0);}
  .score-ring::before{inset:12px;background:var(--navy);}
  .score-ring .num{font-size:32px;color:var(--yellow);}
  .reward-banner{width:max-content;max-width:100%;margin:0 auto 18px;padding:9px 14px;border:3px solid var(--pixel-border);border-radius:9px;background:var(--purple);color:#fff;font:700 13px 'Press Start 2P','JetBrains Mono',monospace;box-shadow:5px 5px 0 var(--shadow);}
  .section-label{margin:24px 0 14px;color:var(--mint);font-size:12px;}
  .review-item{padding:19px 20px;margin-bottom:14px;box-shadow:5px 5px 0 var(--shadow);}
  .overlay{background:rgba(3,7,19,.82);}
  .overlay-card{padding:26px;}

  /* Progress page */
  .progress-vault{display:grid;grid-template-columns:290px 1fr;gap:24px;}
  .level-panel,.progress-panel{border:4px solid var(--pixel-border);border-radius:18px;background:linear-gradient(145deg,#192550,#101936);box-shadow:8px 8px 0 var(--shadow);padding:26px;}
  .level-panel{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .level-orb{width:150px;height:150px;display:grid;place-items:center;border:5px solid var(--pixel-border);border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9a8ff,var(--purple) 45%,var(--purple-dark));box-shadow:7px 7px 0 #060914,0 0 28px rgba(139,108,255,.45);}
  .level-orb span{font:400 12px 'Press Start 2P','JetBrains Mono',monospace;}
  .level-orb strong{display:block;margin-top:7px;font:800 44px 'JetBrains Mono',monospace;color:var(--yellow);}
  .level-panel h2{margin:22px 0 5px;}
  .level-panel p{margin:0;color:#aeb9df;}
  .progress-panel h2{margin:0 0 18px;}
  .progress-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .progress-stat{padding:16px;border:3px solid var(--pixel-border);border-radius:11px;background:#1b2850;box-shadow:4px 4px 0 #070b1c;}
  .progress-stat span{display:block;color:#9ba8d4;font-size:13px;}
  .progress-stat strong{display:block;margin-top:5px;color:var(--yellow);font:800 25px 'JetBrains Mono',monospace;}
  .progress-stat.correct strong{color:var(--mint);}
  .xp-section{padding:19px;border:3px solid var(--pixel-border);border-radius:12px;background:#0d1734;}
  .xp-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;font-weight:700;}
  .xp-title span:last-child{color:var(--mint);font-family:'JetBrains Mono',monospace;}
  .xp-track{height:18px;}
  .realm-records{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
  .realm-record{padding:14px;border:2px solid #35426e;border-radius:10px;background:#152044;}
  .realm-record strong{display:block;margin-bottom:4px;}
  .realm-record span{color:#aeb9df;font-size:13px;}

  .mascot{width:86px;right:18px;bottom:16px;z-index:30;filter:drop-shadow(6px 7px 0 rgba(3,7,19,.7));}
  /* จอมือถือ: ซ่อนแมวลอยเพราะบังตัวเลือกของ Quiz (หัวหน้า Quiz มีรูปแมวอยู่แล้ว) */
  @media (max-width:720px){ .mascot{display:none;} }
  footer{padding:28px 20px 34px;color:#8290bd;font-size:12px;border-top:1px solid rgba(139,108,255,.18);}
  .footer-credit{margin-top:6px;color:#6f7caa;font-size:11px;}
  :focus-visible{outline:3px solid var(--yellow);outline-offset:3px;}

  @media (max-width:960px){
    .navbar{grid-template-columns:auto 1fr;}
    .route-label{display:none;}
    .hero-world{min-height:600px;}
    .hero-grid{grid-template-columns:140px 1fr 140px;padding-inline:16px;}
    .hero-character img{max-height:230px;}
    .adventure-map{grid-template-columns:1fr;}
    .progress-vault{grid-template-columns:240px 1fr;}
  }
  @media (max-width:720px){
    .game-header{position:relative;}
    .navbar{width:min(100% - 24px,1180px);grid-template-columns:1fr;gap:10px;padding:12px 0;}
    .brand{justify-self:center;}
    .nav-links{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
    .nav-link{padding:8px 4px;font-size:13px;}
    .wrap{width:calc(100% - 24px);padding:26px 0 70px;}
    .hero-world{min-height:680px;border-radius:18px;}
    .hero-grid{grid-template-columns:1fr 1fr;grid-template-areas:'copy copy' 'python java';align-items:end;padding:24px 12px 18px;}
    .hero-copy{grid-area:copy;padding:24px 16px;}
    .hero-character.python{grid-area:python;}
    .hero-character.java{grid-area:java;}
    .hero-character img{max-height:190px;}
    .hero-character .nameplate{font-size:10px;}

  /* ================= LEARNING PLATFORM ================= */
  .nav-link{font-size:14px;}
  .stage-node.locked{
    opacity:.5;cursor:not-allowed;filter:grayscale(.75);box-shadow:4px 4px 0 #07101f;
  }
  .stage-node.locked:hover,.stage-node.locked:focus-visible{
    transform:none;border-color:var(--pixel-border);box-shadow:4px 4px 0 #07101f;
  }
  .stage-node.completed{border-color:var(--mint);background:linear-gradient(135deg,#153f46,#172347);}
  .java-route .stage-node.completed{border-color:var(--yellow);background:linear-gradient(135deg,#4b3d28,#172347);}
  .stage-node.completed .stage-icon{background:var(--mint);}
  .stage-node.locked .stage-icon{background:#5f6888;color:#d1d5e5;box-shadow:3px 3px 0 #252a3c;}
  .stage-status.completed{color:var(--mint);}
  .stage-status.locked{color:#8993b8;}
  .daily-card{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
    margin-top:24px;padding:18px 20px;border:3px solid var(--pixel-border);border-radius:14px;
    background:linear-gradient(135deg,#2d2259,#111a3a);box-shadow:6px 6px 0 var(--shadow),0 0 0 2px var(--yellow);
  }
  .daily-icon{width:52px;height:52px;display:grid;place-items:center;border:3px solid var(--pixel-border);border-radius:10px;background:var(--yellow);font-size:25px;box-shadow:3px 3px 0 #6a4821;}
  .daily-copy strong{display:block;font-size:1.05rem;}
  .daily-copy span{display:block;margin-top:4px;color:#b9c3e8;}
  .daily-reward{color:var(--yellow);font:700 13px 'Press Start 2P','JetBrains Mono',monospace;text-align:right;}
  .daily-reward small{display:block;margin-top:6px;color:var(--mint);font:600 12px 'Chakra Petch',sans-serif;}
  .content-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .language-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:2px solid #3a4774;border-radius:999px;color:#aeb9df;font:700 11px 'JetBrains Mono',monospace;}
  .status-pill.done{border-color:var(--mint);color:var(--mint);background:rgba(112,242,189,.08);}
  .status-pill.available{border-color:var(--yellow);color:var(--yellow);}
  .status-pill.locked{color:#8490b7;}
  .lesson-grid,.lab-grid,.cheat-grid,.project-grid,.badge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
  .lesson-card,.lab-card,.cheat-card,.project-card,.badge-card{
    border:3px solid var(--pixel-border);border-radius:15px;background:linear-gradient(145deg,#17244a,#0e1835);
    box-shadow:6px 6px 0 var(--shadow);padding:20px;min-width:0;
  }
  .lesson-card.completed,.lab-card.completed,.project-card.completed{border-color:var(--mint);box-shadow:6px 6px 0 #0c2728;}
  .lesson-top,.lab-top,.project-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .lesson-number{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border:3px solid var(--pixel-border);border-radius:9px;background:var(--purple);color:white;font:800 16px 'JetBrains Mono',monospace;box-shadow:3px 3px 0 var(--shadow);}
  .lesson-card h2,.lab-card h2,.project-card h2{margin:0;font-size:1.25rem;line-height:1.3;}
  .lesson-card p,.lab-card p,.project-card p{color:#b9c3e8;line-height:1.65;}
  .code-block{position:relative;margin:14px 0;border:3px solid #060a1c;border-radius:10px;background:#080e22;overflow:auto;box-shadow:inset 0 0 0 1px #303b68;}
  .code-block::before{content:'CODE';display:block;padding:7px 10px;border-bottom:1px solid #303b68;color:var(--mint);font:700 10px 'Press Start 2P','JetBrains Mono',monospace;background:#111a37;}
  .code-block pre{margin:0;padding:14px;min-width:max-content;color:#e7e9ff;font:500 13px/1.65 'JetBrains Mono',monospace;white-space:pre;}
  .lab-type{display:inline-flex;padding:5px 8px;border:2px solid var(--purple);border-radius:6px;color:#c5b9ff;font:700 11px 'JetBrains Mono',monospace;background:rgba(139,108,255,.1);}
  .lab-type.order{border-color:var(--yellow);color:var(--yellow);}
  .lab-type.bug{border-color:#ff7390;color:#ff9daf;}
  .lab-workspace{border:4px solid var(--pixel-border);border-radius:18px;background:linear-gradient(145deg,#131f43,#0a132d);box-shadow:8px 8px 0 var(--shadow);padding:26px;}
  .lab-workspace h2{margin:0 0 8px;font-size:clamp(1.4rem,3vw,2.2rem);}
  .lab-instruction{margin:0 0 20px;color:#b9c3e8;line-height:1.7;}
  .fill-code{padding:18px;border:3px solid #070b1d;border-radius:11px;background:#080e22;color:#e9ebff;font:600 14px/1.7 'JetBrains Mono',monospace;overflow:auto;white-space:pre-wrap;}
  .code-input,.cheat-search{
    width:100%;margin-top:14px;border:3px solid var(--pixel-border);border-radius:10px;background:#f7f8ff;color:#10152b;
    padding:13px 14px;font:600 15px/1.5 'JetBrains Mono',monospace;box-shadow:4px 4px 0 var(--purple-dark);
  }
  textarea.code-input{min-height:170px;resize:vertical;white-space:pre;font-size:13px;}
  .order-list{display:grid;gap:10px;margin:18px 0;}
  .order-line{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px;border:3px solid var(--pixel-border);border-radius:9px;background:#1a2750;box-shadow:3px 3px 0 #050916;}
  .order-line code{overflow:auto;white-space:pre;color:#f0f2ff;font:600 13px 'JetBrains Mono',monospace;}
  .order-index{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;background:var(--purple);font:800 13px 'JetBrains Mono',monospace;}
  .order-controls{display:flex;gap:5px;}
  .order-btn{width:32px;height:32px;border:2px solid var(--pixel-border);border-radius:6px;background:var(--yellow);color:#151126;font-weight:800;cursor:pointer;}
  .feedback{margin-top:18px;padding:15px 17px;border:3px solid #45527f;border-radius:10px;background:#141f42;line-height:1.6;}
  .feedback.success{border-color:var(--mint);background:#12353a;color:#dffff2;}
  .feedback.error{border-color:#ff7390;background:#3a1b35;color:#ffe4eb;}
  .feedback.hint{border-color:var(--yellow);background:#3b3320;color:#fff3c5;}
  .lab-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:18px;}
  .quiz-select-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
  .quiz-select-card{border:3px solid var(--pixel-border);border-radius:14px;padding:20px;background:#152145;box-shadow:6px 6px 0 var(--shadow);}
  .quiz-select-card h2{margin:12px 0 8px;}
  .quiz-select-card p{color:#afbadf;line-height:1.55;min-height:74px;}
  .cheat-search-wrap{max-width:680px;margin:0 auto 26px;}
  .cheat-search{margin:0;box-shadow:5px 5px 0 var(--purple-dark);}
  .cheat-card[hidden]{display:none;}
  .cheat-card h2{margin:0 0 4px;font-size:1.2rem;}
  .cheat-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;color:#9daddb;font:600 12px 'JetBrains Mono',monospace;}
  .copy-row{display:flex;justify-content:flex-end;margin-top:10px;}
  .project-card.locked{opacity:.55;filter:grayscale(.7);}
  .project-card ul{color:#b9c3e8;line-height:1.7;padding-left:21px;}
  .project-checklist{display:grid;gap:9px;margin:18px 0;}
  .check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:2px solid #394673;border-radius:8px;background:#101a38;cursor:pointer;}
  .check-item input{width:19px;height:19px;accent-color:var(--mint);flex:0 0 auto;}
  .profile-grid{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start;}
  .cat-customizer,.profile-main{border:4px solid var(--pixel-border);border-radius:18px;background:linear-gradient(145deg,#172550,#101936);box-shadow:8px 8px 0 var(--shadow);padding:24px;}
  .cat-customizer{text-align:center;position:sticky;top:150px;}
  .cat-preview{height:260px;position:relative;display:grid;place-items:center;margin-bottom:18px;border:3px solid var(--pixel-border);border-radius:16px;background:radial-gradient(circle,rgba(139,108,255,.3),transparent 65%),#101938;overflow:hidden;}
  .cat-preview img{width:90%;height:90%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(6px 7px 0 rgba(3,7,19,.65));}
  .outfit-layer{position:absolute;z-index:4;font-size:58px;line-height:1;pointer-events:none;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.5));}
  .outfit-layer.hat{top:22px;left:50%;transform:translateX(-50%);}
  .outfit-layer.glasses{top:87px;left:50%;transform:translateX(-50%);font-size:52px;}
  .outfit-layer.crown{top:13px;left:50%;transform:translateX(-50%);}
  .cat-preview.aura::after{content:'✨';position:absolute;inset:10px;display:grid;place-items:center;border:4px dashed var(--yellow);border-radius:50%;font-size:42px;animation:auraSpin 6s linear infinite;z-index:1;}
  @keyframes auraSpin{to{transform:rotate(360deg)}}
  .cat-switch,.outfit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  .outfit-grid{margin-top:14px;}
  .outfit-option{padding:10px 7px;border:3px solid var(--pixel-border);border-radius:9px;background:#1b2850;color:#fff;cursor:pointer;box-shadow:3px 3px 0 #050916;}
  .outfit-option.active{border-color:var(--mint);color:var(--mint);}
  .outfit-option.locked{opacity:.45;cursor:not-allowed;}
  .profile-main{display:grid;gap:20px;}
  .profile-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .profile-stat{padding:14px;border:3px solid var(--pixel-border);border-radius:10px;background:#1a2750;text-align:center;}
  .profile-stat strong{display:block;color:var(--yellow);font:800 24px 'JetBrains Mono',monospace;}
  .profile-stat span{display:block;margin-top:4px;color:#aab5dd;font-size:13px;}
  .badge-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .badge-card{text-align:center;padding:15px;}
  .badge-card .badge-icon{display:block;font-size:32px;margin-bottom:7px;}
  .badge-card strong{display:block;}
  .badge-card small{display:block;margin-top:5px;color:#a8b3db;line-height:1.4;}
  .badge-card.locked{opacity:.4;filter:grayscale(1);}
  .danger-zone{margin-top:8px;padding:18px;border:3px solid #763247;border-radius:12px;background:#29152c;}
  .btn.danger{background:#ff7390;color:#21101a;box-shadow:5px 5px 0 #6f243b;}
  .empty-state{padding:28px;text-align:center;border:3px dashed #44517c;border-radius:14px;color:#aab5dd;}

  /* Output Challenge */
  .output-challenge-shell{display:grid;gap:18px;}
  .output-quest-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .output-steps{display:flex;gap:8px;flex-wrap:wrap;}
  .output-step{
    min-width:42px;height:42px;padding:0 12px;border:3px solid var(--pixel-border);border-radius:9px;
    background:#17244a;color:#fff;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;font-weight:800;
  }
  .output-step:hover:not(:disabled),.output-step.active{transform:translateY(-2px);border-color:var(--yellow);color:var(--yellow);}
  .output-step.completed{border-color:var(--mint);background:#153f46;color:var(--mint);}
  .output-step:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.7);}
  .output-support-note{
    padding:12px 15px;border:2px solid #44517c;border-radius:10px;background:#101a38;color:#bac4e8;
    font-size:14px;line-height:1.6;
  }
  .output-support-note strong{color:var(--yellow);}
  .output-workspace{
    display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px;
    border:4px solid var(--pixel-border);border-radius:18px;background:#0a122b;box-shadow:8px 8px 0 var(--shadow);padding:18px;
  }
  .output-workspace.success{animation:outputSuccess .6s steps(3);box-shadow:8px 8px 0 var(--shadow),0 0 28px rgba(112,242,189,.45);}
  @keyframes outputSuccess{50%{transform:translateY(-4px);border-color:var(--mint);}}
  .editor-panel,.console-card{min-width:0;border:3px solid #050a1d;border-radius:12px;background:#070d20;overflow:hidden;box-shadow:4px 4px 0 #030713;}
  .editor-topbar,.console-title{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
    border-bottom:2px solid #29365e;background:#111b3a;color:#e8ebff;font-weight:800;
  }
  .editor-topbar small,.console-title small{color:#8f9dca;font:600 11px 'JetBrains Mono',monospace;}
  .editor-body{display:grid;grid-template-columns:auto minmax(0,1fr);height:420px;background:#070d20;overflow:hidden;}
  .line-numbers{
    margin:0;padding:14px 11px;min-width:48px;overflow:hidden;border-right:1px solid #263258;
    background:#0c1430;color:#68769f;text-align:right;white-space:pre;font:500 14px/1.65 'JetBrains Mono',monospace;user-select:none;
  }
  .code-editor{
    width:100%;height:100%;min-width:0;resize:none;border:0;outline:0;padding:14px 16px;overflow:auto;
    background:#070d20;color:#f2f4ff;caret-color:var(--yellow);tab-size:4;white-space:pre;
    font:500 14px/1.65 'JetBrains Mono',monospace;
  }
  .code-editor:focus{box-shadow:inset 0 0 0 2px var(--purple);}
  .console-stack{display:grid;grid-template-rows:1fr 1fr;gap:18px;min-width:0;}
  .console-card.target{border-color:#554496;}
  .console-card.actual{border-color:#285e59;}
  .console-title .target-label{color:var(--yellow);}
  .console-title .actual-label{color:var(--mint);}
  .console-screen{
    margin:0;min-height:140px;height:calc(100% - 47px);padding:16px;overflow:auto;color:#f5f7ff;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 24px),#070d20;
    white-space:pre-wrap;overflow-wrap:anywhere;font:600 14px/1.65 'JetBrains Mono',monospace;
  }
  .console-screen.placeholder{color:#7482ad;font-style:italic;}
  .output-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .output-actions .run-button{background:var(--mint);color:#071a22;box-shadow:5px 5px 0 #1d7666;}
  .output-actions .check-button{background:var(--yellow);color:#241d08;box-shadow:5px 5px 0 #86691c;}
  .output-feedback pre{margin:10px 0 0;padding:12px;overflow:auto;border-radius:7px;background:#080e22;color:#f5f6ff;font:500 13px/1.6 'JetBrains Mono',monospace;white-space:pre;}
  .bonus-projects{padding:18px;border:3px solid #3e4c79;border-radius:12px;background:#111c3c;}
  .bonus-projects h2{margin:0 0 7px;}
  .bonus-projects p{margin:0 0 13px;color:#aeb9df;line-height:1.6;}
  .bonus-project-actions{display:flex;gap:10px;flex-wrap:wrap;}

  @media (max-width:1050px){
    .profile-grid{grid-template-columns:280px 1fr;}
    .profile-summary{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:820px){
    .route-label{display:none;}
    .lesson-grid,.lab-grid,.cheat-grid,.project-grid{grid-template-columns:1fr;}
    .quiz-select-grid{grid-template-columns:1fr;}
    .profile-grid{grid-template-columns:1fr;}
    .cat-customizer{position:static;}
    .badge-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .output-workspace{grid-template-columns:1fr;}
    .editor-body{height:360px;}
    .console-stack{grid-template-rows:auto;}
    .console-screen{height:auto;min-height:150px;}
  }
  @media (max-width:720px){
    .nav-links{grid-template-columns:repeat(4,1fr);}
    .daily-card{grid-template-columns:auto 1fr;}
    .daily-reward{grid-column:1/-1;text-align:left;}
    .profile-summary{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:480px){
    .nav-link{font-size:11px;padding:8px 2px;}
    .daily-card{padding:14px;}
    .lesson-card,.lab-card,.cheat-card,.project-card,.cat-customizer,.profile-main,.lab-workspace{padding:16px;}
    .badge-grid{grid-template-columns:1fr 1fr;gap:10px;}

    .output-actions .btn{width:100%;}
    .output-step{min-width:38px;height:38px;padding:0 9px;}
  }

  /* ================= HOME COURSE PREVIEW ================= */
  .nav-link-with-status{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .nav-link:disabled{
    opacity:.58;
    color:#8e98bb;
    cursor:not-allowed;
    filter:saturate(.45);
  }
  .nav-link:disabled:hover{
    color:#8e98bb;
    background:transparent;
    transform:none;
  }
  .nav-soon{
    display:inline-flex;
    align-items:center;
    min-height:18px;
    padding:3px 5px;
    border:2px solid var(--pixel-border);
    border-radius:5px;
    background:var(--yellow);
    color:var(--navy);
    font:700 7px 'Press Start 2P','JetBrains Mono',monospace;
    line-height:1;
    box-shadow:2px 2px 0 var(--purple-dark);
    white-space:nowrap;
  }
  /* ฮีโร่หน้าแรกแบบเต็มจอ (full-bleed) ไม่มีกรอบ ตัวหนังสือวางบนภาพโดยตรง */
  .wrap.home-flush{padding-top:0;}
  .home-hero{
    min-height:clamp(440px,62vh,600px);
    width:100vw;
    margin-left:calc(50% - 50vw);
    justify-content:center;
    border:0;
    border-radius:0;
    box-shadow:none;
    background:var(--navy);
  }
  /* ภาพพื้นหลังฮีโร่แบบเคลื่อนไหว (Ken Burns) เป็นเลเยอร์แยกเพื่อความลื่น */
  .home-hero::before{
    content:"";
    position:absolute;
    inset:-8%;
    z-index:-2;
    background:url('code-cats-world.webp') center/cover no-repeat;
    transform-origin:center;
    animation:heroKenBurns 34s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes heroKenBurns{
    0%{ transform:scale(1.05) translate3d(-1.1%,-0.6%,0); }
    50%{ transform:scale(1.12) translate3d(1%,0.8%,0); }
    100%{ transform:scale(1.06) translate3d(1.4%,-0.4%,0); }
  }
  .home-hero::after{
    background:
      linear-gradient(180deg,rgba(16,24,78,.56) 0%,rgba(16,24,78,.52) 72%,var(--navy) 100%),
      radial-gradient(ellipse at center,rgba(8,14,44,.34) 0%,rgba(8,14,44,0) 62%);
  }
  .home-hero-grid{
    width:100%;
    display:flex;
    justify-content:center;
    padding:clamp(56px,8vw,104px) 20px clamp(64px,9vw,112px);
  }
  .home-hero .hero-copy{
    width:min(780px,100%);
    padding:0;
    border:0;
    border-radius:0;
    background:none;
    box-shadow:none;
  }
  .home-hero .pixel-kicker{
    margin:0 0 22px;
    padding:0;
    border:0;
    background:none;
    box-shadow:none;
    color:var(--yellow);
    font:400 clamp(12px,1.5vw,19px)/1.4 'Press Start 2P','JetBrains Mono',monospace;
    letter-spacing:.04em;
    text-shadow:3px 3px 0 rgba(3,7,19,.75);
  }
  .home-hero .hero-title{
    margin:0;
    color:#fff;
    font:400 clamp(1.9rem,6vw,4.7rem)/1.15 'Press Start 2P','JetBrains Mono',monospace;
    letter-spacing:-.03em;
    text-shadow:5px 5px 0 #1b1442,0 0 28px rgba(0,0,0,.35);
  }
  .home-hero .hero-copy p{
    max-width:58ch;
    margin:26px auto 0;
    color:#eef1ff;
    font-size:clamp(1rem,1.4vw,1.2rem);
    line-height:1.75;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  .home-hero .hero-actions{margin-top:30px;}

  /* เอฟเฟกต์เคลื่อนไหวบนภาพหน้าแรก: ดาววิบวับ หิ่งห้อย เมฆ หมอก (สร้างโดย heroFxMarkup) */
  .hero-fx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .fx-star{
    position:absolute;left:var(--x);top:var(--y);
    width:3px;height:3px;background:#fff;
    box-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,0 0 8px 2px rgba(200,215,255,.6);
    opacity:.5;transform:scale(var(--s));
    animation:fxTwinkle var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes fxTwinkle{
    0%,100%{opacity:.12;transform:scale(calc(var(--s) * .55));}
    50%{opacity:1;transform:scale(var(--s));}
  }
  .fx-firefly{
    position:absolute;left:var(--x);top:var(--y);
    width:5px;height:5px;border-radius:50%;
    background:#fff3a8;box-shadow:0 0 8px 3px rgba(255,214,102,.75),0 0 18px 6px rgba(255,190,80,.25);
    opacity:.7;
    animation:fxDrift var(--d) ease-in-out var(--delay) infinite,fxBlink calc(var(--d) / 3) ease-in-out var(--delay) infinite;
  }
  @keyframes fxDrift{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(var(--dx),calc(var(--dy) * -1));}
    50%{transform:translate(calc(var(--dx) * .4),calc(var(--dy) * -1.8));}
    75%{transform:translate(calc(var(--dx) * -.6),calc(var(--dy) * -.7));}
  }
  @keyframes fxBlink{0%,100%{opacity:.15;}45%,60%{opacity:.95;}}
  .fx-cloud{
    position:absolute;left:-320px;top:var(--y);
    width:var(--w);height:calc(var(--w) * .3);
    background:
      radial-gradient(ellipse 30% 60% at 30% 60%,#e4e9ff 0 55%,transparent 72%),
      radial-gradient(ellipse 26% 70% at 52% 45%,#e4e9ff 0 55%,transparent 72%),
      radial-gradient(ellipse 28% 55% at 72% 62%,#e4e9ff 0 55%,transparent 72%);
    filter:blur(3px);
    opacity:var(--o);
    animation:fxCloud var(--d) linear var(--delay) infinite;
  }
  @keyframes fxCloud{from{transform:translateX(0);}to{transform:translateX(calc(100vw + 400px));}}
  .fx-mist{
    position:absolute;left:0;bottom:-6%;width:200%;height:42%;
    background:
      radial-gradient(ellipse 18% 55% at 12% 70%,rgba(190,205,255,.22),transparent 70%),
      radial-gradient(ellipse 22% 50% at 38% 80%,rgba(170,190,255,.18),transparent 70%),
      radial-gradient(ellipse 16% 45% at 62% 72%,rgba(200,210,255,.2),transparent 70%),
      radial-gradient(ellipse 20% 55% at 88% 78%,rgba(170,190,255,.18),transparent 70%);
    background-size:50% 100%;
    background-repeat:repeat-x;
    animation:fxMist 48s linear infinite;
  }
  .fx-mist.back{bottom:8%;opacity:.6;animation-duration:75s;animation-direction:reverse;}
  @keyframes fxMist{from{transform:translateX(0);}to{transform:translateX(-50%);}}

const PLAYER_STORAGE_KEY = "codeCatsProgress";
const XP_PER_LEVEL = 100;

function loadPlayer(){
  const fallback = freshProgress();
  try{
    const saved = JSON.parse(localStorage.getItem(PLAYER_STORAGE_KEY));
    if(saved && typeof saved === "object") return sanitizeProgress(saved,fallback);

    /* อ่านข้อมูลรุ่นเดิมเพื่อย้ายครั้งเดียว โดยไม่ลบหรือเขียนทับคีย์เดิม */
    const legacy = JSON.parse(localStorage.getItem("codeCatsAdventure.player.v1"));
    if(legacy && typeof legacy === "object"){
      fallback.xp = Number.isFinite(legacy.xp) ? Math.max(0,legacy.xp) : 0;
      fallback.quizStats.correct = Number.isFinite(legacy.correct) ? Math.max(0,legacy.correct) : 0;
      fallback.quizStats.questions = Number.isFinite(legacy.questions) ? Math.max(0,legacy.questions) : 0;
      fallback.quizStats.attempts = Number.isFinite(legacy.attempts) ? Math.max(0,legacy.attempts) : 0;
      fallback.level = Math.floor(fallback.xp / XP_PER_LEVEL) + 1;
    }
    return fallback;
  }catch(error){
    return fallback;
  }
}

let player = loadPlayer();

function savePlayer(){
  try{ localStorage.setItem(PLAYER_STORAGE_KEY,JSON.stringify(player)); }
  catch(error){ /* เล่นต่อได้แม้เบราว์เซอร์ปิดกั้น localStorage */ }
}




// tracks which question indices have already appeared this session,
// per quiz bank, so a new attempt pulls from the *unused* pool first
// instead of re-rolling the same handful of questions over and over.
let usedPools = {};




function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// picks n question indices from the given bank, prioritising ones not
// seen yet this session. once every question has been used, the pool
// resets so the next round starts fresh, but it will never repeat a
// question before the full bank has been covered at least once.
function drawQuestions(characterId, bankId, n){
  const total = QUIZ_BANKS[characterId][bankId].questions.length;
  const poolId = `${characterId}:${bankId}`;
  const usedPool = usedPools[poolId] || (usedPools[poolId] = new Set());
  if(usedPool.size >= total) usedPool.clear();

  const unused = shuffleArray([...Array(total).keys()].filter(i => !usedPool.has(i)));
  let selected = unused.slice(0, n);

  if(selected.length < n){
    usedPool.clear();
    const remaining = n - selected.length;
    const rest = shuffleArray([...Array(total).keys()].filter(i => !selected.includes(i)));
    selected = selected.concat(rest.slice(0, remaining));
  }

  selected.forEach(i => usedPool.add(i));
  return shuffleArray(selected);
}






function askExit(){
  if(document.getElementById("exitOverlay")) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "exitOverlay";
  overlay.innerHTML = `
    <div class="overlay-card">
      <h4>ออกจากแบบทดสอบ?</h4>
      <p>คำตอบที่ทำไว้ในรอบนี้จะไม่ถูกบันทึก</p>
      <div class="overlay-actions">
        <button class="btn ghost" onclick="cancelExit()">ทำต่อ</button>
        <button class="btn" onclick="confirmExit()">ออกเลย</button>
      </div>
    </div>
  `;
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) cancelExit(); });
  document.body.appendChild(overlay);
}
function cancelExit(){
  const el = document.getElementById("exitOverlay");
  if(el) el.remove();
  state.pendingScreen = null;
}
function confirmExit(){
  const destination = state.pendingScreen || "home";
  cancelExit();
  resetJourney(destination);
  render();
}

function beginQuiz(){
  state.order = drawQuestions(state.character, state.bank, state.count);

  state.answers = new Array(state.order.length).fill(null);

  state.lastReward = null;
  state.screen = "quiz";

function prevQ(){

}

  pathLabel.innerHTML = `<b>quest_complete</b> / ${quiz.file}<span class="caret"></span>`;

function scoreMessage(pct){
  let message = "ลองทบทวนเนื้อหาแล้วกลับมาทำใหม่นะ";
  if(pct===100) message = "perfect score! เก่งมาก 🎉";
  else if(pct>=80) message = "ทำได้ดีมาก ใกล้เต็มแล้ว";
  else if(pct>=60) message = "ผ่านเกณฑ์ ลองทบทวนข้อที่พลาดดูอีกนิด";
  // แสดงข้อความเป็น "คำสั่งแสดงผล" ของภาษาที่กำลังทำ Quiz
  const printers = {
    java:`System.out.println("${message}");`,
    c:`printf("${message}\\n");`,
    cpp:`cout << "${message}" << endl;`,
    html:`<p>${message}</p>`,
    css:`/* ${message} */`
  };
  return printers[state.character] || `print("${message}")`;
}

function sanitizeProgress(saved,fallback){
  const stringList = value => Array.isArray(value)
    ? [...new Set(value.filter(item=>typeof item === "string"))]
    : [];
  const quiz = saved.quizStats && typeof saved.quizStats === "object" ? saved.quizStats : {};
  const streak = saved.streak && typeof saved.streak === "object" ? saved.streak : {};
  const custom = saved.customization && typeof saved.customization === "object" ? saved.customization : {};
  const courseProgress = saved.courseProgress && typeof saved.courseProgress === "object" ? saved.courseProgress : {};
  const sanitizeCourse = value=>{
    const course = value && typeof value === "object" ? value : {};
    return {
      completedExercises:stringList(course.completedExercises),
      completedChapters:stringList(course.completedChapters),
      readIntros:stringList(course.readIntros)
    };
  };
  const result = {
    version:3,
    xp:Number.isFinite(saved.xp) ? Math.max(0,Math.floor(saved.xp)) : fallback.xp,
    level:1,
    lessonsCompleted:stringList(saved.lessonsCompleted),
    labsCompleted:stringList(saved.labsCompleted),
    stagesCompleted:stringList(saved.stagesCompleted),
    outputCompleted:stringList(saved.outputCompleted),
    projectsCompleted:stringList(saved.projectsCompleted),
    projectChecklist:saved.projectChecklist && typeof saved.projectChecklist === "object" ? saved.projectChecklist : {},
    badges:stringList(saved.badges),
    quizStats:{
      correct:Number.isFinite(quiz.correct) ? Math.max(0,quiz.correct) : 0,
      questions:Number.isFinite(quiz.questions) ? Math.max(0,quiz.questions) : 0,
      attempts:Number.isFinite(quiz.attempts) ? Math.max(0,quiz.attempts) : 0,
      perfect:Number.isFinite(quiz.perfect) ? Math.max(0,quiz.perfect) : 0
    },
    streak:{
      count:Number.isFinite(streak.count) ? Math.max(0,streak.count) : 0,
      lastVisit:typeof streak.lastVisit === "string" ? streak.lastVisit : ""
    },
    daily:saved.daily && typeof saved.daily === "object" ? saved.daily : null,
    previewAllChapters:saved.previewAllChapters === true,
    minigameBest:Number.isFinite(saved.minigameBest) ? Math.max(0,Math.floor(saved.minigameBest)) : 0,
    minigamePet:typeof saved.minigamePet === "string" ? saved.minigamePet : null,
    customization:{
      character:["python","java"].includes(custom.character) ? custom.character : "python",
      outfit:["none","hat","glasses","crown","aura"].includes(custom.outfit) ? custom.outfit : "none"
    },
    courseProgress:{
      python:sanitizeCourse(courseProgress.python),
      java:sanitizeCourse(courseProgress.java),
      c:sanitizeCourse(courseProgress.c),
      cpp:sanitizeCourse(courseProgress.cpp),
      html:sanitizeCourse(courseProgress.html),
      css:sanitizeCourse(courseProgress.css)
    }
  };
  result.level = Math.floor(result.xp / XP_PER_LEVEL) + 1;
  return result;
}

function localDateKey(date=new Date()){
  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");
  return `${year}-${month}-${day}`;
}

function updateStreak(){
  const today = localDateKey();
  if(player.streak.lastVisit === today) return;
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  player.streak.count = player.streak.lastVisit === localDateKey(yesterday)
    ? player.streak.count + 1
    : 1;
  player.streak.lastVisit = today;
}

    {type:"quiz",title:"ทำ Quiz Battle ให้จบ 1 รอบ",reward:50,icon:"⚔️"}
  ];
  const seed = today.split("").reduce((sum,char)=>sum+char.charCodeAt(0),0);
  const mission = missions[seed % missions.length];
  player.daily = {...mission,date:today,target:1,progress:0,claimed:false};
}

function initializeProgress(){
  updateStreak();
  player.level = Math.floor(player.xp / XP_PER_LEVEL) + 1;
  savePlayer();
}

function addXP(amount){
  player.xp += Math.max(0,Math.floor(amount));
  player.level = Math.floor(player.xp / XP_PER_LEVEL) + 1;
}

function addBadge(id){
  if(!player.badges.includes(id)) player.badges.push(id);
}

function completeStage(language,stage){
  const key = `${language}:${stage}`;
  if(!player.stagesCompleted.includes(key)) player.stagesCompleted.push(key);
}

function syncStageProgress(language){
  if(LESSONS[language].every(item=>player.lessonsCompleted.includes(`${language}:${item.id}`))) completeStage(language,"lesson");
  if(CODE_LABS[language].every(item=>player.labsCompleted.includes(item.id))) completeStage(language,"lab");
  if(OUTPUT_CHALLENGES[language].every(item=>player.outputCompleted.includes(item.id))) completeStage(language,"output");
}

function evaluateBadges(){
  if(player.lessonsCompleted.length) addBadge("first-lesson");
  if([...CODE_LABS.python,...CODE_LABS.java].some(lab=>lab.type === "bug" && player.labsCompleted.includes(lab.id))) addBadge("bug-hunter");
  if(player.stagesCompleted.includes("python:output")) addBadge("python-explorer");
  if(player.stagesCompleted.includes("java:output")) addBadge("java-explorer");
  if(player.quizStats.perfect > 0) addBadge("quiz-master");
  if(player.projectsCompleted.length) addBadge("project-builder");
}

function stageStatus(language,stage){
  const key = `${language}:${stage}`;
  if(player.stagesCompleted.includes(key)) return "completed";
  const index = STAGE_ORDER.indexOf(stage);
  if(index === 0) return "available";
  return player.stagesCompleted.includes(`${language}:${STAGE_ORDER[index-1]}`) ? "available" : "locked";
}

function recordDaily(type){
  ensureDailyMission();
  if(player.daily.type !== type || player.daily.claimed) return 0;
  player.daily.progress = Math.min(player.daily.target,player.daily.progress + 1);
  if(player.daily.progress >= player.daily.target){
    player.daily.claimed = true;
    addXP(player.daily.reward);
    return player.daily.reward;
  }
  return 0;
}

function levelInfo(){
  const level = Math.floor(player.xp / XP_PER_LEVEL) + 1;
  const currentXp = player.xp % XP_PER_LEVEL;
  return {level,currentXp,pct:Math.round((currentXp/XP_PER_LEVEL)*100)};
}

function updateNav(){
  const active = ["home","learnPath","pythonPath","javaPath","chapterIntro","pythonHelloWorld","pythonLessonPreview"].includes(state.screen) ? "learn"
    : ["quizSelect","config","quiz","results"].includes(state.screen) ? "quiz"
    : state.screen === "minigame" ? "minigame" : "";
  document.querySelectorAll("[data-nav]").forEach(element=>{
    const selected = element.dataset.nav === active;
    element.classList.toggle("active",selected);
    const toggle = element.classList.contains("nav-dropdown") ? element.querySelector(".nav-dropdown-toggle") : element;
    if(toggle){
      toggle.classList.toggle("active",selected);
      toggle.setAttribute("aria-current",selected ? "page" : "false");
    }
  });
}

function resetJourney(screen="home"){
  state = {
    screen,character:null,language:null,bank:null,count:10,order:[],optionMaps:[],answers:[],current:0,
    rewarded:false,lastReward:null,pendingScreen:null,labId:null,labOrders:{},labFeedback:{},projectFilter:null,
    outputIndex:0,outputDrafts:{},outputResult:"",outputError:"",outputFeedback:null,outputHintLevel:0,outputRan:false,
    courseLessonId:null,helloExerciseIndex:0,helloDrafts:{},helloOutput:"",helloError:"",
    helloFeedback:null,helloHintLevel:0,helloRan:false,quizMode:null
  };
}

function navigateTo(screen){
  if(state.screen === "quiz"){
    state.pendingScreen = screen;
    return askExit();
  }
  resetJourney(screen);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function goHome(){ navigateTo("home"); }
function goAdventures(){ navigateTo("adventures"); }
function goProgress(){ navigateTo("profile"); }
function goMinigame(){ navigateTo("minigame"); }

function activeCharacter(){
  return CHARACTERS[state.character || state.language || player.customization.character || "python"] || CHARACTERS.python;
}
function quizRealm(){ const track = LANG_TRACKS[state.character] || LANG_TRACKS.python; return track.realm; }

function activeQuizzes(){ return QUIZ_BANKS[state.character || state.language || "python"]; }
function activeQuiz(){ return activeQuizzes()[state.bank]; }

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
}

function dailyMissionHTML(){
  const mission = player.daily;
  const status = mission.claimed ? "รับรางวัลแล้ว ✓" : `${mission.progress}/${mission.target}`;
  return `
    <article class="daily-card" aria-label="ภารกิจรายวัน">
      <div class="daily-icon" aria-hidden="true">${mission.icon}</div>
      <div class="daily-copy"><strong>Daily Mission</strong><span>${mission.title}</span></div>
      <div class="daily-reward">+${mission.reward} XP<small>${status}</small></div>
    </article>
  `;
}

/* ห่อโค้ด Java ด้วยโครง class Main + main() ให้แบบฝึกกระชับ */
function jMain(body){
  const indented = String(body).split("\n").map(line=>line.trim() === "" ? "" : "        " + line).join("\n");
  return "public class Main {\n    public static void main(String[] args) {\n" + indented + "\n    }\n}";
}

/* ================= C & C++ COURSES ================= */
function indentBody(body){ return String(body).split("\n").map(line=>line.trim() === "" ? "" : "    " + line).join("\n"); }
function cIncludes(extra){ return ["stdio.h"].concat(extra || []).map(h=>`#include <${h}>`).join("\n"); }
function cMain(body,extra){ return `${cIncludes(extra)}\n\nint main() {\n${indentBody(body)}\n    return 0;\n}`; }
function cProg(top,body,extra){ return `${cIncludes(extra)}\n\n${top}\n\nint main() {\n${indentBody(body)}\n    return 0;\n}`; }
function cppIncludes(extra){ return ["iostream"].concat(extra || []).map(h=>`#include <${h}>`).join("\n") + "\nusing namespace std;"; }
function cppMain(body,extra){ return `${cppIncludes(extra)}\n\nint main() {\n${indentBody(body)}\n    return 0;\n}`; }
function cppProg(top,body,extra){ return `${cppIncludes(extra)}\n\n${top}\n\nint main() {\n${indentBody(body)}\n    return 0;\n}`; }
function lx(o){ return Object.assign({scaffold:true, requiresComment:false}, o); }

function hx(o){ return Object.assign({scaffold:false, requiresComment:false}, o); }
function htmlPage(body,title){ return `<!DOCTYPE html>\n<html>\n<head>\n  <title>${title}</title>\n</head>\n<body>\n${String(body).split("\n").map(line=>line.trim() === "" ? "" : "  " + line).join("\n")}\n</body>\n</html>`; }
function wHas(sel,msg){ return [c=>!!c.q(sel),msg]; }
function wText(sel,value,msg){ return [c=>c.text(sel) === value,msg]; }
function wFilled(sel,msg){ return [c=>{ const el = c.q(sel); return !!el && c.norm(el.textContent) !== ""; },msg]; }
function wTexts(sel,values,msg){ return [c=>{ const got = c.qa(sel).map(el=>c.norm(el.textContent)); return got.length === values.length && got.every((value,i)=>value === values[i]); },msg]; }
function wAttr(sel,attr,value,msg){ return [c=>{ const el = c.q(sel); return !!el && (el.getAttribute(attr) || "").trim() === value; },msg]; }
function wCount(sel,count,msg){ return [c=>c.qa(sel).length === count,msg]; }
function wOrder(selectors,msg){ return [c=>{ const els = selectors.map(sel=>c.q(sel)); return els.every(Boolean) && els.every((el,i)=>i === 0 || !!(els[i-1].compareDocumentPosition(el) & 4)); },msg]; }
function wStyle(sel,prop,value,msg){ return [c=>c.style(sel,prop) === value,msg]; }
function wPx(sel,prop,value,msg){ return [c=>!!c.q(sel) && Math.abs(c.px(sel,prop) - value) < 0.6,msg]; }
function wSides(sel,prop,value,msg){ return [c=>!!c.q(sel) && ["top","right","bottom","left"].every(side=>Math.abs(c.px(sel,`${prop}-${side}`) - value) < 0.6),msg]; }
function wColor(sel,prop,value,msg){ return [c=>c.colorIs(sel,prop,value),msg]; }
function wColumns(sel,count,msg){ return [c=>{ const tracks = c.style(sel,"grid-template-columns").split(/\s+/).filter(Boolean).map(parseFloat); return tracks.length === count && tracks.every(width=>Math.abs(width - tracks[0]) < 1); },msg]; }
const W_HTML_COMMENT = [c=>/<!--[\s\S]*?-->/.test(c.code),"ยังไม่มีคอมเมนต์ HTML — เขียนในรูป <!-- ข้อความ -->"];
const W_CSS_COMMENT = [c=>/\/\*[\s\S]*?\*\//.test(c.code),"ยังไม่มีคอมเมนต์ CSS — เขียนในรูป /* ข้อความ */"];

function courseCardHTML(course){
  const disabled = !course.active;
  return `
    <button class="course-card ${disabled ? "is-coming-soon" : "is-available"}" type="button" data-course="${course.id}"
      ${disabled ? 'disabled aria-disabled="true"' : `onclick="openLearningCourse('${course.id}')"`}
      aria-label="${course.name} · ${course.level}${disabled ? ' · Coming Soon' : ' · Available'}">
      <span class="course-card-icon" aria-hidden="true">${escapeHTML(course.icon)}</span>
      <span class="course-card-copy">
        <h4>${escapeHTML(course.name)}</h4>
        <p>${escapeHTML(course.description)}</p>
      </span>
      <span class="course-card-meta">
        <span class="course-level">${escapeHTML(course.level)}</span>
        ${disabled ? '<span class="course-soon">COMING SOON</span>' : '<span class="course-start">START LEARNING</span>'}
      </span>
    </button>
  `;
}

function learningCategoryHTML(category){
  const courses = LEARNING_COURSES.filter(course=>course.category === category.id);
  return `
    <section class="journey-category" aria-labelledby="category-${category.id}">
      <div class="journey-category-head"><h3 id="category-${category.id}">${category.title}</h3></div>
      <div class="course-grid">${courses.map(courseCardHTML).join("")}</div>
    </section>
  `;
}

function toggleQuizMenu(event){
  if(event) event.stopPropagation();
  const dropdown = document.querySelector('.nav-dropdown[data-nav="quiz"]');
  if(!dropdown) return;
  const willOpen = !dropdown.classList.contains("open");
  dropdown.classList.toggle("open",willOpen);
  const toggle = dropdown.querySelector(".nav-dropdown-toggle");
  if(toggle) toggle.setAttribute("aria-expanded",willOpen ? "true" : "false");
}

function closeQuizMenu(){
  const dropdown = document.querySelector('.nav-dropdown[data-nav="quiz"]');
  if(!dropdown) return;
  dropdown.classList.remove("open");
  const toggle = dropdown.querySelector(".nav-dropdown-toggle");
  if(toggle) toggle.setAttribute("aria-expanded","false");
  // ปล่อยโฟกัสออกจากเมนู ไม่ให้เมนูค้างเปิดหลังเลือกภาษาแล้ว
  if(dropdown.contains(document.activeElement)) document.activeElement.blur();
}

document.addEventListener("click",event=>{
  const dropdown = document.querySelector('.nav-dropdown[data-nav="quiz"].open');
  if(dropdown && !dropdown.contains(event.target)) closeQuizMenu();
});

function pythonChapterStatus(chapter,index){

  const previous = activeCourseArray()[index-1];
  if(previous && progress.completedChapters.includes(previous.id)) return "available";
