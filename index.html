// สร้างดาว หิ่งห้อย เมฆ และหมอกที่ลอยอยู่บนภาพหน้าแรก (ใช้ seed คงที่ ตำแหน่งจึงเหมือนเดิมทุกครั้ง)
let heroFxCache = "";
function heroFxMarkup(){
  if(heroFxCache) return heroFxCache;
  let seed = 7;
  const rand = (min,max) => {
    seed = (seed * 16807) % 2147483647;
    return min + (seed / 2147483647) * (max - min);
  };
  const f = n => n.toFixed(1);
  let html = "";
  for(let i=0;i<20;i++){
    html += `<span class="fx-star" style="--x:${f(rand(2,98))}%;--y:${f(rand(3,38))}%;--s:${f(rand(.6,1.3))};--d:${f(rand(2.2,5))}s;--delay:-${f(rand(0,5))}s"></span>`;
  }
  for(let i=0;i<16;i++){
    html += `<span class="fx-firefly" style="--x:${f(rand(3,97))}%;--y:${f(rand(52,94))}%;--dx:${f(rand(-40,40))}px;--dy:${f(rand(14,34))}px;--d:${f(rand(7,13))}s;--delay:-${f(rand(0,13))}s"></span>`;
  }
  for(let i=0;i<3;i++){
    const duration = rand(80,120);
    html += `<span class="fx-cloud" style="--y:${f(rand(2,16))}%;--w:${Math.round(rand(180,280))}px;--o:${f(rand(.14,.24))};--d:${f(duration)}s;--delay:-${f(duration * (i / 3 + rand(0,.2)))}s"></span>`;
  }
  html += `<span class="fx-mist back"></span><span class="fx-mist"></span>`;
  heroFxCache = `<div class="hero-fx" aria-hidden="true">${html}</div>`;
  return heroFxCache;
}

/* ================= HELLO WORLD LESSON ================= */
function helloExerciseKey(exercise){
  const exerciseId = typeof exercise === "string" ? exercise : exercise.id;
  return `${state.courseLessonId || "hello-world"}:${exerciseId}`;
}

/* ช่องเริ่มต้น: ปกติว่างเปล่าให้พิมพ์เอง ยกเว้นข้อยากที่ตั้ง scaffold ไว้ */
function lessonInitialDraft(exercise){ return exercise && exercise.scaffold ? exercise.starter : ""; }

function fillLessonScaffold(){
  const exercise = activeLessonExercises()[state.helloExerciseIndex];
  if(!exercise) return;
  state.helloDrafts[exercise.id] = exercise.starter;
  state.helloFeedback = {kind:"hint",message:"ใส่โครงเริ่มต้นให้แล้ว ลองเติมส่วนที่ขาดให้สมบูรณ์"};
  renderHelloWorldLesson();
}

function prepareHelloWorldExercise(index){
  const exercises = activeLessonExercises();
  const safeIndex = Math.max(0,Math.min(exercises.length-1,Number(index) || 0));
  state.helloExerciseIndex = safeIndex;
  const exercise = exercises[safeIndex];
  if(!Object.prototype.hasOwnProperty.call(state.helloDrafts,exercise.id)) state.helloDrafts[exercise.id] = lessonInitialDraft(exercise);
  state.helloOutput = "";
  state.helloError = "";
  state.helloFeedback = null;
  state.helloHintLevel = 0;
  state.helloRan = false;
}

function completedHelloExerciseCount(){
  const progress = pythonCourseProgress();
  return activeLessonExercises().filter(exercise=>progress.completedExercises.includes(helloExerciseKey(exercise))).length;
}

function renderHelloFeedback(){
  const feedback = state.helloFeedback;
  if(!feedback) return "";
  if(feedback.solution){
    return `<div class="feedback hint hello-feedback"><strong>${escapeHTML(feedback.message)}</strong><pre><code>${escapeHTML(feedback.solution)}</code></pre></div>`;
  }
  return `<div class="feedback ${feedback.kind} hello-feedback" role="status">${escapeHTML(feedback.message)}</div>`;
}

function renderHelloWorldLesson(){
  const config = activeLessonConfig();
  const exercises = config.exercises;
  state.helloExerciseIndex = Math.max(0,Math.min(exercises.length-1,state.helloExerciseIndex || 0));
  const exercise = exercises[state.helloExerciseIndex];
  if(!Object.prototype.hasOwnProperty.call(state.helloDrafts,exercise.id)) state.helloDrafts[exercise.id] = lessonInitialDraft(exercise);
  const draft = state.helloDrafts[exercise.id];
  const progress = pythonCourseProgress();
  const completedCount = completedHelloExerciseCount();

function runHelloWorldPython(code){
  let output = "";
  let hasComment = false;
  const lines = String(code).replace(/\r\n?/g,"\n").split("\n");
  for(let index=0;index<lines.length;index++){
    const line = lines[index].trim();
    if(!line) continue;
    if(line.startsWith("#")){ hasComment = true; continue; }
    const printMatch = line.match(/^print\s*\((.*)\)\s*$/);
    if(!printMatch) return {output,error:"รองรับเฉพาะ Comment ที่ขึ้นต้นด้วย # และ print() ที่ใช้ข้อความพื้นฐาน",line:index+1,hasComment};
    const expression = printMatch[1].trim();
    const isBasicString = /^(?:"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')$/.test(expression);
    if(!isBasicString) return {output,error:"ภายใน print() ต้องเป็นข้อความหนึ่งชุดที่อยู่ในเครื่องหมายคำพูด",line:index+1,hasComment};
    const literal = decodeRestrictedString(expression);
    if(!literal.ok) return {output,error:"String ใน print() ยังเขียนไม่สมบูรณ์",line:index+1,hasComment};
    output += String(literal.value) + "\n";
  }
  return {output,error:"",line:0,hasComment};
}

/* ---- Chapter 2: Variables & Data Types runner ---- */
function pyValueToString(value){
  if(value.type === "bool") return value.value ? "True" : "False";
  if(value.type === "number") return String(Number(value.value));
  return String(value.value);
}

function evalVarAtom(token,variables){
  const text = String(token).trim();
  if(!text) return {ok:false,error:"พบเครื่องหมาย + แต่ขาดค่าข้าง ๆ"};
  const literal = decodeRestrictedString(text);
  if(literal.ok) return {ok:true,type:"string",value:literal.value};
  if(/^-?(?:\d+\.?\d*|\.\d+)$/.test(text)) return {ok:true,type:"number",value:Number(text)};
  if(text === "True") return {ok:true,type:"bool",value:true};
  if(text === "False") return {ok:true,type:"bool",value:false};
  const strCall = text.match(/^str\s*\(\s*(.+)\s*\)$/);
  if(strCall){
    const inner = evalVarExpression(strCall[1],variables);
    if(!inner.ok) return inner;
    return {ok:true,type:"string",value:pyValueToString(inner)};
  }
  const intCall = text.match(/^int\s*\(\s*(.+)\s*\)$/);
  if(intCall){
    const inner = evalVarExpression(intCall[1],variables);
    if(!inner.ok) return inner;
    const parsed = parseInt(pyValueToString(inner),10);
    if(Number.isNaN(parsed)) return {ok:false,error:"int() ต้องรับตัวเลขหรือข้อความที่เป็นตัวเลข"};
    return {ok:true,type:"number",value:parsed};
  }
  if(/^[A-Za-z_]\w*$/.test(text)){
    if(Object.prototype.hasOwnProperty.call(variables,text)){
      const stored = variables[text];
      return {ok:true,type:stored.type,value:stored.value};
    }
    return {ok:false,error:`ยังไม่ได้สร้างตัวแปร “${text}” ก่อนนำมาใช้`};
  }
  return {ok:false,error:`ไม่รู้จักค่า “${text}”`};
}

function evalFString(quotedToken,variables){
  const decoded = decodeRestrictedString(quotedToken);
  if(!decoded.ok) return {ok:false,error:"f-string ยังเขียนไม่สมบูรณ์"};
  const raw = decoded.value;
  let out = "";
  for(let i=0;i<raw.length;i++){
    const char = raw[i];
    if(char === "{"){
      if(raw[i+1] === "{"){ out += "{"; i++; continue; }
      const end = raw.indexOf("}",i+1);
      if(end === -1) return {ok:false,error:"f-string ขาดวงเล็บปีกกาปิด }"};
      const inner = raw.slice(i+1,end).trim();
      if(!inner) return {ok:false,error:"{ } ใน f-string ต้องมีชื่อตัวแปรอยู่ข้างใน"};
      const value = evalVarExpression(inner,variables);
      if(!value.ok) return value;
      out += pyValueToString(value);
      i = end;
      continue;
    }
    if(char === "}"){
      if(raw[i+1] === "}"){ out += "}"; i++; continue; }
      return {ok:false,error:"พบ } ที่ไม่มี { คู่กันใน f-string"};
    }
    out += char;
  }
  return {ok:true,type:"string",value:out};
}

function evalVarExpression(expression,variables){
  const text = String(expression).trim();
  if(!text) return {ok:false,error:"ไม่พบค่าที่จะประมวลผล"};
  const fMatch = text.match(/^f("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')$/);
  if(fMatch) return evalFString(fMatch[1],variables);
  const parts = splitRestrictedExpression(text,"+");
  if(parts.length > 1){
    let acc = evalVarAtom(parts[0],variables);
    if(!acc.ok) return acc;
    for(let i=1;i<parts.length;i++){
      const next = evalVarAtom(parts[i],variables);
      if(!next.ok) return next;
      const accIsText = acc.type === "string";
      const nextIsText = next.type === "string";
      if(accIsText !== nextIsText){
        return {ok:false,error:"เชื่อมข้อความกับตัวเลขตรง ๆ ไม่ได้ ต้องใช้ str() หรือ f-string"};
      }
      acc = accIsText
        ? {ok:true,type:"string",value:pyValueToString(acc)+pyValueToString(next)}
        : {ok:true,type:"number",value:Number(acc.value)+Number(next.value)};
    }
    return acc;
  }
  return evalVarAtom(text,variables);
}

function runVariablesPython(code){
  const variables = Object.create(null);
  let output = "";
  let hasComment = false;
  const lines = String(code).replace(/\r\n?/g,"\n").split("\n");
  for(let index=0;index<lines.length;index++){
    const line = lines[index].trim();
    if(!line) continue;
    if(line.startsWith("#")){ hasComment = true; continue; }
    const printMatch = line.match(/^print\s*\((.*)\)\s*$/);
    if(printMatch){
      const expression = printMatch[1].trim();
      if(!expression){ output += "\n"; continue; }
      const parts = splitRestrictedExpression(expression,",");
      const rendered = [];
      for(const part of parts){
        const value = evalVarExpression(part,variables);
        if(!value.ok) return {output,error:value.error,line:index+1,hasComment};
        rendered.push(pyValueToString(value));
      }
      output += rendered.join(" ") + "\n";
      continue;
    }
    const assignment = line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
    if(assignment){
      const value = evalVarExpression(assignment[2],variables);
      if(!value.ok) return {output,error:value.error,line:index+1,hasComment};
      variables[assignment[1]] = value;
      continue;
    }
    return {output,error:"บทนี้รองรับเฉพาะการสร้างตัวแปรและคำสั่ง print()",line:index+1,hasComment};
  }
  return {output,error:"",line:0,hasComment};
}

/* =============================================================
   MINI PYTHON INTERPRETER (chapters 3-8)
   Supports: variables, int/float/str/bool/None, arithmetic, comparisons,
   and/or/not, if elif else, for-in range/list, while, def/return,
   class/init/self/method, list (index, len, append), f-string, print
   ============================================================= */
function PyErr(message,line){ this.__py = true; this.message = message; this.line = line || 0; }
function pyThrow(message,line){ throw new PyErr(message,line); }

function pyNum(v){ return {t:Number.isInteger(v) ? "int" : "float", v:v}; }
function pyInt(v){ return {t:"int", v:Math.trunc(v)}; }
function pyFloat(v){ return {t:"float", v:v}; }
const PY_NONE = {t:"none", v:null};
function pyBool(v){ return {t:"bool", v:!!v}; }
function pyStrVal(v){ return {t:"str", v:String(v)}; }

function pyTruthy(value){
  if(!value) return false;
  switch(value.t){
    case "none": return false;
    case "bool": return value.v;
    case "int": case "float": return value.v !== 0;
    case "str": return value.v.length > 0;
    case "list": return value.v.length > 0;
    default: return true;
  }
}

function pyRepr(value){
  if(!value) return "None";
  if(value.t === "str") return "'" + value.v + "'";
  return pyStr(value);
}

function pyStr(value){
  if(!value) return "None";
  switch(value.t){
    case "none": return "None";
    case "bool": return value.v ? "True" : "False";
    case "int": return String(value.v);
    case "float": return Number.isInteger(value.v) ? value.v.toFixed(1) : String(value.v);
    case "str": return value.v;
    case "list": return "[" + value.v.map(pyRepr).join(", ") + "]";
    case "instance": return "<" + value.cls.name + " object>";
    case "class": return "<class '" + value.name + "'>";
    case "func": case "builtin": return "<function " + (value.name||"") + ">";
    default: return String(value.v);
  }
}

function pyEquals(a,b){
  if(a.t === "list" && b.t === "list"){
    if(a.v.length !== b.v.length) return false;
    return a.v.every((item,i)=>pyEquals(item,b.v[i]));
  }
  const an = (a.t === "int" || a.t === "float" || a.t === "bool");
  const bn = (b.t === "int" || b.t === "float" || b.t === "bool");
  if(an && bn) return Number(a.v) === Number(b.v);
  if(a.t === "str" && b.t === "str") return a.v === b.v;
  if(a.t === "none" && b.t === "none") return true;
  return a === b;
}

/* ---- expression tokenizer ---- */
const PY_KEYWORDS = new Set(["and","or","not","in","True","False","None"]);
function tokenizeExpr(src,line){
  const tokens = [];
  const s = String(src);
  let i = 0;
  const two = ["**","//","==","!=","<=",">="];
  const one = "+-*/%<>()[],.";
  while(i < s.length){
    const c = s[i];
    if(c === " " || c === "\t"){ i++; continue; }
    if((c === "f" || c === "F") && (s[i+1] === '"' || s[i+1] === "'")){
      const quote = s[i+1]; let j = i+2; let raw = quote;
      while(j < s.length){ raw += s[j]; if(s[j] === "\\"){ raw += s[j+1]; j += 2; continue; } if(s[j] === quote){ j++; break; } j++; }
      tokens.push({type:"fstr", value:raw}); i = j; continue;
    }
    if(c === '"' || c === "'"){
      const quote = c; let j = i+1; let raw = quote;
      while(j < s.length){ raw += s[j]; if(s[j] === "\\"){ raw += s[j+1]; j += 2; continue; } if(s[j] === quote){ j++; break; } j++; }
      tokens.push({type:"str", value:raw}); i = j; continue;
    }
    if(/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i+1] || ""))){
      let j = i; let num = "";
      while(j < s.length && /[0-9.]/.test(s[j])){ num += s[j]; j++; }
      tokens.push({type:"num", value:num}); i = j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j = i; let name = "";
      while(j < s.length && /[A-Za-z0-9_]/.test(s[j])){ name += s[j]; j++; }
      tokens.push({type:PY_KEYWORDS.has(name) ? "kw" : "name", value:name}); i = j; continue;
    }
    const pair = s.substr(i,2);
    if(two.includes(pair)){ tokens.push({type:"op", value:pair}); i += 2; continue; }
    if(one.includes(c)){ tokens.push({type:"op", value:c}); i++; continue; }
    pyThrow(`พบอักขระที่ไม่รองรับ “${c}” ในนิพจน์`, line);
  }
  return tokens;
}

/* ---- Pratt-ish recursive descent parser ---- */
function parseExpr(src,line){
  const tokens = tokenizeExpr(src,line);
  let pos = 0;
  const peek = ()=>tokens[pos];
  const next = ()=>tokens[pos++];
  const eat = (val)=>{ const t = tokens[pos]; if(!t || t.value !== val) pyThrow(`นิพจน์ไม่สมบูรณ์ (คาดว่าจะพบ “${val}”)`, line); pos++; return t; };

  function parsePrimary(){
    const t = peek();
    if(!t) pyThrow("นิพจน์ไม่สมบูรณ์", line);
    if(t.type === "num"){ next(); return {k:"num", v:t.value}; }
    if(t.type === "str"){ next(); return {k:"str", raw:t.value}; }
    if(t.type === "fstr"){ next(); return {k:"fstr", raw:t.value}; }
    if(t.type === "kw"){
      if(t.value === "True"){ next(); return {k:"bool", v:true}; }
      if(t.value === "False"){ next(); return {k:"bool", v:false}; }
      if(t.value === "None"){ next(); return {k:"none"}; }
      if(t.value === "not"){ next(); return {k:"not", e:parseNot()}; }
      pyThrow(`ใช้คำสงวน “${t.value}” ผิดตำแหน่ง`, line);
    }
    if(t.type === "name"){ next(); return {k:"name", id:t.value}; }
    if(t.value === "("){ next(); const e = parseExpression(); eat(")"); return e; }
    if(t.value === "["){
      next(); const items = [];
      if(peek() && peek().value !== "]"){
        items.push(parseExpression());
        while(peek() && peek().value === ","){ next(); if(peek() && peek().value === "]") break; items.push(parseExpression()); }
      }
      eat("]"); return {k:"list", items};
    }
    pyThrow(`ไม่เข้าใจส่วนของนิพจน์ใกล้ “${t.value}”`, line);
  }

  function parsePostfix(){
    let node = parsePrimary();
    while(peek()){
      const t = peek();
      if(t.value === "("){
        next(); const args = [];
        if(peek() && peek().value !== ")"){
          args.push(parseExpression());
          while(peek() && peek().value === ","){ next(); if(peek() && peek().value === ")") break; args.push(parseExpression()); }
        }
        eat(")"); node = {k:"call", fn:node, args};
      }else if(t.value === "["){
        next(); const idx = parseExpression(); eat("]"); node = {k:"index", obj:node, idx};
      }else if(t.value === "."){
        next(); const name = next(); if(!name || (name.type !== "name")) pyThrow("หลังจุด . ต้องเป็นชื่อแอตทริบิวต์", line); node = {k:"attr", obj:node, name:name.value};
      }else break;
    }
    return node;
  }

  function parseUnary(){
    const t = peek();
    if(t && t.type === "op" && (t.value === "-" || t.value === "+")){ next(); return {k:"unary", op:t.value, e:parseUnary()}; }
    return parsePower();
  }
  function parsePower(){
    const base = parsePostfix();
    if(peek() && peek().value === "**"){ next(); return {k:"bin", op:"**", a:base, b:parseUnary()}; }
    return base;
  }
  function parseMul(){
    let node = parseUnary();
    while(peek() && ["*","/","//","%"].includes(peek().value)){ const op = next().value; node = {k:"bin", op, a:node, b:parseUnary()}; }
    return node;
  }
  function parseAdd(){
    let node = parseMul();
    while(peek() && (peek().value === "+" || peek().value === "-")){ const op = next().value; node = {k:"bin", op, a:node, b:parseMul()}; }
    return node;
  }
  function parseCompare(){
    let node = parseAdd();
    while(peek() && (["==","!=","<","<=",">",">="].includes(peek().value) || (peek().type === "kw" && peek().value === "in"))){
      const op = next().value; node = {k:"cmp", op, a:node, b:parseAdd()};
    }
    return node;
  }
  function parseNot(){
    if(peek() && peek().type === "kw" && peek().value === "not"){ next(); return {k:"not", e:parseNot()}; }
    return parseCompare();
  }
  function parseAnd(){
    let node = parseNot();
    while(peek() && peek().type === "kw" && peek().value === "and"){ next(); node = {k:"logic", op:"and", a:node, b:parseNot()}; }
    return node;
  }
  function parseOr(){
    let node = parseAnd();
    while(peek() && peek().type === "kw" && peek().value === "or"){ next(); node = {k:"logic", op:"or", a:node, b:parseAnd()}; }
    return node;
  }
  function parseExpression(){ return parseOr(); }

  const ast = parseExpression();
  if(pos < tokens.length) pyThrow(`มีส่วนเกินในนิพจน์ใกล้ “${tokens[pos].value}”`, line);
  return ast;
}

/* ---- evaluator ---- */
function PyScope(parent){ this.vars = Object.create(null); this.parent = parent; }
PyScope.prototype.get = function(name){
  let s = this;
  while(s){ if(name in s.vars) return s.vars[name]; s = s.parent; }
  return undefined;
};

function pyNumericOp(op,a,b,line){
  const na = Number(a.v), nb = Number(b.v);
  const bothInt = (a.t === "int" || a.t === "bool") && (b.t === "int" || b.t === "bool");
  let r;
  switch(op){
    case "+": r = na + nb; break;
    case "-": r = na - nb; break;
    case "*": r = na * nb; break;
    case "/": if(nb === 0) pyThrow("หารด้วยศูนย์ไม่ได้ (division by zero)", line); return pyFloat(na / nb);
    case "//": if(nb === 0) pyThrow("หารด้วยศูนย์ไม่ได้ (division by zero)", line); r = Math.floor(na / nb); return bothInt ? pyInt(r) : pyFloat(r);
    case "%": if(nb === 0) pyThrow("หารด้วยศูนย์ไม่ได้ (modulo by zero)", line); r = ((na % nb) + nb) % nb; return bothInt ? pyInt(r) : pyFloat(r);
    case "**": r = Math.pow(na, nb); break;
    default: pyThrow(`ตัวดำเนินการ “${op}” ไม่รองรับ`, line);
  }
  return bothInt ? pyInt(r) : pyFloat(r);
}

function pyCompare(op,a,b,line){
  if(op === "==") return pyBool(pyEquals(a,b));
  if(op === "!=") return pyBool(!pyEquals(a,b));
  if(op === "in"){
    if(b.t === "list") return pyBool(b.v.some(item=>pyEquals(item,a)));
    if(b.t === "str" && a.t === "str") return pyBool(b.v.includes(a.v));
    pyThrow("ใช้ in ได้กับลิสต์หรือข้อความเท่านั้น", line);
  }
  const an = (a.t === "int" || a.t === "float" || a.t === "bool");
  const bn = (b.t === "int" || b.t === "float" || b.t === "bool");
  let cmp;
  if(an && bn) cmp = Number(a.v) - Number(b.v);
  else if(a.t === "str" && b.t === "str") cmp = a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
  else pyThrow("เปรียบเทียบค่าต่างชนิดกันไม่ได้", line);
  switch(op){
    case "<": return pyBool(cmp < 0);
    case "<=": return pyBool(cmp <= 0);
    case ">": return pyBool(cmp > 0);
    case ">=": return pyBool(cmp >= 0);
  }
}

function evalNode(node,env,ctx,line){
  switch(node.k){
    case "num": return node.v.includes(".") ? pyFloat(Number(node.v)) : pyInt(Number(node.v));
    case "str": { const d = decodeRestrictedString(node.raw); if(!d.ok) pyThrow("ข้อความ (string) เขียนไม่สมบูรณ์", line); return pyStrVal(d.value); }
    case "bool": return pyBool(node.v);
    case "none": return PY_NONE;
    case "fstr": return evalFStringPy(node.raw,env,ctx,line);
    case "list": return {t:"list", v:node.items.map(it=>evalNode(it,env,ctx,line))};
    case "name": {
      const v = env.get(node.id);
      if(v !== undefined) return v;
      if(PY_BUILTINS[node.id]) return {t:"builtin", name:node.id};
      pyThrow(`ยังไม่ได้สร้างตัวแปร/ฟังก์ชัน “${node.id}” ก่อนนำมาใช้`, line);
    }
    case "unary": { const e = evalNode(node.e,env,ctx,line); if(e.t !== "int" && e.t !== "float" && e.t !== "bool") pyThrow("ใช้เครื่องหมายลบกับค่าที่ไม่ใช่ตัวเลขไม่ได้", line); return node.op === "-" ? pyNum(-Number(e.v)) : pyNum(Number(e.v)); }
    case "not": return pyBool(!pyTruthy(evalNode(node.e,env,ctx,line)));
    case "logic": {
      const a = evalNode(node.a,env,ctx,line);
      if(node.op === "and") return pyTruthy(a) ? evalNode(node.b,env,ctx,line) : a;
      return pyTruthy(a) ? a : evalNode(node.b,env,ctx,line);
    }
    case "cmp": return pyCompare(node.op, evalNode(node.a,env,ctx,line), evalNode(node.b,env,ctx,line), line);
    case "bin": {
      const a = evalNode(node.a,env,ctx,line);
      const b = evalNode(node.b,env,ctx,line);
      if(node.op === "+"){
        if(a.t === "str" && b.t === "str") return pyStrVal(a.v + b.v);
        if(a.t === "list" && b.t === "list") return {t:"list", v:a.v.concat(b.v)};
        if(a.t === "str" || b.t === "str") pyThrow("เชื่อมข้อความกับตัวเลขตรง ๆ ไม่ได้ ต้องใช้ str() หรือ f-string", line);
      }
      if(node.op === "*" && ((a.t === "str" && (b.t === "int")) || (b.t === "str" && a.t === "int"))){
        const str = a.t === "str" ? a.v : b.v; const n = a.t === "str" ? b.v : a.v; return pyStrVal(str.repeat(Math.max(0,n)));
      }
      if((a.t !== "int" && a.t !== "float" && a.t !== "bool") || (b.t !== "int" && b.t !== "float" && b.t !== "bool")) pyThrow(`ใช้ “${node.op}” กับค่าชนิดนี้ไม่ได้`, line);
      return pyNumericOp(node.op,a,b,line);
    }
    case "index": {
      const obj = evalNode(node.obj,env,ctx,line);
      const idx = evalNode(node.idx,env,ctx,line);
      if(idx.t !== "int" && idx.t !== "bool") pyThrow("ดัชนี (index) ต้องเป็นจำนวนเต็ม", line);
      if(obj.t === "list" || obj.t === "str"){
        const arr = obj.t === "list" ? obj.v : obj.v;
        let i = idx.v; if(i < 0) i += arr.length;
        if(i < 0 || i >= arr.length) pyThrow("ดัชนีเกินขอบเขตของลิสต์/ข้อความ (index out of range)", line);
        return obj.t === "list" ? arr[i] : pyStrVal(obj.v[i]);
      }
      pyThrow("ใช้ [ ] ได้กับลิสต์หรือข้อความเท่านั้น", line);
    }
    case "attr": {
      const obj = evalNode(node.obj,env,ctx,line);
      if(obj.t === "instance"){
        if(node.name in obj.fields) return obj.fields[node.name];
        if(obj.cls.methods[node.name]) return {t:"bound", self:obj, func:obj.cls.methods[node.name]};
        pyThrow(`ออบเจ็กต์ไม่มีแอตทริบิวต์ “${node.name}”`, line);
      }
      if(obj.t === "list" && (node.name === "append")) return {t:"listmethod", obj, name:node.name};
      pyThrow(`ค่าชนิดนี้ไม่มีแอตทริบิวต์ “${node.name}”`, line);
    }
    case "call": return evalCall(node,env,ctx,line);
    default: pyThrow("ไม่รู้จักรูปแบบนิพจน์", line);
  }
}

function evalCall(node,env,ctx,line){
  const fnNode = node.fn;
  const args = node.args.map(a=>evalNode(a,env,ctx,line));
  if(fnNode.k === "attr"){
    const obj = evalNode(fnNode.obj,env,ctx,line);
    if(obj.t === "list" && fnNode.name === "append"){ if(args.length !== 1) pyThrow("append() รับค่าได้ทีละหนึ่งค่า", line); obj.v.push(args[0]); return PY_NONE; }
    if(obj.t === "instance"){
      const method = obj.cls.methods[fnNode.name];
      if(!method) pyThrow(`ออบเจ็กต์ไม่มีเมธอด “${fnNode.name}”`, line);
      return callPyFunction(method, args, ctx, obj, line);
    }
    pyThrow(`เรียกเมธอด “${fnNode.name}” จากค่าชนิดนี้ไม่ได้`, line);
  }
  const fn = evalNode(fnNode,env,ctx,line);
  if(fn.t === "builtin") return callBuiltin(fn.name, args, ctx, line);
  if(fn.t === "func") return callPyFunction(fn, args, ctx, null, line);
  if(fn.t === "bound") return callPyFunction(fn.func, args, ctx, fn.self, line);
  if(fn.t === "class"){
    const instance = {t:"instance", cls:fn, fields:Object.create(null)};
    const init = fn.methods["__init__"];
    if(init) callPyFunction(init, args, ctx, instance, line);
    return instance;
  }
  pyThrow("สิ่งนี้เรียกใช้แบบฟังก์ชันไม่ได้", line);
}

function callPyFunction(fn, args, ctx, selfVal, line){
  if(++ctx.calls > 4000) pyThrow("เรียกฟังก์ชันซ้อนลึกเกินไป", line);
  const scope = new PyScope(ctx.global);
  const params = fn.params.slice();
  let need = params.slice();
  if(fn.isMethod){ scope.vars[params[0]] = selfVal; need = params.slice(1); }
  if(args.length !== need.length) pyThrow(`ฟังก์ชัน ${fn.name}() ต้องการอาร์กิวเมนต์ ${need.length} ตัว แต่ได้รับ ${args.length} ตัว`, line);
  need.forEach((p,i)=>{ scope.vars[p] = args[i]; });
  try { execBlock(fn.body, scope, ctx); }
  catch(e){ if(e && e.__return) { ctx.calls--; return e.value; } throw e; }
  ctx.calls--;
  return PY_NONE;
}

const PY_BUILTINS = {print:1, len:1, range:1, str:1, int:1, bool:1, float:1};
function callBuiltin(name, args, ctx, line){
  switch(name){
    case "print": ctx.out.push(args.map(pyStr).join(" ") + "\n"); return PY_NONE;
    case "len": { const a = args[0]; if(a && (a.t === "list" || a.t === "str")) return pyInt(a.v.length); pyThrow("len() ใช้ได้กับลิสต์หรือข้อความเท่านั้น", line); }
    case "str": return pyStrVal(args.length ? pyStr(args[0]) : "");
    case "int": { const a = args[0]; if(!a) return pyInt(0); if(a.t === "int") return a; if(a.t === "float" || a.t === "bool") return pyInt(Math.trunc(Number(a.v))); const n = parseInt(a.v,10); if(Number.isNaN(n)) pyThrow("int() แปลงค่านี้เป็นจำนวนเต็มไม่ได้", line); return pyInt(n); }
    case "float": { const a = args[0]; if(!a) return pyFloat(0); const n = Number(a.v); if(Number.isNaN(n)) pyThrow("float() แปลงค่านี้ไม่ได้", line); return pyFloat(n); }
    case "bool": return pyBool(args.length ? pyTruthy(args[0]) : false);
    case "range": {
      let start = 0, stop = 0, step = 1;
      const nums = args.map(a=>{ if(a.t !== "int" && a.t !== "bool") pyThrow("range() รับได้เฉพาะจำนวนเต็ม", line); return a.v; });
      if(nums.length === 1) stop = nums[0];
      else if(nums.length === 2){ start = nums[0]; stop = nums[1]; }
      else if(nums.length >= 3){ start = nums[0]; stop = nums[1]; step = nums[2]; }
      if(step === 0) pyThrow("range() step เป็นศูนย์ไม่ได้", line);
      const arr = [];
      if(step > 0){ for(let i=start;i<stop;i+=step){ arr.push(pyInt(i)); if(arr.length > 100000) pyThrow("range() ใหญ่เกินไป", line); } }
      else { for(let i=start;i>stop;i+=step){ arr.push(pyInt(i)); if(arr.length > 100000) pyThrow("range() ใหญ่เกินไป", line); } }
      return {t:"list", v:arr};
    }
  }
  pyThrow(`ยังไม่รองรับฟังก์ชัน ${name}()`, line);
}

function evalFStringPy(rawToken,env,ctx,line){
  const decoded = decodeRestrictedString(rawToken);
  if(!decoded.ok) pyThrow("f-string เขียนไม่สมบูรณ์", line);
  const raw = decoded.value;
  let out = "";
  for(let i=0;i<raw.length;i++){
    const ch = raw[i];
    if(ch === "{"){
      if(raw[i+1] === "{"){ out += "{"; i++; continue; }
      const end = raw.indexOf("}", i+1);
      if(end === -1) pyThrow("f-string ขาดวงเล็บปีกกาปิด }", line);
      const inner = raw.slice(i+1,end).trim();
      if(!inner) pyThrow("{ } ใน f-string ต้องมีค่าอยู่ข้างใน", line);
      out += pyStr(evalNode(parseExpr(inner,line),env,ctx,line));
      i = end; continue;
    }
    if(ch === "}"){ if(raw[i+1] === "}"){ out += "}"; i++; continue; } pyThrow("พบ } ที่ไม่มี { คู่กัน", line); }
    out += ch;
  }
  return pyStrVal(out);
}

/* ---- statement execution ---- */
function execBlock(stmts,env,ctx){
  for(const stmt of stmts) execStmt(stmt,env,ctx);
}

function execStmt(stmt,env,ctx){
  if(++ctx.steps > 200000) pyThrow("โปรแกรมทำงานนานเกินไป (อาจเกิดลูปไม่รู้จบ)", stmt.line);
  ctx.line = stmt.line;
  switch(stmt.s){
    case "pass": return;
    case "expr": evalNode(stmt.ast, env, ctx, stmt.line); return;
    case "assign": {
      const value = evalNode(stmt.expr, env, ctx, stmt.line);
      assignTarget(stmt.target, value, env, ctx, stmt.line);
      return;
    }
    case "augassign": {
      const cur = evalNode(parseExpr(stmt.target, stmt.line), env, ctx, stmt.line);
      const rhs = evalNode(stmt.expr, env, ctx, stmt.line);
      const opMap = {"+=":"+","-=":"-","*=":"*","//=":"//","%=":"%","/=":"/"};
      const op = opMap[stmt.op];
      let result;
      if(op === "+" && cur.t === "str" && rhs.t === "str") result = pyStrVal(cur.v + rhs.v);
      else result = pyNumericOp(op, cur, rhs, stmt.line);
      assignTarget(stmt.target, result, env, ctx, stmt.line);
      return;
    }
    case "if": {
      for(const clause of stmt.clauses){
        if(clause.cond === null || pyTruthy(evalNode(clause.cond, env, ctx, stmt.line))){ execBlock(clause.body, env, ctx); return; }
      }
      return;
    }
    case "while": {
      let guard = 0;
      while(pyTruthy(evalNode(stmt.cond, env, ctx, stmt.line))){
        if(++guard > 100000) pyThrow("ลูป while ทำงานนานเกินไป (อาจลืมเงื่อนไขหยุด)", stmt.line);
        try { execBlock(stmt.body, env, ctx); }
        catch(e){ if(e && e.__break) break; if(e && e.__continue) continue; throw e; }
      }
      return;
    }
    case "for": {
      const iterable = evalNode(stmt.iter, env, ctx, stmt.line);
      let items;
      if(iterable.t === "list") items = iterable.v;
      else if(iterable.t === "str") items = Array.from(iterable.v).map(pyStrVal);
      else pyThrow("for วนซ้ำได้เฉพาะลิสต์ ข้อความ หรือ range()", stmt.line);
      for(const item of items){
        env.vars[stmt.name] = item;
        try { execBlock(stmt.body, env, ctx); }
        catch(e){ if(e && e.__break) break; if(e && e.__continue) continue; throw e; }
      }
      return;
    }
    case "def": {
      env.vars[stmt.name] = {t:"func", name:stmt.name, params:stmt.params, body:stmt.body, isMethod:false};
      return;
    }
    case "class": {
      const methods = Object.create(null);
      for(const m of stmt.body){
        if(m.s === "def") methods[m.name] = {t:"func", name:m.name, params:m.params, body:m.body, isMethod:true};
      }
      env.vars[stmt.name] = {t:"class", name:stmt.name, methods};
      return;
    }
    case "return": throw {__return:true, value: stmt.expr ? evalNode(stmt.expr, env, ctx, stmt.line) : PY_NONE};
    case "break": throw {__break:true};
    case "continue": throw {__continue:true};
    default: pyThrow("ยังไม่รองรับคำสั่งนี้", stmt.line);
  }
}

function assignTarget(target, value, env, ctx, line){
  if(/^[A-Za-z_]\w*$/.test(target)){ env.vars[target] = value; return; }
  const dot = target.lastIndexOf(".");
  if(dot > 0){
    const objExpr = target.slice(0,dot);
    const attr = target.slice(dot+1);
    const obj = evalNode(parseExpr(objExpr,line), env, ctx, line);
    if(obj.t !== "instance") pyThrow("กำหนดค่าให้แอตทริบิวต์ได้เฉพาะกับออบเจ็กต์", line);
    obj.fields[attr] = value;
    return;
  }
  pyThrow(`กำหนดค่าให้ “${target}” ไม่ได้`, line);
}

/* ---- line preprocessing + block parsing ---- */
function pyStripComment(text){
  let result = ""; let quote = ""; let hadComment = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(quote){ result += c; if(c === "\\"){ result += text[i+1] || ""; i++; continue; } if(c === quote) quote = ""; continue; }
    if(c === '"' || c === "'"){ quote = c; result += c; continue; }
    if(c === "#"){ hadComment = true; break; }
    result += c;
  }
  return {text:result.replace(/\s+$/,""), hadComment};
}

function pyLogicalLines(code){
  const rawLines = String(code).replace(/\r\n?/g,"\n").split("\n");
  const lines = [];
  let hadComment = false;
  rawLines.forEach((raw,index)=>{
    const expanded = raw.replace(/\t/g,"    ");
    const stripped = pyStripComment(expanded);
    if(stripped.hadComment) hadComment = true;
    if(stripped.text.trim() === "") return;
    const indent = stripped.text.length - stripped.text.replace(/^ +/,"").length;
    lines.push({indent, text:stripped.text.trim(), line:index+1});
  });
  return {lines, hadComment};
}

function parseSuite(L, cur, indent){
  const stmts = [];
  while(cur.i < L.length && L[cur.i].indent === indent){
    stmts.push(parseStatement(L, cur, indent));
  }
  if(cur.i < L.length && L[cur.i].indent > indent) pyThrow("การเยื้อง (indent) ไม่ถูกต้อง", L[cur.i].line);
  return stmts;
}

function parseBody(L, cur, headerIndent, headerLine){
  if(cur.i >= L.length || L[cur.i].indent <= headerIndent) pyThrow("หลังเครื่องหมาย : ต้องมีคำสั่งที่เยื้องเข้าไปอย่างน้อยหนึ่งบรรทัด", headerLine);
  const bodyIndent = L[cur.i].indent;
  return parseSuite(L, cur, bodyIndent);
}

function parseStatement(L, cur, indent){
  const ln = L[cur.i];
  const text = ln.text;
  let m;
  if((m = text.match(/^if\s+(.+):$/))){
    cur.i++;
    const clauses = [{cond: parseExpr(m[1], ln.line), body: parseBody(L, cur, indent, ln.line)}];
    while(cur.i < L.length && L[cur.i].indent === indent){
      const t = L[cur.i].text; let mm;
      if((mm = t.match(/^elif\s+(.+):$/))){ const el = L[cur.i]; cur.i++; clauses.push({cond: parseExpr(mm[1], el.line), body: parseBody(L, cur, indent, el.line)}); }
      else if(/^else\s*:$/.test(t)){ const el = L[cur.i]; cur.i++; clauses.push({cond:null, body: parseBody(L, cur, indent, el.line)}); break; }
      else break;
    }
    return {s:"if", clauses, line:ln.line};
  }
  if((m = text.match(/^for\s+([A-Za-z_]\w*)\s+in\s+(.+):$/))){ cur.i++; return {s:"for", name:m[1], iter:parseExpr(m[2], ln.line), body:parseBody(L, cur, indent, ln.line), line:ln.line}; }
  if((m = text.match(/^while\s+(.+):$/))){ cur.i++; return {s:"while", cond:parseExpr(m[1], ln.line), body:parseBody(L, cur, indent, ln.line), line:ln.line}; }
  if((m = text.match(/^def\s+([A-Za-z_]\w*)\s*\((.*)\)\s*:$/))){ cur.i++; const params = m[2].trim() === "" ? [] : m[2].split(",").map(p=>p.trim()); return {s:"def", name:m[1], params, body:parseBody(L, cur, indent, ln.line), line:ln.line}; }
  if((m = text.match(/^class\s+([A-Za-z_]\w*)\s*(?:\(([A-Za-z_][\w.]*)\))?\s*:$/))){ cur.i++; return {s:"class", name:m[1], body:parseBody(L, cur, indent, ln.line), line:ln.line}; }
  if(/^(elif|else)\b/.test(text)) pyThrow(`“${text.split(/\s/)[0]}” ต้องอยู่คู่กับ if เท่านั้น`, ln.line);
  cur.i++;
  if(text === "pass") return {s:"pass", line:ln.line};
  if(text === "break") return {s:"break", line:ln.line};
  if(text === "continue") return {s:"continue", line:ln.line};
  if((m = text.match(/^return\b(.*)$/))){ const rest = m[1].trim(); return {s:"return", expr: rest ? parseExpr(rest, ln.line) : null, line:ln.line}; }
  const aug = text.match(/^([A-Za-z_][\w.]*)\s*(\+=|-=|\*=|\/\/=|%=|\/=)\s*(.+)$/);
  if(aug) return {s:"augassign", target:aug[1], op:aug[2], expr:parseExpr(aug[3], ln.line), line:ln.line};
  const asn = text.match(/^([A-Za-z_][\w.]*)\s*=\s*(.+)$/);
  if(asn && !/^=/.test(asn[2])) return {s:"assign", target:asn[1], expr:parseExpr(asn[2], ln.line), line:ln.line};
  return {s:"expr", ast:parseExpr(text, ln.line), line:ln.line};
}

function runPython(code){
  const out = [];
  const global = new PyScope(null);
  const ctx = {out, steps:0, calls:0, line:0, global};
  try {
    const pre = pyLogicalLines(code);
    const L = pre.lines;
    const cur = {i:0};
    const program = parseSuite(L, cur, 0);
    if(cur.i < L.length) pyThrow("การเยื้องบรรทัดแรกต้องเริ่มที่คอลัมน์ซ้ายสุด", L[cur.i].line);
    execBlock(program, global, ctx);
    return {output: out.join(""), error:"", line:0, hasComment:pre.hadComment};
  } catch(e){
    if(e && e.__py) return {output: out.join(""), error:e.message, line:e.line || ctx.line || 0, hasComment:false};
    if(e && (e.__return || e.__break || e.__continue)) return {output: out.join(""), error:"ใช้ return/break/continue นอกตำแหน่งที่ถูกต้อง", line:ctx.line || 0};
    return {output: out.join(""), error:"รันโค้ดไม่สำเร็จ: " + (e && e.message ? e.message : String(e)), line:ctx.line || 0};
  }
}

/* =============================================================
   MINI JAVA INTERPRETER (Java Learn)
   Supports: class/main, int/double/String/boolean, arithmetic,
   comparisons, && || !, string concat, if/else, for, while,
   arrays (literal, index, length), static methods, classes
   (fields, constructor, methods, this, new), System.out.println/print
   ============================================================= */
function JErr(message,line){ this.__j = true; this.message = message; this.line = line || 0; }
function jThrow(message,line){ throw new JErr(message,line); }

function jInt(v){ return {t:"int", v:Math.trunc(v)}; }
function jDouble(v){ return {t:"double", v:v}; }
function jStr(v){ return {t:"str", v:String(v)}; }
function jBool(v){ return {t:"bool", v:!!v}; }
const JNULL = {t:"null", v:null};
function jArray(arr){ return {t:"array", v:arr}; }
function jIsNum(x){ return x && (x.t === "int" || x.t === "double"); }

function jToString(val){
  if(!val) return "null";
  switch(val.t){
    case "null": return "null";
    case "bool": return val.v ? "true" : "false";
    case "int": return String(val.v);
    case "double": return Number.isInteger(val.v) ? val.v.toFixed(1) : String(val.v);
    case "str": return val.v;
    case "array": return "[" + val.v.map(jToString).join(", ") + "]";
    case "instance": return val.cls.name + "@obj";
    default: return String(val.v);
  }
}
function jTruthy(val,line){ if(val && val.t === "bool") return val.v; jThrow("เงื่อนไขต้องเป็น boolean", line); }
function jDefault(type){
  const base = type.replace("[]","");
  if(type.endsWith("[]")) return JNULL;
  if(base === "int") return jInt(0);
  if(base === "double") return jDouble(0);
  if(base === "boolean") return jBool(false);
  return JNULL;
}
function jCoerce(type,val,line){
  if(type === "int"){ if(!jIsNum(val)) jThrow("ต้องกำหนดค่าตัวเลขให้ int", line); return jInt(val.v); }
  if(type === "double"){ if(!jIsNum(val)) jThrow("ต้องกำหนดค่าตัวเลขให้ double", line); return jDouble(val.v); }
  if(type === "boolean"){ if(val.t !== "bool") jThrow("ต้องกำหนดค่า true/false ให้ boolean", line); return val; }
  if(type === "String"){ if(val.t !== "str" && val.t !== "null") jThrow("ต้องกำหนดข้อความให้ String", line); return val; }
  return val;
}

/* ---- tokenizer ---- */
function jTokenize(code){
  const s = String(code).replace(/\r\n?/g,"\n");
  const toks = [];
  let i = 0, line = 1, hadComment = false;
  const twos = ["==","!=","<=",">=","&&","||","++","--","+=","-=","*=","/=","%="];
  const singles = "+-*/%<>=!(){}[];,.";
  while(i < s.length){
    const c = s[i];
    if(c === "\n"){ line++; i++; continue; }
    if(c === " " || c === "\t"){ i++; continue; }
    if(c === "/" && s[i+1] === "/"){ hadComment = true; while(i < s.length && s[i] !== "\n") i++; continue; }
    if(c === "/" && s[i+1] === "*"){ hadComment = true; i += 2; while(i < s.length && !(s[i] === "*" && s[i+1] === "/")){ if(s[i] === "\n") line++; i++; } i += 2; continue; }
    if(c === '"'){ let j = i+1, raw = '"'; while(j < s.length){ raw += s[j]; if(s[j] === "\\"){ raw += (s[j+1]||""); j += 2; continue; } if(s[j] === '"'){ j++; break; } j++; } toks.push({type:"str", value:raw, line}); i = j; continue; }
    if(c === "'"){ let j = i+1, raw = "'"; while(j < s.length){ raw += s[j]; if(s[j] === "\\"){ raw += (s[j+1]||""); j += 2; continue; } if(s[j] === "'"){ j++; break; } j++; } toks.push({type:"char", value:raw, line}); i = j; continue; }
    if(/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i+1] || ""))){ let j = i, num = ""; while(j < s.length && /[0-9.]/.test(s[j])){ num += s[j]; j++; } toks.push({type:"num", value:num, line}); i = j; continue; }
    if(/[A-Za-z_$]/.test(c)){ let j = i, name = ""; while(j < s.length && /[A-Za-z0-9_$]/.test(s[j])){ name += s[j]; j++; } toks.push({type:"word", value:name, line}); i = j; continue; }
    const two = s.substr(i,2);
    if(twos.includes(two)){ toks.push({type:"op", value:two, line}); i += 2; continue; }
    if(singles.includes(c)){ toks.push({type:"op", value:c, line}); i++; continue; }
    jThrow(`พบอักขระที่ไม่รองรับ “${c}”`, line);
  }
  toks.push({type:"eof", value:"<eof>", line});
  return {toks, hadComment};
}

/* ---- parser ---- */
const JAVA_TYPES = ["int","double","String","boolean","void","long","float","char"];
const JAVA_MODIFIERS = ["public","private","protected","static","final"];
function jParse(toks){
  let pos = 0;
  const peek = (k=0)=>toks[pos+k];
  const next = ()=>toks[pos++];
  const at = v=>peek().value === v;
  const eat = v=>{ if(peek().value !== v) jThrow(`คาดว่าจะพบ “${v}” แต่พบ “${peek().value}”`, peek().line); return next(); };
  const isType = ()=>{ const t = peek(); return t.type === "word" && (JAVA_TYPES.includes(t.value) || /^[A-Z]/.test(t.value)); };

  function parseType(){
    let name = next().value;
    while(at("[") && peek(1).value === "]"){ eat("["); eat("]"); name += "[]"; }
    return name;
  }

  function parseProgram(){
    const classes = [];
    while(peek().type !== "eof"){ classes.push(parseClass()); }
    return classes;
  }
  function parseClass(){
    while(JAVA_MODIFIERS.includes(peek().value)) next();
    eat("class");
    const name = next().value;
    eat("{");
    const cls = {name, fields:[], methods:{}, ctor:null};
    while(!at("}")){
      const start = pos;
      while(JAVA_MODIFIERS.includes(peek().value)) next();
      const isStatic = toks.slice(start,pos).some(t=>t.value === "static");
      // constructor: IDENT '(' with name === class name and no type before
      if(peek().type === "word" && peek().value === name && peek(1).value === "("){
        next(); // ctor name
        const params = parseParams();
        const body = parseBlock();
        cls.ctor = {params, body};
        continue;
      }
      const type = parseType();
      const memberName = next().value;
      if(at("(")){
        const params = parseParams();
        const body = parseBlock();
        cls.methods[memberName] = {name:memberName, params, body, isStatic, returnType:type};
      }else{
        let init = null;
        if(at("=")){ eat("="); init = parseExpr(); }
        eat(";");
        cls.fields.push({type, name:memberName, init});
      }
    }
    eat("}");
    return cls;
  }
  function parseParams(){
    eat("(");
    const params = [];
    if(!at(")")){
      do{ const type = parseType(); const name = next().value; params.push({type, name}); }while(at(",") && next());
    }
    eat(")");
    return params;
  }
  function parseBlock(){
    eat("{");
    const stmts = [];
    while(!at("}")) stmts.push(parseStatement());
    eat("}");
    return {k:"block", body:stmts};
  }
  function parseStatement(){
    const t = peek();
    if(at("{")) return parseBlock();
    if(at("if")){ next(); eat("("); const cond = parseExpr(); eat(")"); const then = parseStatement(); let els = null; if(at("else")){ next(); els = parseStatement(); } return {k:"if", cond, then, els, line:t.line}; }
    if(at("for")){ next(); eat("("); const init = at(";") ? null : parseSimpleStatement(); eat(";"); const cond = at(";") ? null : parseExpr(); eat(";"); const update = at(")") ? null : parseExprStatementInner(); eat(")"); const body = parseStatement(); return {k:"for", init, cond, update, body, line:t.line}; }
    if(at("while")){ next(); eat("("); const cond = parseExpr(); eat(")"); const body = parseStatement(); return {k:"while", cond, body, line:t.line}; }
    if(at("return")){ next(); let e = null; if(!at(";")) e = parseExpr(); eat(";"); return {k:"return", e, line:t.line}; }
    if(at("break")){ next(); eat(";"); return {k:"break", line:t.line}; }
    if(at("continue")){ next(); eat(";"); return {k:"continue", line:t.line}; }
    const s = parseSimpleStatement();
    eat(";");
    return s;
  }
  function parseSimpleStatement(){
    // variable declaration or expression
    if(isType() && (peek(1).type === "word" || (peek(1).value === "[" && peek(2).value === "]"))){
      const save = pos;
      const type = parseType();
      if(peek().type === "word" && (peek(1).value === "=" || peek(1).value === ";" || peek(1).value === "," || peek(1).value === ")")){
        const decls = [];
        do{
          const name = next().value;
          let init = null;
          if(at("=")){ eat("="); init = parseInitializer(); }
          decls.push({name, init});
        }while(at(",") && next());
        return {k:"decl", type, decls, line:toks[save].line};
      }
      pos = save;
    }
    return {k:"expr", e:parseExpr(), line:peek().line};
  }
  function parseExprStatementInner(){ // for-update (no semicolon)
    return {k:"expr", e:parseExpr(), line:peek().line};
  }
  function parseInitializer(){
    if(at("{")) return parseArrayLiteral();
    return parseExpr();
  }
  function parseArrayLiteral(){
    eat("{");
    const elems = [];
    if(!at("}")){ do{ if(at("}")) break; elems.push(parseInitializer()); }while(at(",") && next()); }
    eat("}");
    return {k:"arraylit", elems};
  }

  // expressions (precedence climbing)
  function parseExpr(){ return parseAssign(); }
  function parseAssign(){
    const left = parseOr();
    if(["=","+=","-=","*=","/=","%="].includes(peek().value)){
      const op = next().value;
      const right = parseAssign();
      return {k:"assign", target:left, op, e:right, line:peek().line};
    }
    return left;
  }
  function parseOr(){ let n = parseAnd(); while(at("||")){ next(); n = {k:"logic", op:"||", a:n, b:parseAnd()}; } return n; }
  function parseAnd(){ let n = parseEq(); while(at("&&")){ next(); n = {k:"logic", op:"&&", a:n, b:parseEq()}; } return n; }
  function parseEq(){ let n = parseRel(); while(peek().value === "==" || peek().value === "!="){ const op = next().value; n = {k:"bin", op, a:n, b:parseRel()}; } return n; }
  function parseRel(){ let n = parseAdd(); while(["<","<=",">",">="].includes(peek().value)){ const op = next().value; n = {k:"bin", op, a:n, b:parseAdd()}; } return n; }
  function parseAdd(){ let n = parseMul(); while(peek().value === "+" || peek().value === "-"){ const op = next().value; n = {k:"bin", op, a:n, b:parseMul()}; } return n; }
  function parseMul(){ let n = parseUnary(); while(["*","/","%"].includes(peek().value)){ const op = next().value; n = {k:"bin", op, a:n, b:parseUnary()}; } return n; }
  function parseUnary(){
    if(peek().value === "!"){ next(); return {k:"not", e:parseUnary()}; }
    if(peek().value === "-"){ next(); return {k:"neg", e:parseUnary()}; }
    if(peek().value === "+"){ next(); return parseUnary(); }
    if(peek().value === "++" || peek().value === "--"){ const op = next().value; return {k:"preincr", op, e:parseUnary()}; }
    return parsePostfix();
  }
  function parsePostfix(){
    let n = parsePrimary();
    while(true){
      if(at(".")){ next(); const name = next().value; n = {k:"member", obj:n, name}; }
      else if(at("[")){ next(); const idx = parseExpr(); eat("]"); n = {k:"index", obj:n, idx}; }
      else if(at("(")){ const args = parseArgs(); n = {k:"call", callee:n, args}; }
      else if(peek().value === "++" || peek().value === "--"){ const op = next().value; n = {k:"postincr", op, e:n}; }
      else break;
    }
    return n;
  }
  function parseArgs(){
    eat("(");
    const args = [];
    if(!at(")")){ do{ args.push(parseExpr()); }while(at(",") && next()); }
    eat(")");
    return args;
  }
  function parsePrimary(){
    const t = peek();
    if(t.type === "num"){ next(); return {k:"num", value:t.value}; }
    if(t.type === "str"){ next(); return {k:"str", raw:t.value}; }
    if(t.type === "char"){ next(); return {k:"char", raw:t.value}; }
    if(t.value === "true"){ next(); return {k:"bool", v:true}; }
    if(t.value === "false"){ next(); return {k:"bool", v:false}; }
    if(t.value === "null"){ next(); return {k:"null"}; }
    if(t.value === "new"){
      next();
      const type = parseType();
      if(at("{")){ const lit = parseArrayLiteral(); return {k:"arraylit", elems:lit.elems}; }
      if(at("[")){ eat("["); const size = at("]") ? null : parseExpr(); eat("]"); if(at("{")){ const lit = parseArrayLiteral(); return {k:"arraylit", elems:lit.elems}; } return {k:"newarray", size}; }
      const args = parseArgs();
      return {k:"new", type:type.replace("[]",""), args};
    }
    if(t.value === "("){ next(); const e = parseExpr(); eat(")"); return e; }
    if(t.value === "{"){ return parseArrayLiteral(); }
    if(t.type === "word"){ next(); return {k:"name", id:t.value}; }
    jThrow(`ไม่เข้าใจนิพจน์ใกล้ “${t.value}”`, t.line);
  }

  const classes = parseProgram();
  return classes;
}

/* ---- evaluator ---- */
function JScope(parent){ this.vars = Object.create(null); this.parent = parent; }
JScope.prototype.get = function(name){ let s = this; while(s){ if(name in s.vars) return s.vars[name]; s = s.parent; } return undefined; };
JScope.prototype.has = function(name){ let s = this; while(s){ if(name in s.vars) return true; s = s.parent; } return false; };
JScope.prototype.assign = function(name,val){ let s = this; while(s){ if(name in s.vars){ s.vars[name] = val; return true; } s = s.parent; } return false; };

function jNumOp(op,a,b,line){
  const bothInt = a.t === "int" && b.t === "int";
  const x = Number(a.v), y = Number(b.v);
  let r;
  switch(op){
    case "+": r = x + y; break;
    case "-": r = x - y; break;
    case "*": r = x * y; break;
    case "/": if(y === 0 && bothInt) jThrow("หารด้วยศูนย์ไม่ได้ (/ by zero)", line); r = bothInt ? Math.trunc(x / y) : x / y; break;
    case "%": if(y === 0 && bothInt) jThrow("หารด้วยศูนย์ไม่ได้ (% by zero)", line); r = bothInt ? (x % y) : (x % y); break;
    default: jThrow("ตัวดำเนินการไม่รองรับ: " + op, line);
  }
  return bothInt ? jInt(r) : jDouble(r);
}
function jCompare(op,a,b,line){
  if(op === "==" || op === "!="){
    let eq;
    if(jIsNum(a) && jIsNum(b)) eq = Number(a.v) === Number(b.v);
    else if(a.t === "bool" && b.t === "bool") eq = a.v === b.v;
    else if(a.t === "str" && b.t === "str") eq = a === b; // reference-ish; teach .equals
    else if(a.t === "null" || b.t === "null") eq = (a.t === "null" && b.t === "null");
    else eq = a === b;
    return jBool(op === "==" ? eq : !eq);
  }
  if(!jIsNum(a) || !jIsNum(b)) jThrow("เปรียบเทียบ <,>,<=,>= ได้เฉพาะตัวเลข", line);
  const x = Number(a.v), y = Number(b.v);
  return jBool(op === "<" ? x < y : op === "<=" ? x <= y : op === ">" ? x > y : x >= y);
}

function jDecodeString(raw){
  let out = "";
  for(let i=1;i<raw.length-1;i++){
    const c = raw[i];
    if(c === "\\"){ const n = raw[i+1]; i++; const map = {n:"\n",t:"\t",r:"\r",'"':'"',"'":"'","\\":"\\",b:"\b",f:"\f"}; out += Object.prototype.hasOwnProperty.call(map,n) ? map[n] : n; }
    else out += c;
  }
  return out;
}

function jEval(node,scope,ctx){
  switch(node.k){
    case "num": return node.value.includes(".") ? jDouble(Number(node.value)) : jInt(Number(node.value));
    case "str": return jStr(jDecodeString(node.raw));
    case "char": return jStr(jDecodeString(node.raw));
    case "bool": return jBool(node.v);
    case "null": return JNULL;
    case "name": {
      if(scope.has(node.id)) return scope.get(node.id);
      if(ctx.classes[node.id]) return {t:"classref", name:node.id};
      if(node.id === "System") return {t:"system"};
      jThrow(`ยังไม่ได้ประกาศตัวแปร “${node.id}”`, node.line);
    }
    case "neg": { const v = jEval(node.e,scope,ctx); if(!jIsNum(v)) jThrow("ใช้ลบกับค่าที่ไม่ใช่ตัวเลขไม่ได้", node.line); return v.t === "int" ? jInt(-v.v) : jDouble(-v.v); }
    case "not": { const v = jEval(node.e,scope,ctx); return jBool(!jTruthy(v,node.line)); }
    case "logic": { const a = jEval(node.a,scope,ctx); if(node.op === "&&") return jTruthy(a,node.line) ? jBool(jTruthy(jEval(node.b,scope,ctx),node.line)) : jBool(false); return jTruthy(a,node.line) ? jBool(true) : jBool(jTruthy(jEval(node.b,scope,ctx),node.line)); }
    case "bin": {
      const a = jEval(node.a,scope,ctx), b = jEval(node.b,scope,ctx);
      if(["==","!=","<","<=",">",">="].includes(node.op)) return jCompare(node.op,a,b,node.line);
      if(node.op === "+" && (a.t === "str" || b.t === "str")) return jStr(jToString(a) + jToString(b));
      if(!jIsNum(a) || !jIsNum(b)) jThrow(`ใช้ “${node.op}” กับค่าชนิดนี้ไม่ได้`, node.line);
      return jNumOp(node.op,a,b,node.line);
    }
    case "arraylit": return jArray(node.elems.map(e=>jEval(e,scope,ctx)));
    case "newarray": { const n = jEval(node.size,scope,ctx); const arr = []; for(let i=0;i<n.v;i++) arr.push(jInt(0)); return jArray(arr); }
    case "index": { const obj = jEval(node.obj,scope,ctx); const idx = jEval(node.idx,scope,ctx); if(!obj || obj.t !== "array") jThrow("ใช้ [ ] ได้กับ array เท่านั้น", node.line); const i = idx.v; if(i < 0 || i >= obj.v.length) jThrow("ดัชนีเกินขอบเขตของ array", node.line); return obj.v[i]; }
    case "member": {
      if(node.obj.k === "name" && node.obj.id === "System" && node.name === "out") return {t:"printer"};
      const obj = jEval(node.obj,scope,ctx);
      if(obj && obj.t === "array" && node.name === "length") return jInt(obj.v.length);
      if(obj && obj.t === "instance" && (node.name in obj.fields)) return obj.fields[node.name];
      if(obj && obj.t === "str" && node.name === "length") return {t:"strlen", str:obj};
      jThrow(`ไม่พบสมาชิก “${node.name}”`, node.line);
    }
    case "call": return jEvalCall(node,scope,ctx);
    case "assign": return jEvalAssign(node,scope,ctx);
    case "preincr": { const ref = jRef(node.e,scope,ctx); const cur = ref.get(); const nv = node.op === "++" ? jNumOp("+",cur,jInt(1),node.line) : jNumOp("-",cur,jInt(1),node.line); ref.set(nv); return nv; }
    case "postincr": { const ref = jRef(node.e,scope,ctx); const cur = ref.get(); const nv = node.op === "++" ? jNumOp("+",cur,jInt(1),node.line) : jNumOp("-",cur,jInt(1),node.line); ref.set(nv); return cur; }
    default: jThrow("นิพจน์ไม่รองรับ", node.line);
  }
}

function jRef(node,scope,ctx){
  if(node.k === "name"){ return { get:()=>{ if(!scope.has(node.id)) jThrow(`ยังไม่ได้ประกาศตัวแปร “${node.id}”`, node.line); return scope.get(node.id); }, set:v=>scope.assign(node.id,v) }; }
  if(node.k === "index"){ const obj = jEval(node.obj,scope,ctx); const idx = jEval(node.idx,scope,ctx); if(!obj || obj.t !== "array") jThrow("ใช้ [ ] ได้กับ array เท่านั้น", node.line); return { get:()=>obj.v[idx.v], set:v=>{ obj.v[idx.v] = v; } }; }
  if(node.k === "member"){ const obj = jEval(node.obj,scope,ctx); if(!obj || obj.t !== "instance") jThrow("กำหนดค่าให้แอตทริบิวต์ได้เฉพาะออบเจ็กต์", node.line); return { get:()=>obj.fields[node.name], set:v=>{ obj.fields[node.name] = v; } }; }
  jThrow("กำหนดค่าให้สิ่งนี้ไม่ได้", node.line);
}

function jEvalAssign(node,scope,ctx){
  const ref = jRef(node.target,scope,ctx);
  let val = jEval(node.e,scope,ctx);
  if(node.op !== "="){
    const cur = ref.get();
    const op = node.op[0];
    if(op === "+" && (cur.t === "str" || val.t === "str")) val = jStr(jToString(cur) + jToString(val));
    else val = jNumOp(op,cur,val,node.line);
  }
  ref.set(val);
  return val;
}

function jEvalCall(node,scope,ctx){
  const callee = node.callee;
  // System.out.println / print
  if(callee.k === "member" && (callee.name === "println" || callee.name === "print")){
    const base = jEval(callee.obj,scope,ctx);
    if(base && base.t === "printer"){
      const parts = node.args.map(a=>jToString(jEval(a,scope,ctx)));
      ctx.out.push(parts.join("") + (callee.name === "println" ? "\n" : ""));
      return JNULL;
    }
  }
  // String.length()
  if(callee.k === "member" && callee.name === "length"){
    const obj = jEval(callee.obj,scope,ctx);
    if(obj && obj.t === "str") return jInt(obj.v.length);
    if(obj && obj.t === "array") return jInt(obj.v.length);
  }
  // String.equals()
  if(callee.k === "member" && callee.name === "equals"){
    const obj = jEval(callee.obj,scope,ctx);
    const arg = jEval(node.args[0],scope,ctx);
    return jBool(obj.t === "str" && arg.t === "str" && obj.v === arg.v);
  }
  // instance method
  if(callee.k === "member"){
    const obj = jEval(callee.obj,scope,ctx);
    if(obj && obj.t === "instance"){
      const method = obj.cls.methods[callee.name];
      if(!method) jThrow(`ออบเจ็กต์ไม่มีเมธอด “${callee.name}”`, node.line);
      return jInvoke(method, node.args.map(a=>jEval(a,scope,ctx)), obj, ctx, node.line);
    }
    jThrow(`เรียกเมธอด “${callee.name}” ไม่ได้`, node.line);
  }
  // plain call: static method in current class
  if(callee.k === "name"){
    const method = ctx.mainClass.methods[callee.id];
    if(method) return jInvoke(method, node.args.map(a=>jEval(a,scope,ctx)), null, ctx, node.line);
    jThrow(`ไม่พบเมธอด “${callee.id}”`, node.line);
  }
  jThrow("เรียกใช้แบบฟังก์ชันไม่ได้", node.line);
}

function jInvoke(method,args,self,ctx,line){
  if(++ctx.calls > 4000) jThrow("เรียกเมธอดซ้อนลึกเกินไป", line);
  const scope = new JScope(ctx.global);
  if(self) scope.vars["this"] = self;
  if(args.length !== method.params.length) jThrow(`เมธอด ${method.name}() ต้องการอาร์กิวเมนต์ ${method.params.length} ตัว แต่ได้ ${args.length}`, line);
  method.params.forEach((p,i)=>{ scope.vars[p.name] = jCoerce(p.type, args[i], line); });
  const sig = {returned:false, value:JNULL};
  jExecBlock(method.body.body, scope, ctx, sig);
  ctx.calls--;
  return sig.value;
}

function jExecBlock(stmts,scope,ctx,sig){
  for(const st of stmts){ jExec(st,scope,ctx,sig); if(sig.returned || sig.broke || sig.continued) return; }
}

function jExec(node,scope,ctx,sig){
  if(++ctx.steps > 300000) jThrow("โปรแกรมทำงานนานเกินไป (อาจมีลูปไม่รู้จบ)", node.line);
  ctx.line = node.line || ctx.line;
  switch(node.k){
    case "block": { const inner = new JScope(scope); jExecBlock(node.body, inner, ctx, sig); return; }
    case "decl": {
      for(const d of node.decls){
        let val = d.init ? jEval(d.init, scope, ctx) : jDefault(node.type);
        if(d.init) val = jCoerce(node.type, val, node.line);
        scope.vars[d.name] = val;
      }
      return;
    }
    case "expr": jEval(node.e, scope, ctx); return;
    case "if": { if(jTruthy(jEval(node.cond,scope,ctx),node.line)) jExec(node.then,scope,ctx,sig); else if(node.els) jExec(node.els,scope,ctx,sig); return; }
    case "while": {
      let guard = 0;
      while(jTruthy(jEval(node.cond,scope,ctx),node.line)){
        if(++guard > 200000) jThrow("ลูป while ทำงานนานเกินไป", node.line);
        jExec(node.body,scope,ctx,sig);
        if(sig.returned) return; if(sig.broke){ sig.broke = false; break; } if(sig.continued){ sig.continued = false; }
      }
      return;
    }
    case "for": {
      const inner = new JScope(scope);
      if(node.init) jExec(node.init, inner, ctx, sig);
      let guard = 0;
      while(node.cond ? jTruthy(jEval(node.cond,inner,ctx),node.line) : true){
        if(++guard > 200000) jThrow("ลูป for ทำงานนานเกินไป", node.line);
        jExec(node.body,inner,ctx,sig);
        if(sig.returned) return; if(sig.broke){ sig.broke = false; break; } if(sig.continued){ sig.continued = false; }
        if(node.update) jEval(node.update.e, inner, ctx);
      }
      return;
    }
    case "return": { sig.value = node.e ? jEval(node.e,scope,ctx) : JNULL; sig.returned = true; return; }
    case "break": sig.broke = true; return;
    case "continue": sig.continued = true; return;
    default: jThrow("คำสั่งไม่รองรับ", node.line);
  }
}

function jInstantiate(clsName,args,ctx,line){
  const cls = ctx.classes[clsName];
  if(!cls) jThrow(`ไม่พบคลาส “${clsName}”`, line);
  const instance = {t:"instance", cls, fields:Object.create(null)};
  cls.fields.forEach(f=>{ instance.fields[f.name] = f.init ? jCoerce(f.type, jEval(f.init, ctx.global, ctx), line) : jDefault(f.type); });
  if(cls.ctor){
    if(++ctx.calls > 4000) jThrow("สร้างออบเจ็กต์ซ้อนลึกเกินไป", line);
    const scope = new JScope(ctx.global);
    scope.vars["this"] = instance;
    if(args.length !== cls.ctor.params.length) jThrow(`constructor ${clsName}() ต้องการ ${cls.ctor.params.length} อาร์กิวเมนต์ แต่ได้ ${args.length}`, line);
    cls.ctor.params.forEach((p,i)=>{ scope.vars[p.name] = jCoerce(p.type, args[i], line); });
    const sig = {returned:false, value:JNULL};
    jExecBlock(cls.ctor.body.body, scope, ctx, sig);
    ctx.calls--;
  }
  return instance;
}

function runJava(code){
  const out = [];
  const ctx = {out, steps:0, calls:0, line:0, classes:Object.create(null), global:null, mainClass:null};
  // hook 'new' into evaluator via jEval "new"
  try {
    const {toks, hadComment} = jTokenize(code);
    const classes = jParse(toks);
    if(!classes.length) jThrow("ต้องมีอย่างน้อยหนึ่งคลาส", 0);
    classes.forEach(c=>{ ctx.classes[c.name] = c; });
    // find main
    let mainClass = null, mainMethod = null;
    for(const c of classes){ if(c.methods["main"]){ mainClass = c; mainMethod = c.methods["main"]; break; } }
    if(!mainMethod) jThrow("ต้องมีเมธอด public static void main(String[] args)", 0);
    ctx.mainClass = mainClass;
    ctx.global = new JScope(null);
    const scope = new JScope(ctx.global);
    scope.vars["args"] = jArray([]);
    const sig = {returned:false, value:JNULL};
    jExecBlock(mainMethod.body.body, scope, ctx, sig);
    return {output: out.join(""), error:"", line:0, hasComment:hadComment};
  } catch(e){
    if(e && e.__j) return {output: out.join(""), error:e.message, line:e.line || ctx.line || 0};
    return {output: out.join(""), error:"รันโค้ดไม่สำเร็จ: " + (e && e.message ? e.message : String(e)), line:ctx.line || 0};
  }
}

// wire 'new' expression into jEval (needs ctx.classes)
const _jEvalOrig = jEval;
jEval = function(node,scope,ctx){
  if(node.k === "new") return jInstantiate(node.type, node.args.map(a=>jEval(a,scope,ctx)), ctx, node.line);
  return _jEvalOrig(node,scope,ctx);
};

/* =============================================================
   MINI C / C++ INTERPRETER (C and C++ Learn)
   Supports: #include (ignored), functions, int/float/double/char/bool,
   C strings (char[]), std::string, arrays (1D/2D), pointers (& * ->,
   pointer arithmetic on arrays), structs, C++ classes (fields, ctor,
   init list, methods, implicit this), references (&), vector,
   printf/puts/cout, if/else, for, range-for, while, do-while, casts, sizeof
   ============================================================= */
function CErr(message,line){ this.__c = true; this.message = message; this.line = line || 0; }
function cThrow(message,line){ throw new CErr(message,line); }

const C_BASE_TYPES = new Set(["int","float","double","char","void","long","short","unsigned","signed","bool","_Bool","string","auto","size_t","vector"]);
const C_SKIP_QUALIFIERS = ["const","static","inline","constexpr","volatile","register","extern"];

function cChar(code){ return {t:"char", v:code}; }
function cIsNum(x){ return !!x && (x.t === "int" || x.t === "double" || x.t === "char" || x.t === "bool"); }
function cIsIntLike(x){ return !!x && (x.t === "int" || x.t === "char" || x.t === "bool"); }
function cNumVal(x){ return x.t === "bool" ? (x.v ? 1 : 0) : Number(x.v); }
function cTruthy(v){
  if(!v) return false;
  if(v.t === "bool") return v.v;
  if(cIsNum(v)) return cNumVal(v) !== 0;
  if(v.t === "ptr") return !v.nul;
  if(v.t === "null") return false;
  return true;
}
function cTypeLabel(v){ return {int:"int",double:"double",char:"char",bool:"bool",str:"ข้อความ",array:"array",ptr:"pointer",instance:"struct/object",null:"NULL"}[v && v.t] || "ค่า"; }
function cppDouble(x){
  if(!isFinite(x)) return isNaN(x) ? "nan" : (x < 0 ? "-inf" : "inf");
  if(x === 0) return "0";
  const abs = Math.abs(x);
  if(abs >= 1e6 || abs < 1e-4){
    const [m,e] = x.toExponential(5).split("e");
    const mant = String(Number(m));
    const exp = Number(e);
    return mant + "e" + (exp < 0 ? "-" : "+") + String(Math.abs(exp)).padStart(2,"0");
  }
  return String(Number(x.toPrecision(6)));
}
function cppToString(v){
  if(!v) return "";
  switch(v.t){
    case "int": return String(v.v);
    case "double": return cppDouble(v.v);
    case "char": return String.fromCharCode(v.v);
    case "bool": return v.v ? "1" : "0";
    case "str": return v.v;
    case "null": return "0";
    case "ptr": return v.nul ? "0" : "0x7ffd5e8c";
    case "array": return "0x7ffd5e8c";
    default: return "";
  }
}
function cClone(v){
  if(!v) return v;
  if(v.t === "instance"){
    const copy = {t:"instance", cls:v.cls, fields:Object.create(null), ftypes:v.ftypes};
    for(const k in v.fields) copy.fields[k] = cClone(v.fields[k]);
    return copy;
  }
  if(v.t === "array" && v.embedded) return {t:"array", v:v.v.map(cClone), elem:v.elem, embedded:true};
  return v;
}

/* ---- tokenizer ---- */
function cTokenize(code){
  const s = String(code).replace(/\r\n?/g,"\n");
  const toks = [];
  let i = 0, line = 1, hadComment = false, lineStart = true;
  const twos = ["==","!=","<=",">=","&&","||","++","--","+=","-=","*=","/=","%=","<<",">>","::","->"];
  const singles = "+-*/%<>=!(){}[];,.&:?~^|";
  while(i < s.length){
    const c = s[i];
    if(c === "\n"){ line++; i++; lineStart = true; continue; }
    if(c === " " || c === "\t"){ i++; continue; }
    if(c === "#" && lineStart){ while(i < s.length && s[i] !== "\n") i++; continue; }
    lineStart = false;
    if(c === "/" && s[i+1] === "/"){ hadComment = true; while(i < s.length && s[i] !== "\n") i++; continue; }
    if(c === "/" && s[i+1] === "*"){ hadComment = true; i += 2; while(i < s.length && !(s[i] === "*" && s[i+1] === "/")){ if(s[i] === "\n") line++; i++; } i += 2; continue; }
    if(c === '"' || c === "'"){
      const quote = c; let j = i+1, raw = quote, closed = false;
      while(j < s.length && s[j] !== "\n"){ raw += s[j]; if(s[j] === "\\"){ raw += (s[j+1] || ""); j += 2; continue; } if(s[j] === quote){ j++; closed = true; break; } j++; }
      if(!closed) cThrow(quote === '"' ? "ข้อความ (string) ขาดเครื่องหมาย \" ปิดท้าย" : "ตัวอักษร (char) ขาดเครื่องหมาย ' ปิดท้าย", line);
      toks.push({type:quote === '"' ? "str" : "char", value:raw, line}); i = j; continue;
    }
    if(/[0-9]/.test(c) || (c === "." && /[0-9]/.test(s[i+1] || ""))){
      let j = i, num = "";
      while(j < s.length && /[0-9.]/.test(s[j])){ num += s[j]; j++; }
      if((s[j] === "e" || s[j] === "E") && /[0-9+-]/.test(s[j+1] || "")){ num += s[j++]; if(s[j] === "+" || s[j] === "-") num += s[j++]; while(j < s.length && /[0-9]/.test(s[j])) num += s[j++]; }
      while(j < s.length && /[fFlLuU]/.test(s[j])) j++;
      toks.push({type:"num", value:num, line}); i = j; continue;
    }
    if(/[A-Za-z_]/.test(c)){ let j = i, name = ""; while(j < s.length && /[A-Za-z0-9_]/.test(s[j])){ name += s[j]; j++; } toks.push({type:"word", value:name, line}); i = j; continue; }
    const two = s.substr(i,2);
    if(twos.includes(two)){ toks.push({type:"op", value:two, line}); i += 2; continue; }
    if(singles.includes(c)){ toks.push({type:"op", value:c, line}); i++; continue; }
    cThrow(`พบอักขระที่ไม่รองรับ “${c}”`, line);
  }
  toks.push({type:"eof", value:"<eof>", line});
  return {toks, hadComment};
}

/* ---- parser ---- */
function cParse(toks,lang){
  let pos = 0;
  const peek = (k=0)=>toks[Math.min(pos+k,toks.length-1)];
  const next = ()=>toks[pos++];
  const at = v=>{ const t = peek(); return t.value === v && (t.type === "op" || t.type === "word"); };
  const eat = v=>{
    if(!at(v)){
      if(v === ";" && pos > 0) cThrow(`ลืมเครื่องหมาย ; ท้ายคำสั่ง (ถัดไปพบ “${peek().value}”)`, toks[pos-1].line);
      cThrow(`คาดว่าจะพบ “${v}” แต่พบ “${peek().value}”`, peek().line);
    }
    return next();
  };
  const userTypes = new Set();
  toks.forEach((t,i)=>{ if((t.value === "struct" || t.value === "class") && toks[i+1] && toks[i+1].type === "word") userTypes.add(toks[i+1].value); });
  const isTypeWord = v=>C_BASE_TYPES.has(v) || userTypes.has(v);

  function isTypeStart(k=0){
    let j = k;
    while(C_SKIP_QUALIFIERS.includes(peek(j).value)) j++;
    const t = peek(j);
    if(t.type !== "word") return false;
    if(t.value === "struct") return true;
    if(t.value === "std" && peek(j+1).value === "::") return isTypeWord(peek(j+2).value);
    return isTypeWord(t.value);
  }
  function parseType(){
    while(C_SKIP_QUALIFIERS.includes(peek().value)) next();
    let name;
    if(at("struct")){ next(); name = next().value; return name; }
    if(at("std") && peek(1).value === "::"){ next(); next(); }
    const tok = next();
    name = tok.value;
    if(name === "unsigned" || name === "signed"){
      if(["int","long","short"].includes(peek().value)) next();
      else if(at("char")){ next(); return "char"; }
      name = "int";
    }
    if(name === "long"){ if(at("long")) next(); if(at("int")) next(); if(at("double")){ next(); name = "double"; } else name = "int"; }
    if(name === "short"){ if(at("int")) next(); name = "int"; }
    if(name === "size_t") name = "int";
    if(name === "_Bool") name = "bool";
    if(lang === "c" && name === "string") cThrow("ภาษา C ไม่มีชนิด string ให้ใช้ char ชื่อ[] แทน", tok.line);
    if(lang === "c" && name === "vector") cThrow("ภาษา C ไม่มี vector ให้ใช้ array แทน", tok.line);
    if(name === "vector"){
      eat("<");
      const inner = parseType();
      if(at(">>")) toks[pos] = {...toks[pos], value:">"};
      else eat(">");
      name = "vector<" + inner + ">";
    }
    while(at("const")) next();
    return name;
  }
  function parseDeclarator(){
    let ptr = 0, ref = false;
    while(at("*")){ next(); ptr++; while(at("const")) next(); }
    if(at("&")){ if(lang === "c") cThrow("ภาษา C ไม่มี reference (&) ให้ใช้ pointer (*) แทน", peek().line); next(); ref = true; }
    const nameTok = next();
    if(nameTok.type !== "word") cThrow(`คาดว่าจะพบชื่อตัวแปร แต่พบ “${nameTok.value}”`, nameTok.line);
    const dims = [];
    while(at("[")){ next(); dims.push(at("]") ? null : parseExpr()); eat("]"); }
    return {name:nameTok.value, ptr, ref, dims, line:nameTok.line};
  }
  function parseParams(){
    eat("(");
    const params = [];
    if(at("void") && peek(1).value === ")") next();
    if(!at(")")){
      do{
        const type = parseType();
        const d = (at(",") || at(")")) ? {name:"_", ptr:0, ref:false, dims:[]} : parseDeclarator();
        params.push({type, name:d.name, ptr:d.ptr, ref:d.ref, isArray:d.dims.length > 0});
      }while(at(",") && next());
    }
    eat(")");
    return params;
  }
  function finishDecl(type,d,line){
    const decls = [];
    for(;;){
      let init = null, ctorArgs = null;
      if(at("=")){ next(); init = parseInitializer(); }
      else if(at("(")) ctorArgs = parseArgs();
      else if(at("{")) init = parseInitList();
      decls.push({...d, init, ctorArgs});
      if(at(",")){ next(); d = parseDeclarator(); continue; }
      break;
    }
    return {k:"decl", type, decls, line};
  }
  function parseRecord(){
    const kindTok = next();
    const kind = kindTok.value;
    if(kind === "class" && lang === "c") cThrow("ภาษา C ไม่มี class ให้ใช้ struct แทน", kindTok.line);
    const name = next().value;
    if(at(":")) cThrow("บทเรียนนี้ยังไม่รองรับการสืบทอดคลาส (inheritance)", peek().line);
    eat("{");
    const rec = {kind, name, fields:[], methods:{}, ctors:[]};
    while(!at("}")){
      if(["public","private","protected"].includes(peek().value) && peek(1).value === ":"){ next(); next(); continue; }
      if(at(";")){ next(); continue; }
      if(at("~")){ next(); next(); parseParams(); parseBlock(); continue; }
      if(peek().value === name && peek(1).value === "("){
        const line = next().line;
        const params = parseParams();
        const inits = [];
        if(at(":")){ next(); do{ const field = next().value; eat("("); const e = at(")") ? null : parseExpr(); eat(")"); inits.push({field, e}); }while(at(",") && next()); }
        rec.ctors.push({params, inits, body:parseBlock(), line});
        continue;
      }
      const line = peek().line;
      const type = parseType();
      let d = parseDeclarator();
      if(at("(")){
        const params = parseParams();
        while(at("const")) next();
        if(at(";")){ next(); continue; }
        rec.methods[d.name] = {name:d.name, retType:type, retPtr:d.ptr, params, body:parseBlock(), line};
        continue;
      }
      for(;;){
        let init = null;
        if(at("=")){ next(); init = parseInitializer(); }
        else if(at("{")) init = parseInitList();
        rec.fields.push({type, ptr:d.ptr, dims:d.dims, name:d.name, init, line});
        if(at(",")){ next(); d = parseDeclarator(); continue; }
        break;
      }
      eat(";");
    }
    eat("}");
    return rec;
  }
  function parseProgram(){
    const prog = {functions:Object.create(null), records:Object.create(null), globals:[]};
    while(peek().type !== "eof"){
      if(at("using")){ while(!at(";") && peek().type !== "eof") next(); eat(";"); continue; }
      if(at(";")){ next(); continue; }
      if(at("typedef")) cThrow("บทเรียนนี้ยังไม่รองรับ typedef ให้ใช้ struct ชื่อ แทน", peek().line);
      if(at("template")) cThrow("บทเรียนนี้ยังไม่รองรับ template", peek().line);
      if((at("struct") || at("class")) && peek(1).type === "word" && (peek(2).value === "{" || peek(2).value === ":")){
        const rec = parseRecord();
        prog.records[rec.name] = rec;
        eat(";");
        continue;
      }
      const line = peek().line;

/* ---- runtime ---- */
function CScope(parent,thisObj){ this.vars = Object.create(null); this.types = Object.create(null); this.parent = parent; this.thisObj = thisObj || (parent ? parent.thisObj : null); }
CScope.prototype.find = function(name){ let s = this; while(s){ if(name in s.vars) return s; s = s.parent; } return null; };

function cDecodeChar(raw,line){
  if(raw === "'\\0'") return 0;
  const text = jDecodeString(raw);
  if(text.length !== 1) cThrow("ตัวอักษร (char) ต้องมีเพียง 1 ตัว ถ้าเป็นข้อความให้ใช้เครื่องหมาย \" \"", line);

}
function cRecordOf(ctx,type){ return ctx.prog.records[type] || null; }
function cDefault(type,ctx,line){
  if(type === "int") return jInt(0);
  if(type === "double" || type === "float") return jDouble(0);
  if(type === "char") return cChar(0);
  if(type === "bool") return jBool(false);
  if(type === "string") return jStr("");
  if(type && type.startsWith("vector<")) return {t:"array", v:[], elem:type.slice(7,-1), vector:true};
  if(cRecordOf(ctx,type)) return cInstantiate(type,[],ctx,line);

function cCoerce(type,v,line,ctx,ptr){

    if(v.t === "null" || (v.t === "int" && v.v === 0)) return {t:"ptr", nul:true};
    if(v.t === "str" && type === "char") return v;
    if(v.t === "ptr") return v;
    cThrow(`กำหนดค่าชนิด ${cTypeLabel(v)} ให้ pointer ไม่ได้ (ใช้ & เพื่อเอาตำแหน่งของตัวแปร)`, line);
  }
  switch(type){
    case "int": if(cIsNum(v)) return jInt(Math.trunc(cNumVal(v))); break;
    case "float": case "double": if(cIsNum(v)) return jDouble(cNumVal(v)); break;
    case "char": if(cIsNum(v)) return cChar(Math.trunc(cNumVal(v)) & 255); break;
    case "bool": return jBool(cTruthy(v));
    case "string": if(v.t === "str") return v; if(v.t === "char") return jStr(String.fromCharCode(v.v)); break;
    case "cstr": if(v.t === "str") return v; break;

  if(type === "cstr") cThrow("กำหนดข้อความให้ array ของ char ด้วย = ไม่ได้ ให้ใช้ strcpy()", line);

}
function cSizeOfType(type,ptr,ctx){
  if(ptr) return 8;
  if(type === "char" || type === "bool") return 1;
  if(type === "int" || type === "float") return 4;
  if(type === "double") return 8;
  const rec = cRecordOf(ctx,type);

function cSizeOfValue(v,ctx){

  if(v.t === "str") return v.v.length + 1;
  if(v.t === "char" || v.t === "bool") return 1;
  if(v.t === "int") return 4;
  if(v.t === "double") return 8;

function cMakeArray(type,dims,initNode,scope,ctx,line){

    const val = cEval(initNode,scope,ctx);
    if(val.t === "str") return val;
    if(val.t === "array") return jStr(val.v.map(ch=>String.fromCharCode(cNumVal(ch))).join("").replace(/\0.*$/,""));

function cAggregate(type,initNode,scope,ctx,line){

  initNode.elems.forEach((e,i)=>{
    const f = rec.fields[i];
    if(f.dims.length && f.type === "char"){ const v = cEval(e,scope,ctx); if(v.t !== "str") cThrow(`ฟิลด์ ${f.name} ต้องเป็นข้อความ`, line); inst.fields[f.name] = v; return; }

    if(cRecordOf(ctx,f.type) && e.k === "initlist"){ inst.fields[f.name] = cAggregate(f.type,e,scope,ctx,line); return; }

function cInstantiate(name,args,ctx,line,skipCtor){

  if(++ctx.depth > 3000) cThrow("สร้างออบเจ็กต์ซ้อนลึกเกินไป", line);
  const inst = {t:"instance", cls:rec, fields:Object.create(null), ftypes:Object.create(null)};
  const initScope = new CScope(ctx.global, inst);
  rec.fields.forEach(f=>{
    inst.ftypes[f.name] = {type:f.type, ptr:f.ptr, fixed:f.dims.length > 0};
    if(f.dims.length){ const arr = cMakeArray(f.type,f.dims,f.init,initScope,ctx,line); if(arr.t === "array") arr.embedded = true; inst.fields[f.name] = arr; }

function cRef(node,scope,ctx){
  const line = node.line;
  if(node.k === "name"){
    const s = scope.find(node.id);
    if(s){
      const cur = s.vars[node.id];
      if(cur && cur.t === "refbox") return cur.ref;
      const info = s.types[node.id];
      return {
        get:()=>s.vars[node.id],
        set:v=>{
          if(!info){ cThrow(`กำหนดค่าให้ array “${node.id}” ทั้งก้อนไม่ได้ ให้กำหนดทีละช่อง`, line); }

    }
    const self = scope.thisObj;
    if(self && node.id in self.fields){
      const ft = self.ftypes[node.id];
      return { get:()=>self.fields[node.id], set:v=>{ if(ft.fixed && ft.type !== "char") cThrow("กำหนดค่าให้ array ทั้งก้อนไม่ได้", line); self.fields[node.id] = cCoerce(ft.fixed ? "cstr" : ft.type,v,line,ctx,ft.ptr); } };
    }
    cThrow(`ยังไม่ได้ประกาศตัวแปร “${node.id}”`, line);
  }
  if(node.k === "index"){
    const obj = cEval(node.obj,scope,ctx);
    const i = cNumVal(cEval(node.idx,scope,ctx));
    if(obj.t === "array"){
      if(i < 0 || i >= obj.v.length) cThrow(`ดัชนี ${i} เกินขอบเขตของ array (ขนาด ${obj.v.length})`, line);
      return { get:()=>obj.v[i], set:v=>{ obj.v[i] = obj.elem ? cCoerce(obj.elem,v,line,ctx) : v; } };
    }
    if(obj.t === "ptr" && obj.arr){
      const j = obj.idx + i;
      if(j < 0 || j >= obj.arr.length) cThrow("pointer ชี้เกินขอบเขตของ array", line);
      return { get:()=>obj.arr[j], set:v=>{ obj.arr[j] = obj.elem ? cCoerce(obj.elem,v,line,ctx) : v; } };
    }
    if(obj.t === "str"){
      if(i < 0 || i > obj.v.length) cThrow(`ดัชนี ${i} เกินความยาวข้อความ`, line);
      const container = cRef(node.obj,scope,ctx);
      return { get:()=>i === obj.v.length ? cChar(0) : cChar(obj.v.charCodeAt(i)), set:v=>{ const cur = container.get().v; const ch = String.fromCharCode(cNumVal(v)); container.set(jStr(cur.slice(0,i) + ch + cur.slice(i+1))); } };

    const obj = cEval(node.obj,scope,ctx);
    if(!obj || obj.t !== "instance") cThrow(`“.${node.name}” ใช้ได้กับ struct/object เท่านั้น`, line);
    if(!(node.name in obj.fields)) cThrow(`${obj.cls.name} ไม่มีฟิลด์ชื่อ “${node.name}”`, line);
    const ft = obj.ftypes[node.name];
    return { get:()=>obj.fields[node.name], set:v=>{ obj.fields[node.name] = ft.fixed ? cCoerce(ft.type === "char" ? "cstr" : "__fixed",v,line,ctx) : cCoerce(ft.type,v,line,ctx,ft.ptr); } };
