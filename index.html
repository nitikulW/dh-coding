  if(node.k === "deref"){
    const p = cEval(node.e,scope,ctx);
    if(p.t === "array") return { get:()=>p.v[0], set:v=>{ p.v[0] = p.elem ? cCoerce(p.elem,v,line,ctx) : v; } };
    if(p.t !== "ptr") cThrow("ใช้ * ได้กับ pointer เท่านั้น", line);
    if(p.nul) cThrow("เข้าถึง pointer ที่เป็น NULL ไม่ได้ (ยังไม่ได้ชี้ไปที่ตัวแปรใด)", line);
    if(p.ref) return p.ref;
    if(p.idx < 0 || p.idx >= p.arr.length) cThrow("pointer ชี้เกินขอบเขตของ array", line);
    return { get:()=>p.arr[p.idx], set:v=>{ p.arr[p.idx] = p.elem ? cCoerce(p.elem,v,line,ctx) : v; } };
  }
  cThrow("กำหนดค่าให้สิ่งนี้ไม่ได้ (ต้องเป็นตัวแปร, ช่องของ array หรือฟิลด์)", line);
}

function cBinOp(op,a,b,line,ctx){
  if((op === "+" || op === "-") && a.t === "ptr" && a.arr && cIsIntLike(b)) return {t:"ptr", arr:a.arr, idx:a.idx + (op === "+" ? 1 : -1) * cNumVal(b), elem:a.elem};
  if(op === "+" && a.t === "array" && cIsIntLike(b)) return {t:"ptr", arr:a.v, idx:cNumVal(b), elem:a.elem};
  if(op === "-" && a.t === "ptr" && b.t === "ptr" && a.arr && a.arr === b.arr) return jInt(a.idx - b.idx);
  if(op === "+" && (a.t === "str" || b.t === "str")){
    const other = a.t === "str" ? b : a;
    if(other.t === "str" || other.t === "char") return jStr((a.t === "char" ? String.fromCharCode(a.v) : a.v) + (b.t === "char" ? String.fromCharCode(b.v) : b.v));
    if(ctx.lang === "c") cThrow("ภาษา C เชื่อมข้อความด้วย + ไม่ได้ ให้แสดงผลด้วย printf(\"%s %d\", ...) แทน", line);
    cThrow("เชื่อม string กับตัวเลขด้วย + ไม่ได้ ให้ใช้ to_string(ตัวเลข) ก่อน หรือแยกด้วย << ใน cout", line);
  }
  if(!cIsNum(a) || !cIsNum(b)) cThrow(`ใช้ “${op}” กับค่าชนิด ${cTypeLabel(a)} และ ${cTypeLabel(b)} ไม่ได้`, line);
  const bothInt = cIsIntLike(a) && cIsIntLike(b);
  const x = cNumVal(a), y = cNumVal(b);
  switch(op){
    case "+": return bothInt ? jInt(x + y) : jDouble(x + y);
    case "-": return bothInt ? jInt(x - y) : jDouble(x - y);
    case "*": return bothInt ? jInt(x * y) : jDouble(x * y);
    case "/":
      if(bothInt){ if(y === 0) cThrow("หารด้วยศูนย์ไม่ได้ (division by zero)", line); return jInt(Math.trunc(x / y)); }
      return jDouble(x / y);
    case "%":
      if(!bothInt) cThrow("ใช้ % ได้กับจำนวนเต็มเท่านั้น", line);
      if(y === 0) cThrow("หารเอาเศษด้วยศูนย์ไม่ได้", line);
      return jInt(x % y);
    case "&": case "|": case "^": case "<<": case ">>":
      if(!bothInt) cThrow(`ใช้ “${op}” ได้กับจำนวนเต็มเท่านั้น`, line);
      return jInt(op === "&" ? x & y : op === "|" ? x | y : op === "^" ? x ^ y : op === "<<" ? x << y : x >> y);
  }
  cThrow(`ตัวดำเนินการ “${op}” ไม่รองรับ`, line);
}
function cCompare(op,a,b,line){
  let cmp;
  if(cIsNum(a) && cIsNum(b)) cmp = cNumVal(a) - cNumVal(b);
  else if(a.t === "str" && b.t === "str") cmp = a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
  else if(a.t === "ptr" || b.t === "ptr" || a.t === "null" || b.t === "null"){
    if(op !== "==" && op !== "!=") cThrow("เปรียบเทียบ pointer ได้แค่ == หรือ !=", line);
    const same = (a.nul || a.t === "null" || (a.t === "int" && a.v === 0)) && (b.nul || b.t === "null" || (b.t === "int" && b.v === 0))
      || (a.ref && a.ref === b.ref) || (a.arr && a.arr === b.arr && a.idx === b.idx);
    return jBool(op === "==" ? same : !same);
  }
  else cThrow(`เปรียบเทียบค่าชนิด ${cTypeLabel(a)} กับ ${cTypeLabel(b)} ไม่ได้`, line);
  switch(op){
    case "==": return jBool(cmp === 0);
    case "!=": return jBool(cmp !== 0);
    case "<": return jBool(cmp < 0);
    case "<=": return jBool(cmp <= 0);
    case ">": return jBool(cmp > 0);
    case ">=": return jBool(cmp >= 0);
  }
}

function cFormat(fmt,args,line){
  let out = "", ai = 0, i = 0;
  while(i < fmt.length){
    const ch = fmt[i];
    if(ch !== "%"){ out += ch; i++; continue; }
    const m = fmt.slice(i).match(/^%([-+0 #]*)(\d+)?(?:\.(\d+))?(hh|h|ll|l|L|z)?([diufFeEgGcsxXp%])/);
    if(!m){ cThrow("รูปแบบใน printf ไม่ถูกต้อง (เช่น %d, %f, %c, %s)", line); }
    i += m[0].length;
    const flags = m[1] || "", width = m[2] ? Number(m[2]) : 0, prec = m[3] != null ? Number(m[3]) : null, conv = m[5];
    if(conv === "%"){ out += "%"; continue; }
    if(ai >= args.length) cThrow(`printf มีตัวกำหนดรูปแบบ (%${conv}) มากกว่าค่าที่ส่งมา`, line);
    const a = args[ai++];
    let s;
    switch(conv){
      case "d": case "i": case "u":
        if(!cIsNum(a)) cThrow(`%${conv} ต้องใช้กับจำนวนเต็ม แต่ได้ ${cTypeLabel(a)}`, line);
        if(a.t === "double") cThrow(`%${conv} ใช้กับจำนวนเต็ม แต่ค่านี้เป็นทศนิยม ให้ใช้ %f แทน`, line);
        s = String(Math.trunc(cNumVal(a))); break;
      case "f": case "F":
        if(!cIsNum(a)) cThrow(`%f ต้องใช้กับตัวเลข แต่ได้ ${cTypeLabel(a)}`, line);
        if(a.t !== "double") cThrow("%f ใช้กับทศนิยม (double/float) แต่ค่านี้เป็นจำนวนเต็ม ให้ใช้ %d หรือแปลงด้วย (double)", line);
        s = cNumVal(a).toFixed(prec == null ? 6 : prec); break;
      case "e": case "E": s = cNumVal(a).toExponential(prec == null ? 6 : prec).replace(/e([+-])(\d)$/,"e$10$2"); if(conv === "E") s = s.toUpperCase(); break;
      case "g": case "G": s = String(Number(cNumVal(a).toPrecision(prec == null || prec === 0 ? 6 : prec))); break;
      case "c": if(!cIsNum(a)) cThrow(`%c ต้องใช้กับตัวอักษร (char) แต่ได้ ${cTypeLabel(a)}`, line); s = String.fromCharCode(cNumVal(a)); break;
      case "s": if(a.t !== "str") cThrow(`%s ต้องใช้กับข้อความ แต่ได้ ${cTypeLabel(a)}`, line); s = prec == null ? a.v : a.v.slice(0,prec); break;
      case "x": case "X": s = (cNumVal(a) >>> 0).toString(16); if(conv === "X") s = s.toUpperCase(); break;
      case "p": s = "0x7ffd5e8c"; break;
    }
    if(flags.includes("+") && /^[0-9]/.test(s) && "difFeEgG".includes(conv)) s = "+" + s;
    if(width > s.length){
      if(flags.includes("-")) s = s.padEnd(width);
      else if(flags.includes("0") && "diufFeEgGxX".includes(conv)){ const sign = /^[+-]/.test(s) ? s[0] : ""; s = sign + s.slice(sign.length).padStart(width - sign.length,"0"); }
      else s = s.padStart(width);
    }
    out += s;
  }
  if(ai < args.length) cThrow(`printf ได้รับค่ามา ${args.length} ค่า แต่มีตัวกำหนดรูปแบบแค่ ${ai} ตัว`, line);
  return out;
}

const C_BUILTINS = {
  printf:(args,ctx,line)=>{ if(!args.length || args[0].t !== "str") cThrow("printf ต้องขึ้นต้นด้วยข้อความในเครื่องหมาย \" \"", line); const text = cFormat(args[0].v,args.slice(1),line); ctx.out.push(text); return jInt(text.length); },
  puts:(args,ctx,line)=>{ if(!args[0] || args[0].t !== "str") cThrow("puts ต้องรับข้อความ", line); ctx.out.push(args[0].v + "\n"); return jInt(0); },
  putchar:(args,ctx)=>{ ctx.out.push(String.fromCharCode(cNumVal(args[0]))); return args[0]; },
  strlen:(args,ctx,line)=>{ if(!args[0] || args[0].t !== "str") cThrow("strlen ต้องรับข้อความ", line); return jInt(args[0].v.length); },
  strcmp:(args,ctx,line)=>{ if(args.length !== 2 || args[0].t !== "str" || args[1].t !== "str") cThrow("strcmp ต้องรับข้อความ 2 ค่า", line); return jInt(args[0].v < args[1].v ? -1 : args[0].v > args[1].v ? 1 : 0); },
  strcpy:(args,ctx,line,nodes,scope)=>{ const ref = cRef(nodes[0],scope,ctx); if(args[1].t !== "str") cThrow("strcpy ต้องคัดลอกจากข้อความ", line); ref.set(jStr(args[1].v)); return ref.get(); },
  strcat:(args,ctx,line,nodes,scope)=>{ const ref = cRef(nodes[0],scope,ctx); if(args[1].t !== "str") cThrow("strcat ต้องต่อด้วยข้อความ", line); ref.set(jStr(ref.get().v + args[1].v)); return ref.get(); },
  sqrt:(args)=>jDouble(Math.sqrt(cNumVal(args[0]))),
  pow:(args)=>jDouble(Math.pow(cNumVal(args[0]),cNumVal(args[1]))),
  fabs:(args)=>jDouble(Math.abs(cNumVal(args[0]))),
  abs:(args)=>args[0].t === "double" ? jDouble(Math.abs(args[0].v)) : jInt(Math.abs(cNumVal(args[0]))),
  max:(args)=>{ const r = cNumVal(args[0]) >= cNumVal(args[1]) ? args[0] : args[1]; return r; },
  min:(args)=>{ const r = cNumVal(args[0]) <= cNumVal(args[1]) ? args[0] : args[1]; return r; },
  toupper:(args)=>jInt(String.fromCharCode(cNumVal(args[0])).toUpperCase().charCodeAt(0)),
  tolower:(args)=>jInt(String.fromCharCode(cNumVal(args[0])).toLowerCase().charCodeAt(0)),
  to_string:(args,ctx,line)=>{ const a = args[0]; if(!cIsNum(a)) cThrow("to_string ต้องรับตัวเลข", line); return jStr(a.t === "double" ? a.v.toFixed(6) : String(cNumVal(a))); },
  swap:(args,ctx,line,nodes,scope)=>{ const r1 = cRef(nodes[0],scope,ctx), r2 = cRef(nodes[1],scope,ctx); const t = r1.get(); r1.set(r2.get()); r2.set(t); return JNULL; }
};

function cCallFunction(fn,argNodes,scope,ctx,line,thisObj){
  if(++ctx.depth > 3000) cThrow("เรียกฟังก์ชันซ้อนลึกเกินไป (recursion ไม่มีจุดหยุด?)", line);
  if(argNodes.length !== fn.params.length) cThrow(`ฟังก์ชัน ${fn.name}() ต้องการอาร์กิวเมนต์ ${fn.params.length} ตัว แต่ได้ ${argNodes.length} ตัว`, line);
  const fscope = new CScope(ctx.global, thisObj);
  fn.params.forEach((p,i)=>{
    if(p.ref){ fscope.vars[p.name] = {t:"refbox", ref:cRef(argNodes[i],scope,ctx)}; fscope.types[p.name] = {type:p.type, ptr:p.ptr}; return; }
    let v = cEval(argNodes[i],scope,ctx);
    if(p.isArray){ if(v.t !== "array" && v.t !== "str" && v.t !== "ptr") cThrow(`พารามิเตอร์ ${p.name} ต้องรับ array`, line); fscope.vars[p.name] = v; fscope.types[p.name] = v.t === "str" ? {type:"cstr"} : null; return; }
    v = cCoerce(p.type,v,line,ctx,p.ptr);
    fscope.vars[p.name] = v;
    fscope.types[p.name] = {type:p.type, ptr:p.ptr};
  });
  const sig = {};
  cExecBlock(fn.body.body, fscope, ctx, sig);
  ctx.depth--;
  if(fn.retType === "void") return JNULL;
  if(!sig.returned) return cDefault(fn.retType,ctx,line);
  return cCoerce(fn.retType, sig.value, line, ctx, fn.retPtr);
}

function cEvalCall(node,scope,ctx){
  const callee = node.callee, line = node.line;
  if(callee.k === "name"){
    const id = callee.id;
    if(!scope.find(id)){
      if(ctx.prog.functions[id]) return cCallFunction(ctx.prog.functions[id], node.args, scope, ctx, line, null);
      if(scope.thisObj && scope.thisObj.cls.methods[id]) return cCallFunction(scope.thisObj.cls.methods[id], node.args, scope, ctx, line, scope.thisObj);
      if(cRecordOf(ctx,id)) return cInstantiate(id, node.args.map(a=>cEval(a,scope,ctx)), ctx, line);
      if(C_BUILTINS[id]){
        if(ctx.lang === "c" && ["to_string","swap","max","min"].includes(id)) cThrow(`ภาษา C ไม่มีฟังก์ชัน ${id}()`, line);
        return C_BUILTINS[id](node.args.map(a=>cEval(a,scope,ctx)), ctx, line, node.args, scope);
      }
      if(id === "string") return jStr(node.args.length ? cppToString(cEval(node.args[0],scope,ctx)) : "");
      if(id === "main") cThrow("ไม่ควรเรียก main() เอง", line);
      cThrow(`ไม่พบฟังก์ชัน “${id}()” (ต้องประกาศฟังก์ชันไว้ก่อนเรียกใช้)`, line);
    }
    cThrow(`“${id}” เป็นตัวแปร เรียกแบบฟังก์ชันไม่ได้`, line);
  }
  if(callee.k === "member"){
    const name = callee.name;
    const obj = cEval(callee.obj,scope,ctx);
    const args = ()=>node.args.map(a=>cEval(a,scope,ctx));
    if(obj.t === "array" && obj.vector){
      const a = args();
      switch(name){
        case "push_back": case "emplace_back": obj.v.push(cCoerce(obj.elem,a[0],line,ctx)); return JNULL;
        case "pop_back": if(!obj.v.length) cThrow("pop_back() กับ vector ว่างไม่ได้", line); obj.v.pop(); return JNULL;
        case "size": case "length": return jInt(obj.v.length);
        case "empty": return jBool(obj.v.length === 0);
        case "clear": obj.v.length = 0; return JNULL;
        case "front": if(!obj.v.length) cThrow("vector ว่าง", line); return obj.v[0];
        case "back": if(!obj.v.length) cThrow("vector ว่าง", line); return obj.v[obj.v.length-1];
        case "at": { const i = cNumVal(a[0]); if(i < 0 || i >= obj.v.length) cThrow(`at(${i}) เกินขอบเขตของ vector (ขนาด ${obj.v.length})`, line); return obj.v[i]; }
      }
      cThrow(`vector ไม่มีเมธอด “${name}()”`, line);
    }
    if(obj.t === "str"){
      const a = args();
      switch(name){
        case "length": case "size": return jInt(obj.v.length);
        case "empty": return jBool(obj.v.length === 0);
        case "substr": { const p = cNumVal(a[0]); const n = a.length > 1 ? cNumVal(a[1]) : undefined; return jStr(obj.v.substr(p,n)); }
        case "at": { const i = cNumVal(a[0]); if(i < 0 || i >= obj.v.length) cThrow(`at(${i}) เกินความยาวข้อความ`, line); return cChar(obj.v.charCodeAt(i)); }
        case "find": { const s = a[0].t === "char" ? String.fromCharCode(a[0].v) : a[0].v; return jInt(obj.v.indexOf(s)); }
        case "push_back": case "append": case "c_str": {
          if(name === "c_str") return obj;
          const ref = cRef(callee.obj,scope,ctx);
          const add = a[0].t === "char" ? String.fromCharCode(a[0].v) : a[0].v;
          ref.set(jStr(obj.v + add));
          return JNULL;
        }
      }
      cThrow(`string ไม่มีเมธอด “${name}()”`, line);
    }
    if(obj.t === "instance"){
      const method = obj.cls.methods[name];
      if(!method) cThrow(`${obj.cls.name} ไม่มีเมธอด “${name}()”`, line);
      return cCallFunction(method, node.args, scope, ctx, line, obj);
    }
    if(obj.t === "array") cThrow(`array ธรรมดาไม่มีเมธอด “${name}()”`, line);
    cThrow(`เรียกเมธอด “${name}()” จากค่าชนิด ${cTypeLabel(obj)} ไม่ได้`, line);
  }
  cThrow("เรียกใช้แบบฟังก์ชันไม่ได้", line);
}

function cEval(node,scope,ctx){
  const line = node.line;
  switch(node.k){
    case "num": return /[.eE]/.test(node.value) && !/^0x/i.test(node.value) ? jDouble(Number(node.value)) : jInt(Number(node.value));
    case "str": return jStr(node.raws.map(jDecodeString).join(""));
    case "char": return cChar(cDecodeChar(node.raw,line));
    case "bool": return jBool(node.v);
    case "nullptr": return {t:"ptr", nul:true};
    case "initlist": return {t:"array", v:node.elems.map(e=>cEval(e,scope,ctx)), elem:null};
    case "vectorctor": { const n = node.args.length ? cNumVal(cEval(node.args[0],scope,ctx)) : 0; const fill = node.args.length > 1 ? cEval(node.args[1],scope,ctx) : jInt(0); return {t:"array", v:Array.from({length:n},()=>fill), elem:null, vector:true}; }
    case "name": {
      const s = scope.find(node.id);
      if(s){ const v = s.vars[node.id]; return v && v.t === "refbox" ? v.ref.get() : v; }
      if(node.id === "this"){ if(!scope.thisObj) cThrow("ใช้ this ได้เฉพาะในเมธอดของคลาส", line); const self = scope.thisObj; return {t:"ptr", ref:{get:()=>self, set:()=>cThrow("กำหนดค่าให้ this ไม่ได้", line)}}; }
      if(scope.thisObj && node.id in scope.thisObj.fields) return scope.thisObj.fields[node.id];
      if(node.id === "cout"){ if(ctx.lang === "c") cThrow("ภาษา C ไม่มี cout ให้ใช้ printf() แทน", line); return {t:"ostream"}; }
      if(node.id === "endl") return {t:"endl"};
      if(node.id === "cin" || node.id === "scanf") cThrow("บทเรียนนี้ยังไม่รองรับการรับค่าจากคีย์บอร์ด ให้กำหนดค่าในโค้ดแทน", line);
      if(ctx.prog.functions[node.id] || C_BUILTINS[node.id]) cThrow(`ต้องเรียกฟังก์ชันด้วยวงเล็บ เช่น ${node.id}()`, line);
      cThrow(`ยังไม่ได้ประกาศตัวแปร “${node.id}”`, line);
    }
    case "neg": { const v = cEval(node.e,scope,ctx); if(!cIsNum(v)) cThrow("ใช้เครื่องหมายลบกับค่าที่ไม่ใช่ตัวเลขไม่ได้", line); return v.t === "double" ? jDouble(-v.v) : jInt(-cNumVal(v)); }
    case "not": return jBool(!cTruthy(cEval(node.e,scope,ctx)));
    case "bitnot": return jInt(~cNumVal(cEval(node.e,scope,ctx)));
    case "logic": {
      const a = cTruthy(cEval(node.a,scope,ctx));
      if(node.op === "&&") return jBool(a && cTruthy(cEval(node.b,scope,ctx)));
      return jBool(a || cTruthy(cEval(node.b,scope,ctx)));
    }
    case "ternary": return cTruthy(cEval(node.c,scope,ctx)) ? cEval(node.a,scope,ctx) : cEval(node.b,scope,ctx);
    case "bin": {
      if(node.op === "<<"){
        const left = cEval(node.a,scope,ctx);
        if(left.t === "ostream"){
          const right = cEval(node.b,scope,ctx);
          if(right.t === "endl") ctx.out.push("\n");
          else if(right.t === "ostream") cThrow("ใช้ << ต่อกันโดยมี cout แค่ตัวแรก เช่น cout << a << b;", line);
          else ctx.out.push(cppToString(right));
          return left;
        }
        return cBinOp("<<",left,cEval(node.b,scope,ctx),line,ctx);
      }
      const a = cEval(node.a,scope,ctx), b = cEval(node.b,scope,ctx);
      if(a.t === "ostream") cThrow("cout ต้องใช้กับ << เท่านั้น", line);
      if(["==","!=","<","<=",">",">="].includes(node.op)) return cCompare(node.op,a,b,line);
      return cBinOp(node.op,a,b,line,ctx);
    }
    case "assign": {
      const ref = cRef(node.target,scope,ctx);
      let v = cEval(node.e,scope,ctx);
      if(node.op !== "="){
        const cur = ref.get();
        const op = node.op.slice(0,-1);
        v = cBinOp(op,cur,v,line,ctx);
      }
      ref.set(v);
      return ref.get();
    }
    case "preincr": case "postincr": {
      const ref = cRef(node.e,scope,ctx);
      const cur = ref.get();
      if(cur.t === "ptr"){ const nv = {...cur, idx:cur.idx + (node.op === "++" ? 1 : -1)}; ref.set(nv); return node.k === "preincr" ? nv : cur; }
      if(!cIsNum(cur)) cThrow(`ใช้ ${node.op} ได้กับตัวเลขเท่านั้น`, line);
      ref.set(cBinOp(node.op === "++" ? "+" : "-", cur, jInt(1), line, ctx));
      return node.k === "preincr" ? ref.get() : cur;
    }
    case "index": return cRef(node,scope,ctx).get();
    case "member": {
      const obj = cEval(node.obj,scope,ctx);
      if(obj && obj.t === "instance"){
        if(node.name in obj.fields) return obj.fields[node.name];
        if(obj.cls.methods[node.name]) cThrow(`ต้องเรียกเมธอดด้วยวงเล็บ เช่น ${node.name}()`, line);
        cThrow(`${obj.cls.name} ไม่มีฟิลด์ชื่อ “${node.name}”`, line);
      }
      if(obj && (obj.t === "str" || obj.t === "array") && (node.name === "length" || node.name === "size")) cThrow(`ต้องเรียกด้วยวงเล็บ เช่น ${node.name}()`, line);
      cThrow(`“.${node.name}” ใช้ได้กับ struct/object เท่านั้น`, line);
    }
    case "deref": return cRef(node,scope,ctx).get();
    case "addr": {
      if(node.e.k === "index"){
        const obj = cEval(node.e.obj,scope,ctx);
        if(obj.t === "array"){ const i = cNumVal(cEval(node.e.idx,scope,ctx)); return {t:"ptr", arr:obj.v, idx:i, elem:obj.elem}; }
      }
      const ref = cRef(node.e,scope,ctx);
      return {t:"ptr", ref};
    }
    case "cast": return cCoerce(node.type, cEval(node.e,scope,ctx), line, ctx, node.ptr);
    case "sizeoftype": return jInt(cSizeOfType(node.type,node.ptr,ctx));
    case "sizeof": return jInt(cSizeOfValue(cEval(node.e,scope,ctx),ctx));
    case "call": return cEvalCall(node,scope,ctx);
    case "new": { const inst = cRecordOf(ctx,node.type) ? cInstantiate(node.type, node.args.map(a=>cEval(a,scope,ctx)), ctx, line) : cCoerce(node.type, node.args.length ? cEval(node.args[0],scope,ctx) : cDefault(node.type,ctx,line), line, ctx); const box = {v:inst}; return {t:"ptr", ref:{get:()=>box.v, set:v=>{ box.v = v; }}}; }
    case "newarray": { const n = cNumVal(cEval(node.size,scope,ctx)); const arr = Array.from({length:n},()=>cDefault(node.type,ctx,line)); return {t:"ptr", arr, idx:0, elem:node.type}; }
  }
  cThrow("นิพจน์นี้ยังไม่รองรับ", line);
}

function cExecDecl(node,scope,ctx){
  const type = node.type, line = node.line;
  if(type === "void") cThrow("ประกาศตัวแปรชนิด void ไม่ได้", line);
  for(const d of node.decls){
    if(d.name in scope.vars) cThrow(`ประกาศตัวแปร “${d.name}” ซ้ำในบล็อกเดียวกัน`, line);
    if(d.ref){
      if(!d.init) cThrow("reference (&) ต้องกำหนดค่าเริ่มต้นเสมอ", line);
      scope.vars[d.name] = {t:"refbox", ref:cRef(d.init,scope,ctx)};
      scope.types[d.name] = {type, ptr:d.ptr};
      continue;
    }
    let val;
    if(d.dims.length){
      val = cMakeArray(type,d.dims,d.init,scope,ctx,line);
      scope.vars[d.name] = val;
      scope.types[d.name] = val.t === "str" ? {type:"cstr"} : null;
      continue;
    }
    if(d.ptr){
      val = d.init ? cEval(d.init,scope,ctx) : {t:"ptr", nul:true};
      val = cCoerce(type,val,line,ctx,d.ptr);
    }else if(cRecordOf(ctx,type)){
      if(d.init && d.init.k === "initlist") val = cAggregate(type,d.init,scope,ctx,line);
      else if(d.init) val = cCoerce(type,cEval(d.init,scope,ctx),line,ctx);
      else val = cInstantiate(type,(d.ctorArgs || []).map(a=>cEval(a,scope,ctx)),ctx,line);
    }else if(type.startsWith("vector<")){
      if(d.init){ const v = cEval(d.init,scope,ctx); if(v.t !== "array") cThrow("กำหนดค่า vector ด้วย { } เช่น {1, 2, 3}", line); val = cCoerce(type,v,line,ctx); }
      else if(d.ctorArgs && d.ctorArgs.length){ const n = cNumVal(cEval(d.ctorArgs[0],scope,ctx)); const elemType = type.slice(7,-1); const fill = d.ctorArgs.length > 1 ? cCoerce(elemType,cEval(d.ctorArgs[1],scope,ctx),line,ctx) : cDefault(elemType,ctx,line); val = {t:"array", v:Array.from({length:n},()=>fill), elem:elemType, vector:true}; }
      else val = cDefault(type,ctx,line);
    }else{
      if(d.init) val = cEval(d.init,scope,ctx);
      else if(d.ctorArgs && d.ctorArgs.length) val = cEval(d.ctorArgs[0],scope,ctx);
      else val = cDefault(type,ctx,line);
      if(type === "auto" && !d.init) cThrow("ตัวแปร auto ต้องกำหนดค่าเริ่มต้น", line);
      if(val.t === "initlist") val = cEval(val,scope,ctx);
      val = cCoerce(type,val,line,ctx);
    }
    scope.vars[d.name] = val;
    scope.types[d.name] = {type:type === "auto" ? null : type, ptr:d.ptr};
    if(type === "auto") scope.types[d.name] = {type:"auto", ptr:0};
  }
}

function cExecBlock(stmts,scope,ctx,sig){
  for(const st of stmts){ cExec(st,scope,ctx,sig); if(sig.returned || sig.broke || sig.continued) return; }
}
function cLoopBody(body,scope,ctx,sig){
  cExec(body,scope,ctx,sig);
  if(sig.returned) return "return";
  if(sig.broke){ sig.broke = false; return "break"; }
  if(sig.continued) sig.continued = false;
  return "";
}
function cExec(node,scope,ctx,sig){
  if(++ctx.steps > 300000) cThrow("โปรแกรมทำงานนานเกินไป (อาจมีลูปไม่รู้จบ)", node.line);
  ctx.line = node.line || ctx.line;
  switch(node.k){
    case "empty": return;
    case "block": cExecBlock(node.body, new CScope(scope), ctx, sig); return;
    case "decl": cExecDecl(node,scope,ctx); return;
    case "expr": cEval(node.e,scope,ctx); return;
    case "if":
      if(cTruthy(cEval(node.cond,scope,ctx))) cExec(node.then,new CScope(scope),ctx,sig);
      else if(node.els) cExec(node.els,new CScope(scope),ctx,sig);
      return;
    case "while": {
      let guard = 0;
      while(cTruthy(cEval(node.cond,scope,ctx))){
        if(++guard > 200000) cThrow("ลูป while ทำงานนานเกินไป (ลืมเปลี่ยนค่าในเงื่อนไข?)", node.line);
        const r = cLoopBody(node.body,new CScope(scope),ctx,sig);
        if(r) return;
      }
      return;
    }
    case "dowhile": {
      let guard = 0;
      do{
        if(++guard > 200000) cThrow("ลูป do-while ทำงานนานเกินไป", node.line);
        const r = cLoopBody(node.body,new CScope(scope),ctx,sig);
        if(r) return;
      }while(cTruthy(cEval(node.cond,scope,ctx)));
      return;
    }
    case "for": {
      const inner = new CScope(scope);
      if(node.init) cExec(node.init,inner,ctx,sig);
      let guard = 0;
      while(node.cond ? cTruthy(cEval(node.cond,inner,ctx)) : true){
        if(++guard > 200000) cThrow("ลูป for ทำงานนานเกินไป (ตรวจเงื่อนไขและการเพิ่มค่า)", node.line);
        const r = cLoopBody(node.body,new CScope(inner),ctx,sig);
        if(r) return;
        if(node.update) cEval(node.update,inner,ctx);
      }
      return;
    }
    case "rangefor": {
      if(ctx.lang === "c") cThrow("ภาษา C ไม่มี range-based for ให้ใช้ for (int i = 0; ...) แทน", node.line);
      const coll = cEval(node.iter,scope,ctx);
      let items;
      if(coll.t === "array") items = coll.v;
      else if(coll.t === "str") items = null;
      else cThrow("range-based for ใช้ได้กับ array, vector หรือ string", node.line);
      const count = items ? items.length : coll.v.length;
      for(let i=0;i<count;i++){
        const inner = new CScope(scope);
        if(node.d.ref && items){ const arr = items, idx = i; inner.vars[node.d.name] = {t:"refbox", ref:{get:()=>arr[idx], set:v=>{ arr[idx] = coll.elem ? cCoerce(coll.elem,v,node.line,ctx) : v; }}}; }
        else{
          const item = items ? items[i] : cChar(coll.v.charCodeAt(i));
          inner.vars[node.d.name] = node.type === "auto" ? cClone(item) : cCoerce(node.type,item,node.line,ctx);
          inner.types[node.d.name] = {type:node.type === "auto" ? "auto" : node.type, ptr:0};
        }
        const r = cLoopBody(node.body,inner,ctx,sig);
        if(r) return;
      }
      return;
    }
    case "return": sig.value = node.e ? cEval(node.e,scope,ctx) : JNULL; sig.returned = true; return;
    case "break": sig.broke = true; return;
    case "continue": sig.continued = true; return;
  }
  cThrow("คำสั่งนี้ยังไม่รองรับ", node.line);
}

function runCFamily(code,lang){
  const out = [];
  const ctx = {out, steps:0, depth:0, line:0, lang, prog:null, global:null};
  try{
    const {toks, hadComment} = cTokenize(code);
    const prog = cParse(toks,lang);
    ctx.prog = prog;
    ctx.global = new CScope(null);
    prog.globals.forEach(g=>cExecDecl(g,ctx.global,ctx));
    const main = prog.functions.main;
    if(!main) cThrow("ต้องมีฟังก์ชัน int main() { ... } เป็นจุดเริ่มต้นของโปรแกรม", 0);
    cExecBlock(main.body.body, new CScope(ctx.global), ctx, {});
    return {output:out.join(""), error:"", line:0, hasComment:hadComment};
  }catch(e){
    if(e && e.__c) return {output:out.join(""), error:e.message, line:e.line || ctx.line || 0};
    return {output:out.join(""), error:"รันโค้ดไม่สำเร็จ: " + (e && e.message ? e.message : String(e)), line:ctx.line || 0};
  }
}
function runC(code){ return runCFamily(code,"c"); }
function runCpp(code){ return runCFamily(code,"cpp"); }

function executeHelloWorldCode(){
  const exercise = activeLessonExercises()[state.helloExerciseIndex];
  const editor = document.getElementById("helloEditor");
  const code = editor ? editor.value : state.helloDrafts[exercise.id];
  saveHelloDraft(code);
  if(activeLessonConfig().web){
    state.helloOutput = "";
    state.helloError = "";
    state.helloRan = true;
    return {output:"",error:"",line:0};
  }
  const result = activeLessonConfig().run(code);
  state.helloOutput = result.output;
  state.helloError = result.error ? {message:result.error,line:result.line} : "";
  state.helloRan = true;
  return result;
}

function runHelloWorldCode(){
  const result = executeHelloWorldCode();
  state.helloFeedback = result.error
    ? {kind:"error",message:`ตรวจโค้ดบรรทัด ${result.line}: ${result.error}`}
    : null;
  renderHelloWorldLesson();
}

function checkHelloWorldAnswer(){
  const config = activeLessonConfig();
  const exercises = config.exercises;
  const exercise = exercises[state.helloExerciseIndex];
  if(config.web) return checkWebAnswer(config,exercise);
  const result = executeHelloWorldCode();
  if(result.error){
    state.helloFeedback = {kind:"error",message:`ยังตรวจคำตอบไม่ได้ — บรรทัด ${result.line}: ${result.error}`};
    return renderHelloWorldLesson();
  }
  if(normalizeOutput(result.output) !== normalizeOutput(exercise.target)){
    state.helloFeedback = {kind:"error",message:outputMismatchMessage(exercise.target,result.output)};
    return renderHelloWorldLesson();
  }
  if(exercise.requiresComment && !result.hasComment){
    state.helloFeedback = {kind:"error",message:"Output ถูกแล้ว แต่ Exercise นี้ยังต้องมี Comment หนึ่งบรรทัดที่ขึ้นต้นด้วย #"};
    return renderHelloWorldLesson();
  }
  completeLessonExercise(config,exercise);
}

function completeLessonExercise(config,exercise){
  const exercises = config.exercises;
  const progress = pythonCourseProgress();
  const exerciseKey = helloExerciseKey(exercise);
  let rewarded = false;
  let chapterCompletedNow = false;
  if(!progress.completedExercises.includes(exerciseKey)){
    progress.completedExercises.push(exerciseKey);
    rewarded = true;
  }
  const allCompleted = exercises.every(item=>progress.completedExercises.includes(helloExerciseKey(item)));
  if(allCompleted && !progress.completedChapters.includes(state.courseLessonId)){
    progress.completedChapters.push(state.courseLessonId);
    chapterCompletedNow = true;
  }
  savePlayer();
  const unlockNote = config.nextChapterName ? ` และปลดล็อก ${config.nextChapterName} เรียบร้อย ✨` : " สุดยอดมาก ✨";
  state.helloFeedback = {
    kind:"success",
    message:chapterCompletedNow
      ? `ผ่านครบทั้ง ${exercises.length} Exercise แล้ว! บท ${config.title} สำเร็จ${unlockNote}`
      : "คำตอบถูกต้อง! ✓"
  };
  renderHelloWorldLesson();
  if(chapterCompletedNow) showToast(`${config.title} สำเร็จ${config.nextChapterName ? " · ปลดล็อก " + config.nextChapterName : ""}`);
  else if(rewarded) showToast("Exercise สำเร็จ ✓");
}

function webCheckContext(doc,win,code){
  const norm = value => String(value || "").replace(/\s+/g," ").trim();
  const q = sel => doc.querySelector(sel);
  const qa = sel => Array.from(doc.querySelectorAll(sel));
  const text = sel => { const el = q(sel); return el ? norm(el.textContent) : null; };
  const style = (sel,prop) => { const el = q(sel); return el ? win.getComputedStyle(el).getPropertyValue(prop).trim() : ""; };
  const px = (sel,prop) => parseFloat(style(sel,prop)) || 0;
  const color = value => {
    if(!value) return "";
    const probe = doc.createElement("i");
    probe.style.color = value;
    if(!probe.style.color) return `invalid:${value}`;
    (doc.body || doc.documentElement).appendChild(probe);
    const computed = win.getComputedStyle(probe).color;
    probe.remove();
    return computed;
  };
  const colorIs = (sel,prop,expected) => { const value = style(sel,prop); return !!value && value === color(expected); };
  const rules = [];
  const walk = (list,media) => Array.from(list || []).forEach(rule=>{
    if(rule.selectorText !== undefined) rules.push({selector:norm(rule.selectorText),style:rule.style,media});
    else if(rule.cssRules) walk(rule.cssRules,rule.conditionText || (rule.media && rule.media.mediaText) || media);
  });
  Array.from(doc.styleSheets).forEach(sheet=>{ try{ walk(sheet.cssRules,""); }catch(error){} });
  // ค่าที่เขียนไว้ใน rule (ไม่ใช่ค่าที่คำนวณ) · media = regex ของเงื่อนไข @media หรือไม่ใส่ = rule นอก @media
  const decl = (selector,prop,media) => {
    let value = "";
    rules.forEach(rule=>{
      if(!selector.test(rule.selector)) return;
      if(media ? !(rule.media && media.test(rule.media)) : rule.media) return;
      const found = rule.style.getPropertyValue(prop);
      if(found) value = found.trim();
    });
    return value;
  };
  return {doc,win,code:String(code),norm,q,qa,text,style,px,color,colorIs,rules,decl};
}

function evaluateWebExercise(config,exercise,code){
  return new Promise(resolve=>{
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox","allow-same-origin");
    frame.setAttribute("aria-hidden","true");
    frame.tabIndex = -1;
    frame.style.cssText = "position:fixed;left:-10000px;top:0;width:900px;height:700px;border:0;visibility:hidden;";
    let finished = false;
    const finish = () => {
      if(finished) return;
      finished = true;
      let results;
      try{
        const context = webCheckContext(frame.contentDocument,frame.contentWindow,code);
        results = exercise.checks.map(([test,message])=>{
          let ok = false;
          try{ ok = !!test(context); }catch(error){ ok = false; }
          return {ok,message};
        });
      }catch(error){
        results = [{ok:false,message:"ไม่สามารถแสดงผลหน้าเว็บเพื่อตรวจคำตอบได้ ลองกดตรวจอีกครั้ง"}];
      }
      frame.remove();
      resolve(results);
    };
    frame.srcdoc = webPreviewDocument(config,exercise,code);
    frame.onload = finish;
    document.body.appendChild(frame);
    setTimeout(finish,3000);
  });
}

async function checkWebAnswer(config,exercise){
  const editor = document.getElementById("helloEditor");
  const code = editor ? editor.value : (state.helloDrafts[exercise.id] || "");
  saveHelloDraft(code);
  state.helloRan = true;
  if(!code.trim()){
    state.helloFeedback = {kind:"error",message:"ยังไม่มีโค้ด ลองเขียนตามภารกิจก่อนแล้วค่อยกดตรวจคำตอบ"};
    return renderHelloWorldLesson();
  }
  const lessonId = state.courseLessonId;
  const exerciseIndex = state.helloExerciseIndex;
  const results = await evaluateWebExercise(config,exercise,code);
  // ผู้ใช้เปลี่ยนหน้าไประหว่างรอผล → ไม่ต้องแสดงผล
  if(state.screen !== "pythonHelloWorld" || state.courseLessonId !== lessonId || state.helloExerciseIndex !== exerciseIndex) return;
  const failed = results.filter(result=>!result.ok);
  if(failed.length){
    state.helloFeedback = {kind:"error",message:`ผ่าน ${results.length-failed.length}/${results.length} เงื่อนไข · ${failed[0].message}`};
    return renderHelloWorldLesson();
  }
  completeLessonExercise(config,exercise);
}

/* ================= OUTPUT CHALLENGE ================= */
function splitRestrictedExpression(source,delimiter){
  const parts = [];
  let current = "";
  let quote = "";
  let escaped = false;
  let depth = 0;
  for(const char of String(source)){
    if(quote){
      current += char;
      if(escaped){ escaped = false; continue; }
      if(char === "\\"){ escaped = true; continue; }
      if(char === quote) quote = "";
      continue;
    }
    if(char === '"' || char === "'"){ quote = char; current += char; continue; }
    if(char === "("){ depth++; current += char; continue; }
    if(char === ")"){ depth = Math.max(0,depth-1); current += char; continue; }
    if(char === delimiter && depth === 0){ parts.push(current.trim()); current = ""; continue; }
    current += char;
  }
  parts.push(current.trim());
  return parts;
}

function decodeRestrictedString(token){
  const text = String(token).trim();
  const quote = text[0];
  if((quote !== '"' && quote !== "'") || text[text.length-1] !== quote) return {ok:false};
  let value = "";
  for(let index=1;index<text.length-1;index++){
    const char = text[index];
    if(char !== "\\"){ value += char; continue; }
    index++;
    if(index >= text.length-1) return {ok:false};
    const escaped = text[index];
    const replacements = {n:"\n",r:"\r",t:"\t",b:"\b",f:"\f","\\":"\\",'"':'"',"'":"'"};
    value += Object.prototype.hasOwnProperty.call(replacements,escaped) ? replacements[escaped] : escaped;
  }
  return {ok:true,value,type:"string"};
}

function normalizeOutput(value){
  const lines = String(value).replace(/\r\n?/g,"\n").split("\n").map(line=>line.replace(/[ \t]+$/g,""));
  while(lines.length > 1 && lines[lines.length-1] === "") lines.pop();
  return lines.join("\n");
}

function outputMismatchMessage(target,actual){
  const expectedLines = normalizeOutput(target).split("\n");
  const actualLines = normalizeOutput(actual).split("\n");
  const mismatches = [];
  const longest = Math.max(expectedLines.length,actualLines.length);
  for(let index=0;index<longest;index++) if(expectedLines[index] !== actualLines[index]) mismatches.push(index+1);
  const lineText = mismatches.length ? mismatches.join(", ") : "ไม่ทราบบรรทัด";
  const countNote = expectedLines.length !== actualLines.length
    ? ` จำนวนบรรทัดยังไม่ตรง (ของคุณ ${actualLines.length} บรรทัด)`
    : "";
  return `Output ยังไม่ตรงที่บรรทัด ${lineText}.${countNote} ตรวจตัวพิมพ์ ช่องว่างด้านหน้า และการขึ้นบรรทัดใหม่อีกครั้ง`;
}

function outputChallengeKey(language,index){ return OUTPUT_CHALLENGES[language][index].id; }
function outputChallengeUnlocked(language,index){ return index === 0 || player.outputCompleted.includes(outputChallengeKey(language,index-1)); }

function prepareOutputChallenge(language,index){
  const challenges = OUTPUT_CHALLENGES[language];
  const safeIndex = Math.max(0,Math.min(challenges.length-1,index));
  state.language = language;
  state.character = language;
  state.outputIndex = safeIndex;
  const challenge = challenges[safeIndex];
  if(!Object.prototype.hasOwnProperty.call(state.outputDrafts,challenge.id)) state.outputDrafts[challenge.id] = challenge.starter;
  state.outputResult = "";
  state.outputError = "";
  state.outputFeedback = null;
  state.outputHintLevel = 0;
  state.outputRan = false;
}

function outputLineNumbers(code){
  const count = Math.max(1,String(code).replace(/\r\n?/g,"\n").split("\n").length);
  return Array.from({length:count},(_,index)=>index+1).join("\n");
}

function renderOutputFeedback(){
  const feedback = state.outputFeedback;
  if(!feedback) return "";
  if(feedback.solution){
    return `<div class="feedback hint output-feedback"><strong>${feedback.message}</strong><pre><code>${escapeHTML(feedback.solution)}</code></pre></div>`;
  }
  return `<div class="feedback ${feedback.kind} output-feedback">${escapeHTML(feedback.message)}</div>`;
}

function showToast(message){
  const old = document.getElementById("gameToast");
  if(old) old.remove();
  const toast = document.createElement("div");
  toast.id = "gameToast";
  toast.setAttribute("role","status");
  toast.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;padding:12px 18px;border:3px solid #050a1d;border-radius:9px;background:#70f2bd;color:#081027;font-weight:800;box-shadow:5px 5px 0 #030713;";
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),1800);
}

];
MINIGAME_CHARACTERS.forEach(c=>{ const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(c.svg); c.sprite = img; });

const MINI_W = 320, MINI_H = 480, MINI_GROUND = 54;
const mini = {
  phase:"ready", charId:null, ctx:null, canvas:null,
  birdY:MINI_H/2, vel:0, pipes:[], score:0, groundX:0, lastTime:0, tick:0, overAt:0
};
let miniRAF = null, miniKeyHandler = null;

function currentMiniChar(){ return MINIGAME_CHARACTERS.find(c=>c.id === mini.charId) || MINIGAME_CHARACTERS[0]; }

function goMinigameChar(id){
  if(!MINIGAME_CHARACTERS.some(c=>c.id === id)) return;
  mini.charId = id;
  player.minigamePet = id;
  savePlayer();
  document.querySelectorAll(".mini-chip").forEach(chip=>chip.classList.toggle("selected",chip.dataset.char === id));
}

function renderMinigame(){
  if(!mini.charId) mini.charId = (player.minigamePet && MINIGAME_CHARACTERS.some(c=>c.id === player.minigamePet)) ? player.minigamePet : MINIGAME_CHARACTERS[0].id;
  pathLabel.innerHTML = '<b>arcade</b> / flappy_jump<span class="caret"></span>';
  app.innerHTML = `
    <section class="minigame-page" aria-labelledby="miniTitle">
      <div class="mini-head">
        <div class="eyebrow">flappy_jump.exe</div>
        <h1 id="miniTitle">Jump &amp; Dodge</h1>
        <p>แตะ / คลิก / กด Space ให้ตัวละครกระโดด แล้วลอดช่องว่างระหว่างเสาบน–ล่าง เก็บคะแนนให้ไกลที่สุด!</p>
      </div>
      <div class="mini-charbar" role="group" aria-label="เลือกตัวละคร">
        ${MINIGAME_CHARACTERS.map(c=>`<button class="mini-chip ${c.id === mini.charId ? "selected" : ""}" type="button" data-char="${c.id}" onclick="goMinigameChar('${c.id}')" aria-label="เลือก ${escapeHTML(c.name)}">${c.svg}<span>${escapeHTML(c.name)}</span></button>`).join("")}
      </div>
      <div class="mini-stage">
        <canvas id="miniCanvas"></canvas>
        <div class="mini-overlay" id="miniOverlay"></div>
      </div>
      <div class="config-actions"><button class="btn ghost" type="button" onclick="goHome()">← กลับหน้าแรก</button></div>
    </section>
  `;
  setupMinigame();
}

function setupMinigame(){
  const canvas = document.getElementById("miniCanvas");
  if(!canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = MINI_W * dpr;
  canvas.height = MINI_H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  mini.canvas = canvas;
  mini.ctx = ctx;
  resetMiniRound();
  canvas.onpointerdown = event=>{ event.preventDefault(); miniFlap(); };
  miniKeyHandler = event=>{
    if(event.code === "Space" || event.key === " " || event.code === "ArrowUp" || event.key === "ArrowUp"){
      event.preventDefault();
      miniFlap();
    }
  };
  window.addEventListener("keydown", miniKeyHandler);
  startMinigameLoop();
}

function resetMiniRound(){
  mini.phase = "ready";
  mini.birdY = MINI_H/2;
  mini.vel = 0;
  mini.pipes = [];
  mini.score = 0;
  mini.tick = 0;
  updateMiniOverlay();
}

function spawnMiniPipe(){
  const margin = 54, minGapTop = margin, maxGapTop = MINI_H - MINI_GROUND - margin - 140;
  const gapTop = minGapTop + Math.random() * Math.max(20,(maxGapTop - minGapTop));
  mini.pipes.push({x:MINI_W + 10, gapTop, gap:140, passed:false});
}

function miniFlap(){
  if(mini.phase === "ready"){ mini.phase = "playing"; mini.vel = -6.6; updateMiniOverlay(); return; }
  if(mini.phase === "playing"){ mini.vel = -6.6; return; }
  if(mini.phase === "over"){ if(performance.now() - mini.overAt > 450) resetMiniRound(); }
}

function miniGameOver(){
  mini.phase = "over";
  mini.overAt = performance.now();
  if(mini.score > player.minigameBest){
    player.minigameBest = mini.score;
    savePlayer();
    showToast(`สถิติใหม่! ${mini.score} คะแนน`);
  }
  updateMiniOverlay();
}

function miniUpdate(dt){
  mini.tick += dt;
  mini.groundX = (mini.groundX - 2.2 * dt) % 24;
  if(mini.phase === "ready"){
    mini.birdY = MINI_H/2 + Math.sin(mini.tick/12) * 8;
    return;
  }
  if(mini.phase !== "playing") return;
  mini.vel = Math.min(9, mini.vel + 0.42 * dt);
  mini.birdY += mini.vel * dt;

  if(!mini.pipes.length || mini.pipes[mini.pipes.length-1].x <= MINI_W - 190) spawnMiniPipe();
  const pipeW = 54, birdX = 92, halfW = 13, halfH = 12;
  for(const pipe of mini.pipes){
    pipe.x -= 2.2 * dt;
    if(!pipe.passed && pipe.x + pipeW < birdX){ pipe.passed = true; mini.score++; }
    const inX = birdX + halfW > pipe.x && birdX - halfW < pipe.x + pipeW;
    if(inX && (mini.birdY - halfH < pipe.gapTop || mini.birdY + halfH > pipe.gapTop + pipe.gap)){ miniGameOver(); }
  }
  mini.pipes = mini.pipes.filter(pipe=>pipe.x + pipeW > -10);
  if(mini.birdY + halfH >= MINI_H - MINI_GROUND || mini.birdY - halfH <= 0){
    mini.birdY = Math.min(mini.birdY, MINI_H - MINI_GROUND - halfH);
    miniGameOver();
  }
}

function miniDraw(){
  const ctx = mini.ctx; if(!ctx) return;
  const grad = ctx.createLinearGradient(0,0,0,MINI_H);
  grad.addColorStop(0,"#0d1a3f"); grad.addColorStop(1,"#152a55");
  ctx.fillStyle = grad; ctx.fillRect(0,0,MINI_W,MINI_H);
  ctx.fillStyle = "rgba(255,255,255,.5)";
  [[40,60],[120,40],[210,80],[275,50],[70,140],[240,150],[160,30]].forEach(([x,y])=>ctx.fillRect(x,y,2,2));

  const pipeW = 54;
  mini.pipes.forEach(pipe=>{
    drawMiniPipe(ctx, pipe.x, 0, pipeW, pipe.gapTop, false);
    drawMiniPipe(ctx, pipe.x, pipe.gapTop + pipe.gap, pipeW, MINI_H - MINI_GROUND - (pipe.gapTop + pipe.gap), true);
  });

  const gy = MINI_H - MINI_GROUND;
  ctx.fillStyle = "#1c2a52"; ctx.fillRect(0,gy,MINI_W,MINI_GROUND);
  ctx.fillStyle = "#70f2bd";
  for(let x = mini.groundX - 24; x < MINI_W; x += 24){ ctx.fillRect(x, gy, 12, 6); }
  ctx.fillStyle = "#0b1533"; ctx.fillRect(0, gy - 3, MINI_W, 3);

  const birdX = 92, sprite = currentMiniChar().sprite;
  ctx.save();
  ctx.translate(birdX, mini.birdY);
  const tilt = Math.max(-0.5, Math.min(1.1, mini.vel / 10));
  ctx.rotate(mini.phase === "playing" || mini.phase === "over" ? tilt : 0);
  if(sprite && sprite.complete && sprite.naturalWidth){
    ctx.drawImage(sprite, -21, -21, 42, 42);
  }else{
    ctx.fillStyle = "#ffd24a"; ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  if(mini.phase === "playing"){
    ctx.fillStyle = "#fff";
    ctx.font = "800 34px 'JetBrains Mono',monospace";
    ctx.textAlign = "center";
    ctx.lineWidth = 5; ctx.strokeStyle = "#2b2440";
    ctx.strokeText(mini.score, MINI_W/2, 60);
    ctx.fillText(mini.score, MINI_W/2, 60);
  }
}

function drawMiniPipe(ctx,x,y,w,h,capTop){
  if(h <= 0) return;
  const grad = ctx.createLinearGradient(x,0,x+w,0);
  grad.addColorStop(0,"#8b6cff"); grad.addColorStop(.5,"#a48bff"); grad.addColorStop(1,"#6f54d6");
  ctx.fillStyle = grad;
  ctx.strokeStyle = "#2b2440"; ctx.lineWidth = 3;
  ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
  const capH = 14, capY = capTop ? y : y + h - capH;
  ctx.fillStyle = "#ffd45f";
  ctx.fillRect(x - 4, capY, w + 8, capH); ctx.strokeRect(x - 4, capY, w + 8, capH);
}

function updateMiniOverlay(){
  const overlay = document.getElementById("miniOverlay");
  if(!overlay) return;
  overlay.dataset.phase = mini.phase;
  if(mini.phase === "ready"){
    overlay.innerHTML = `<h2>${escapeHTML(currentMiniChar().name)} พร้อมลุย!</h2><div class="mini-sub">แตะ / คลิก / กด <b>Space</b> เพื่อเริ่มและกระโดด</div><div class="mini-hint">สถิติสูงสุด: ${player.minigameBest}</div>`;
  }else if(mini.phase === "over"){
    overlay.innerHTML = `<h2>จบเกม!</h2><div class="mini-score-big">${mini.score}</div><div class="mini-sub">สถิติสูงสุด <b>${player.minigameBest}</b></div><div class="mini-actions"><button class="game-btn" type="button" onclick="resetMiniRound()">เล่นอีกครั้ง ▶</button><button class="game-btn secondary" type="button" onclick="goHome()">กลับหน้าแรก</button></div>`;
  }else{
    overlay.innerHTML = "";
  }
}

function miniLoop(ts){
  const now = ts || performance.now();
  let dt = (now - mini.lastTime) / 16.667;
  if(!isFinite(dt) || dt <= 0) dt = 1;
  dt = Math.min(dt, 2.5);
  mini.lastTime = now;
  miniUpdate(dt);
  miniDraw();
  miniRAF = requestAnimationFrame(miniLoop);
}

function startMinigameLoop(){
  if(miniRAF) cancelAnimationFrame(miniRAF);
  mini.lastTime = performance.now();
  miniRAF = requestAnimationFrame(miniLoop);
}

function stopMinigameLoop(){
  if(miniRAF){ cancelAnimationFrame(miniRAF); miniRAF = null; }
  if(miniKeyHandler){ window.removeEventListener("keydown", miniKeyHandler); miniKeyHandler = null; }
}

initializeProgress();
buildQuizMenu();
render();
</script>
